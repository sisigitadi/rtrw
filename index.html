  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
  :root {
    --brand-50: #EEF8F6;
    --brand-100: #D2EEE9;
    --brand-300: #7CC7B8;
    --brand-500: #2E9583;
    --brand-700: #0E6B5C;
    --brand-900: #063B33;

    --color-bg: #F6F8F7;
    --color-surface: #FFFFFF;
    --color-surface-subtle: #EEF2F0;
    --color-text: #1B2623;
    --color-text-secondary: #5B6B66;
    --color-border: #DDE5E2;
    --color-border-control: #73857F;

    --color-success: #15803D;
    --color-success-bg: #EEF8F0;
    --color-warning: #B45309;
    --color-warning-bg: #FFFBEB;
    --color-error: #B91C1C;
    --color-error-bg: #FEF2F2;
    --color-error-hover: #991B1B;

    --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

    --radius-control: 8px;
    --radius-card: 12px;
    --shadow-sm: 0 1px 2px 0 rgba(27, 38, 35, 0.06), 0 1px 3px 0 rgba(27, 38, 35, 0.04);

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  html {
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.6;
    color: var(--color-text);
    background-color: var(--color-bg);
    overflow-x: hidden;
  }

  img, svg {
    display: block;
    max-width: 100%;
  }

  a {
    color: var(--brand-700);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  a:hover {
    color: var(--brand-900);
  }

  h1, h2, h3, h4, p, ul, ol {
    margin-top: 0;
  }

  h1 {
    font-size: clamp(1.75rem, 1.45rem + 1.25vw, 2.25rem);
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--color-text);
    margin-bottom: var(--space-2);
  }

  h2 {
    font-size: 1.5rem;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--color-text);
    margin-bottom: var(--space-2);
  }

  h3 {
    font-size: 1.125rem;
    line-height: 1.4;
    font-weight: 600;
    color: var(--color-text);
    margin-bottom: var(--space-2);
  }

  :focus-visible {
    outline: 2px solid var(--brand-700);
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .skip-link {
    position: absolute;
    left: -9999px;
    top: 8px;
    z-index: 100;
    padding: 10px 16px;
    background-color: var(--brand-900);
    color: #FFFFFF;
    border-radius: var(--radius-control);
    font-weight: 600;
    text-decoration: none;
  }

  .skip-link:focus {
    left: 12px;
  }

  /* Public Layout */
  .public-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: var(--color-bg);
  }

  .public-header {
    background-color: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: var(--space-4);
  }

  .public-header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .brand-wordmark {
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--brand-700);
    text-decoration: none;
    letter-spacing: -0.01em;
  }

  .brand-wordmark:hover {
    color: var(--brand-900);
  }

  .public-main {
    flex: 1;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: var(--space-6) var(--space-4) var(--space-8);
  }

  /* App Layout */
  .app-shell {
    min-height: 100vh;
    display: flex;
    background-color: var(--color-bg);
  }

  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background-color: rgba(27, 38, 35, 0.45);
    z-index: 45;
  }

  .sidebar-backdrop.is-open {
    display: block;
  }

  .app-sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 280px;
    max-width: 85vw;
    background-color: var(--color-surface);
    border-right: 1px solid var(--color-border);
    padding: var(--space-5) var(--space-3);
    overflow-y: auto;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.18s ease;
    box-shadow: var(--shadow-md);
  }

  .app-sidebar.is-open {
    transform: translateX(0);
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    padding: 0 var(--space-2) var(--space-4);
    border-bottom: 1px solid var(--color-border);
    margin-bottom: var(--space-4);
  }

  .sidebar-brand {
    font-size: 1.0625rem;
    font-weight: 700;
    color: var(--brand-700);
  }

  .sidebar-close-btn {
    display: inline-flex;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }

  .sidebar-group {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .sidebar-group-title {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--color-text-secondary);
    padding: var(--space-1) var(--space-3);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .nav-link {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-height: 44px;
    padding: 10px 12px;
    border-radius: var(--radius-control);
    color: var(--color-text);
    text-decoration: none;
    font-size: 0.9375rem;
    font-weight: 500;
    transition: background-color 0.12s ease, color 0.12s ease;
  }

  .nav-link:hover {
    background-color: var(--brand-50);
    color: var(--brand-900);
  }

  .nav-link.active {
    background-color: var(--brand-100);
    color: var(--brand-900);
    font-weight: 700;
  }

  .nav-link svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .app-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .app-header {
    background-color: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: var(--space-3) var(--space-6);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .header-brand {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
  }

  .app-header-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--color-text);
  }

  .mobile-menu-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
  }

  .header-user {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    margin-left: auto;
  }

  .header-user-info {
    display: flex;
    flex-direction: column;
    text-align: right;
    line-height: 1.3;
  }

  .header-user-name {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--color-text);
  }

  .app-content {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--space-6);
    flex: 1;
  }

  /* Phase 1 Simulator Bar (Disembunyikan untuk Presentasi Demo Klien Bersih) */
  .sim-bar {
    display: none !important;
  }

  .sim-bar-actions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }

  .sim-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    min-width: 44px;
    padding: 6px 12px;
    font-family: var(--font-sans);
    font-size: 0.8125rem;
    font-weight: 600;
    border-radius: var(--radius-control);
    border: 1px solid var(--color-border-control);
    background-color: var(--color-surface);
    color: var(--color-text);
    cursor: pointer;
  }

  .sim-btn:hover {
    background-color: var(--brand-50);
  }

  .sim-btn.active {
    background-color: var(--brand-700);
    border-color: var(--brand-700);
    color: #FFFFFF;
  }

  /* Page Header & Typography Utilities */
  .page-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-4);
    margin-bottom: var(--space-6);
  }

  .page-title {
    font-size: clamp(1.75rem, 1.45rem + 1.25vw, 2.25rem);
    line-height: 1.2;
    font-weight: 700;
    margin-bottom: var(--space-1);
    color: var(--color-text);
  }

  .page-subtitle {
    font-size: 1rem;
    color: var(--color-text-secondary);
    max-width: 70ch;
    margin-bottom: 0;
  }

  .text-sm {
    font-size: 0.875rem;
    line-height: 1.5;
  }

  .text-muted {
    color: var(--color-text-secondary);
  }

  .text-mono {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .measure-70ch {
    max-width: 70ch;
  }

  /* Spacing & Flex Utilities */
  .stack-sm {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  .stack-md {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  .stack-lg {
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .row-between {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .row-gap {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
  }

  /* Cards */
  .card {
    background-color: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .card-header {
    padding: var(--space-4) var(--space-5);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .card-body {
    padding: var(--space-5);
  }

  .card-highlight {
    background-color: var(--brand-700);
    border-color: var(--brand-900);
    color: #FFFFFF;
  }

  .card-highlight h2,
  .card-highlight h3,
  .card-highlight .card-title {
    color: #FFFFFF;
  }

  .card-highlight .text-muted {
    color: var(--brand-100);
  }

  .card-highlight .card-header {
    border-bottom-color: rgba(255, 255, 255, 0.2);
  }

  /* Dashboard Grids */
  .dashboard-hero-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-4);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-4);
  }

  /* Buttons (flat, 8px radius, min 44x44px tap target) */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: 44px;
    min-width: 44px;
    padding: 10px 16px;
    font-family: var(--font-sans);
    font-size: 0.9375rem;
    font-weight: 600;
    line-height: 1.25;
    border-radius: var(--radius-control);
    border: 1px solid transparent;
    box-shadow: none;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }

  .btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .btn:active:not(:disabled) {
    transform: translateY(1px);
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .btn-primary {
    background-color: var(--brand-700);
    border-color: var(--brand-700);
    color: #FFFFFF;
  }

  .btn-primary:hover:not(:disabled) {
    background-color: var(--brand-900);
    border-color: var(--brand-900);
    color: #FFFFFF;
  }

  .btn-secondary {
    background-color: var(--color-surface);
    border-color: var(--color-border-control);
    color: var(--color-text);
  }

  .btn-secondary:hover:not(:disabled) {
    background-color: var(--brand-50);
    border-color: var(--brand-700);
    color: var(--brand-900);
  }

  .btn-danger {
    background-color: var(--color-error);
    border-color: var(--color-error);
    color: #FFFFFF;
  }

  .btn-danger:hover:not(:disabled) {
    background-color: var(--color-error-hover);
    border-color: var(--color-error-hover);
    color: #FFFFFF;
  }

  .btn-ghost {
    background-color: transparent;
    border-color: transparent;
    color: var(--brand-700);
  }

  .btn-ghost:hover:not(:disabled) {
    background-color: var(--brand-50);
    color: var(--brand-900);
  }

  .btn-sm {
    min-height: 44px;
    padding: 8px 12px;
    font-size: 0.875rem;
  }

  /* Forms (8px radius, min 44px height, >= 3:1 control border contrast) */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-4);
  }

  .form-label {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--color-text);
  }

  .form-input,
  .form-select,
  .form-textarea {
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    font-family: var(--font-sans);
    font-size: 1rem;
    line-height: 1.5;
    color: var(--color-text);
    background-color: var(--color-surface);
    border: 1px solid var(--color-border-control);
    border-radius: var(--radius-control);
  }

  .form-textarea {
    min-height: 108px;
    resize: vertical;
  }

  .form-input:hover:not(:disabled),
  .form-select:hover:not(:disabled),
  .form-textarea:hover:not(:disabled) {
    border-color: var(--brand-700);
  }

  .form-input:focus-visible,
  .form-select:focus-visible,
  .form-textarea:focus-visible {
    outline: 2px solid var(--brand-700);
    outline-offset: 1px;
    border-color: var(--brand-700);
  }

  .form-input:disabled,
  .form-select:disabled,
  .form-textarea:disabled {
    background-color: var(--color-surface-subtle);
    color: var(--color-text-secondary);
    cursor: not-allowed;
  }

  .form-hint {
    font-size: 0.875rem;
    color: var(--color-text-secondary);
  }

  .form-error {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--color-error);
  }

  .form-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
    padding-top: var(--space-2);
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    font-size: 0.8125rem;
    font-weight: 600;
    line-height: 1.3;
    border-radius: 6px;
    border: 1px solid transparent;
    white-space: nowrap;
  }

  .badge-success {
    background-color: var(--color-success-bg);
    color: var(--color-success);
    border-color: #BBF7D0;
  }

  .badge-warning {
    background-color: var(--color-warning-bg);
    color: var(--color-warning);
    border-color: #FDE68A;
  }

  .badge-danger {
    background-color: var(--color-error-bg);
    color: var(--color-error);
    border-color: #FECACA;
  }

  .badge-neutral {
    background-color: var(--color-surface-subtle);
    color: var(--color-text);
    border-color: var(--color-border);
  }

  .badge-brand {
    background-color: var(--brand-50);
    color: var(--brand-700);
    border-color: var(--brand-100);
  }

  /* Tables & Responsive Card Reflow */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
  }

  .table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9375rem;
    text-align: left;
  }

  .table th {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--color-text-secondary);
    padding: 12px 14px;
    border-bottom: 1px solid var(--color-border);
    white-space: nowrap;
  }

  .table td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--color-border);
    vertical-align: top;
    color: var(--color-text);
  }

  .table tbody tr:last-child td {
    border-bottom: 0;
  }

  .clickable-row {
    cursor: pointer;
    transition: background-color 0.12s ease;
  }

  .clickable-row:hover {
    background-color: var(--brand-50);
  }

  .pagination {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
    border-top: 1px solid var(--color-border);
  }

  /* Alerts */
  .alert {
    padding: var(--space-4);
    border-radius: var(--radius-control);
    border: 1px solid var(--color-border);
    font-size: 0.9375rem;
    display: flex;
    align-items: flex-start;
    gap: var(--space-3);
  }

  .alert svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .alert-error {
    background-color: var(--color-error-bg);
    border-color: #FECACA;
    color: var(--color-error);
  }

  .alert-success {
    background-color: var(--color-success-bg);
    border-color: #BBF7D0;
    color: var(--color-success);
  }

  .alert-warning {
    background-color: var(--color-warning-bg);
    border-color: #FDE68A;
    color: var(--color-warning);
  }

  .alert-info {
    background-color: var(--brand-50);
    border-color: var(--brand-100);
    color: var(--brand-900);
  }

  /* UI States (Empty / Loading / Error) */
  .empty-state,
  .loading-state,
  .error-state {
    background-color: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    padding: var(--space-8) var(--space-5);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-3);
  }

  .error-state {
    border-color: #FECACA;
    background-color: var(--color-error-bg);
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--brand-100);
    border-top-color: var(--brand-700);
    border-radius: 50%;
    animation: sw-spin 0.8s linear infinite;
  }

  @keyframes sw-spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* Timeline */
  .timeline {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  .timeline-item {
    position: relative;
    padding-left: var(--space-5);
    border-left: 2px solid var(--color-border);
  }

  .timeline-item::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: var(--brand-700);
  }

  /* Modals */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background-color: rgba(27, 38, 35, 0.52);
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4);
  }

  .modal-dialog {
    width: 100%;
    max-width: 540px;
    max-height: 90vh;
    overflow-y: auto;
    background-color: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-sm);
  }

  .modal-header {
    padding: var(--space-4) var(--space-5);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .modal-title {
    margin: 0;
    font-size: 1.125rem;
    font-weight: 700;
  }

  .modal-body {
    padding: var(--space-5);
  }

  .modal-footer {
    padding: var(--space-4) var(--space-5);
    border-top: 1px solid var(--color-border);
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: var(--space-3);
  }

  /* Toasts */
  .toast-container {
    position: fixed;
    right: var(--space-4);
    bottom: var(--space-4);
    z-index: 70;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    max-width: calc(100vw - 32px);
    width: 360px;
  }

  .toast {
    background-color: var(--color-text);
    color: #FFFFFF;
    padding: 12px 16px;
    border-radius: var(--radius-control);
    box-shadow: var(--shadow-sm);
    font-size: 0.9375rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .toast-success {
    background-color: var(--color-success);
  }

  .toast-error {
    background-color: var(--color-error);
  }

  .toast-warning {
    background-color: var(--color-warning);
  }

  .toast-info {
    background-color: var(--brand-900);
  }

  /* Detail Lists & Official Print Sheet */
  .detail-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    margin: 0;
  }

  .detail-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: var(--space-2);
    padding-bottom: var(--space-2);
    border-bottom: 1px solid var(--color-border);
  }

  .detail-row:last-child {
    border-bottom: 0;
    padding-bottom: 0;
  }

  .detail-label {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--color-text-secondary);
  }

  .detail-value {
    font-size: 0.9375rem;
    font-weight: 500;
    color: var(--color-text);
    word-break: break-word;
  }

  .surat-print-sheet {
    background-color: #FFFFFF;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    padding: var(--space-6);
    color: #1B2623;
  }

  /* Tablet Breakpoint (640px+) */
  @media (min-width: 640px) {
    .form-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stats-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  /* Medium-to-Large Breakpoint (768px+) */
  @media (min-width: 768px) {
    .dashboard-hero-grid {
      grid-template-columns: 1.35fr 1fr;
      align-items: stretch;
    }

    .dashboard-hero-grid > .stats-grid {
      grid-template-columns: 1fr;
    }
  }

  /* Mobile Table Card Reflow (< 768px) */
  @media (max-width: 767px) {
    .responsive-table thead {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .responsive-table,
    .responsive-table tbody,
    .responsive-table tr,
    .responsive-table td {
      display: block;
      width: 100%;
    }

    .responsive-table tbody tr {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-3);
    }

    .responsive-table tbody tr:last-child {
      margin-bottom: 0;
    }

    .responsive-table td {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-3);
      padding: 8px 0;
      border-bottom: 1px solid var(--color-border);
      text-align: right;
    }

    .responsive-table td:last-child {
      border-bottom: 0;
    }

    .responsive-table td[data-label]::before {
      content: attr(data-label);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-align: left;
      flex: 0 0 42%;
    }

    .responsive-table td:not([data-label]) {
      justify-content: flex-start;
      text-align: left;
    }

    .responsive-table td:not([data-label])::before {
      display: none;
    }
  }

  /* Desktop Pinned Sidebar (Opsional jika ingin disematkan permanen) */
  @media (min-width: 961px) {
    .app-shell.sidebar-pinned .app-sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      transform: none;
      box-shadow: none;
      z-index: 40;
      width: 264px;
    }

    .app-shell.sidebar-pinned .sidebar-backdrop {
      display: none !important;
    }

    .app-shell.sidebar-pinned .sidebar-close-btn {
      display: none;
    }
  }

  /* Mobile & Tablet Drawer Navigation (<= 960px) */
  @media (max-width: 960px) {
    .mobile-menu-btn {
      display: inline-flex;
    }

    .sidebar-close-btn {
      display: inline-flex;
    }

    .app-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      max-width: 85vw;
      transform: translateX(-100%);
      transition: transform 0.18s ease;
      box-shadow: var(--shadow-sm);
    }

    .app-sidebar.is-open {
      transform: translateX(0);
    }

    .app-header {
      padding: var(--space-3) var(--space-4);
    }

    .sim-bar {
      padding: var(--space-2) var(--space-4);
    }

    .app-content {
      padding: var(--space-4);
    }

    .header-user-info {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  @media print {
    .app-sidebar,
    .sidebar-backdrop,
    .app-header,
    .sim-bar,
    .public-header,
    .no-print,
    .toast-container,
    .modal-backdrop {
      display: none !important;
    }

    body,
    .app-shell,
    .app-main,
    .app-content,
    .public-shell,
    .public-main {
      background-color: #FFFFFF !important;
      padding: 0 !important;
      margin: 0 !important;
      max-width: 100% !important;
      display: block !important;
    }

    .card,
    .surat-print-sheet {
      border: 0 !important;
      box-shadow: none !important;
    }
  }
</style>

  <script>
(function () {

  function getDemoAccounts() {
    var dummy = window.SW_DUMMY || {};
    var list = dummy.penduduk || [];
    var findByRole = function (role, jabatanKeyword) {
      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        if (p.role === role && p.statusMutasi === 'AKTIF') {
          if (!jabatanKeyword || (p.jabatan && p.jabatan.indexOf(jabatanKeyword) !== -1)) {
            return p;
          }
        }
      }
      return null;
    };

    var out = [];
    var warga = findByRole('WARGA', null);
    if (warga) {
      out.push({
        label: 'Warga',
        sub: warga.nama + ' (RT 003)',
        nik: warga.nik,
        pin: warga.pin || '123456'
      });
    }
    var ketuaRt = findByRole('PENGURUS_RT', 'Ketua RT');
    if (ketuaRt) {
      out.push({
        label: 'Pengurus RT',
        sub: ketuaRt.nama + ' (' + ketuaRt.jabatan + ')',
        nik: ketuaRt.nik,
        pin: ketuaRt.pin || '123456'
      });
    }
    var bendaharaRt = findByRole('PENGURUS_RT', 'Bendahara RT');
    if (bendaharaRt) {
      out.push({
        label: 'Bendahara RT',
        sub: bendaharaRt.nama + ' (' + bendaharaRt.jabatan + ')',
        nik: bendaharaRt.nik,
        pin: bendaharaRt.pin || '123456'
      });
    }
    var ketuaRw = findByRole('PENGURUS_RW', 'Ketua RW');
    if (ketuaRw) {
      out.push({
        label: 'Pengurus RW',
        sub: ketuaRw.nama + ' (' + ketuaRw.jabatan + ')',
        nik: ketuaRw.nik,
        pin: ketuaRw.pin || '123456'
      });
    }
    return out;
  }

  window.SIWARGA_VIEWS['/masuk'] = {
    title: 'Masuk',

    render: function () {
      var SW = window.SW;

        return SW.renderLoading('Memuat halaman masuk...');

        return SW.renderEmpty({
          title: 'Belum ada akun warga terdaftar',
          message: 'Hubungi Pengurus RT setempat untuk mendaftarkan Kartu Keluarga dan mendapatkan PIN awal Anda.',
          icon: 'users'

          var isHidden = pinInput.type === 'password';
          pinInput.type = isHidden ? 'text' : 'password';
          togglePinBtn.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
          togglePinBtn.setAttribute('aria-label', isHidden ? 'Sembunyikan PIN' : 'Tampilkan PIN');
        });
      }

      var demoBtns = rootEl.querySelectorAll('.sw-demo-fill');
      for (var i = 0; i < demoBtns.length; i++) {
        demoBtns[i].addEventListener('click', function () {
          if (nikInput) {
            nikInput.value = this.getAttribute('data-demo-nik') || '';
            nikInput.removeAttribute('aria-invalid');
          }
          if (pinInput) {
            pinInput.value = this.getAttribute('data-demo-pin') || '';
            pinInput.removeAttribute('aria-invalid');
          }
          if (nikError) { nikError.hidden = true; }
          if (pinError) { pinError.hidden = true; }
          if (alertBox) { alertBox.hidden = true; }
          if (submitBtn) { submitBtn.focus(); }
        });
      }

      function setFieldError(inputEl, errEl, msg) {
        if (errEl) {
          errEl.textContent = msg || '';
          errEl.hidden = !msg;
        }
        if (inputEl) {
          if (msg) {
            inputEl.setAttribute('aria-invalid', 'true');
          } else {
            inputEl.removeAttribute('aria-invalid');
          }
        }
      }

      function setLoadingState(loading) {
        if (nikInput) { nikInput.disabled = loading; }
        if (pinInput) { pinInput.disabled = loading; }
        if (togglePinBtn) { togglePinBtn.disabled = loading; }
        if (submitBtn) { submitBtn.disabled = loading; }
        if (submitLabel) { submitLabel.textContent = loading ? 'Memeriksa akun...' : 'Masuk'; }
      }

      if (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          if (alertBox) { alertBox.hidden = true; alertBox.innerHTML = ''; }

          var nikVal = nikInput ? nikInput.value.trim() : '';
          var pinVal = pinInput ? pinInput.value.trim() : '';
          var hasError = false;

          if (!SW.validators.isNik(nikVal)) {
            setFieldError(nikInput, nikError, 'NIK wajib berisi tepat 16 digit angka.');
            hasError = true;
          } else {
            setFieldError(nikInput, nikError, '');
          }

          if (!SW.validators.isPin(pinVal)) {
            setFieldError(pinInput, pinError, 'PIN wajib berisi tepat 6 digit angka.');
            hasError = true;
          } else {
            setFieldError(pinInput, pinError, '');
          }

          if (hasError) {
            if (nikError && !nikError.hidden && nikInput) {
              nikInput.focus();
            } else if (pinError && !pinError.hidden && pinInput) {
              pinInput.focus();
            }
            return;
          }

          setLoadingState(true);
          SW.auth.loginAsync(nikVal, pinVal, function (res) {
            SW.toast('Selamat datang, ' + res.user.nama + '.', 'success');
            SW.navigate('/dashboard');
          }, function (err) {
            setLoadingState(false);
            if (alertBox) {
              alertBox.innerHTML = SW.icon('alert-circle') + '<span>' + SW.esc((err && err.error) ? err.error : 'Gagal masuk. Silakan coba lagi.') + '</span>';
              alertBox.hidden = false;
            }
            if (pinInput) {
              pinInput.focus();
            }
          });
        });
      }
    }
  };

  function buildVerifikasiBodyHtml(kode, result) {
    var SW = window.SW;

          '<div><strong>Status Keaslian: TIDAK DITEMUKAN</strong></div>' +
          '<p class="text-sm" style="margin-bottom:0;">Kode verifikasi tidak cocok dengan arsip surat atau surat tersebut belum disahkan oleh Pengurus RW.</p>' +
        '</div>' +
      '</div>' +
      '<dl class="detail-list">' +
        '<div class="detail-row">' +
          '<dt class="detail-label">Status Dokumen</dt>' +
          '<dd class="detail-value"><span class="badge badge-danger">TIDAK DITEMUKAN</span></dd>' +
        '</div>' +
        '<div class="detail-row">' +
          '<dt class="detail-label">Kode yang Diperiksa</dt>' +
          '<dd class="detail-value text-mono">' + SW.esc(kode || '-') + '</dd>' +
        '</div>' +
      '</dl>'
    );
  }

  window.SIWARGA_VIEWS['/verifikasi/:kode'] = {
    title: 'Verifikasi Surat',

    render: function (params) {
      var SW = window.SW;
      var sim = SW.getSimState();
      if (sim === 'loading') {
        return SW.renderLoading('Memeriksa keaslian dokumen surat...');
      }
      if (sim === 'empty') {
        return SW.renderEmpty({
          title: 'Kode verifikasi tidak tersedia',
          message: 'Pindai QR Code yang tertera pada dokumen PDF resmi untuk memeriksa keaslian surat.',
          icon: 'shield-check',
          actionLabel: 'Halaman Masuk',
          actionHref: '/masuk'
        });
      }
      if (sim === 'error') {
        return SW.renderError({
          title: 'Gagal memeriksa kode verifikasi',
          message: 'Terjadi gangguan saat memeriksa data keaslian surat. Silakan coba beberapa saat lagi.'
        });
      }

      var kode = (params && params.kode) ? String(params.kode).trim() : '';
      var isGas = SW.isGasRuntime();
      var statusBlock = isGas
        ? SW.renderLoading('Memeriksa keaslian dokumen surat di server...')
        : buildVerifikasiBodyHtml(kode, SW.api.verifySuratByKode(kode));

          '<article class="surat-print-sheet stack-md" aria-labelledby="verifikasi-heading">' +
            '<div class="row-between">' +
              '<div class="stack-sm">' +
                '<h1 id="verifikasi-heading" class="page-title" style="font-size:1.5rem;margin-bottom:0;">Verifikasi Keaslian Surat</h1>' +
                '<p class="text-sm text-muted" style="margin-bottom:0;">Pemeriksaan dokumen resmi SiWarga RT/RW</p>' +
              '</div>' +
              SW.icon('shield-check') +
            '</div>' +
            '<div id="verifikasi-result-box" class="stack-md">' + statusBlock + '</div>' +
            '<p class="text-sm text-muted measure-70ch" style="margin-bottom:0;">' +
              'Untuk melindungi privasi warga, halaman verifikasi publik tidak menampilkan nama, NIK, atau alamat pemohon. Cocokkan nomor surat pada hasil ini dengan nomor yang tertera di dokumen cetak.' +
            '</p>' +
          '</article>' +
          '<div class="row-between no-print">' +
            '<a href="#/masuk" class="btn btn-secondary">' + SW.icon('arrow-left') + '<span>Ke Halaman Masuk</span></a>' +
            '<button type="button" id="btn-print-verifikasi" class="btn btn-primary"' + printDisabled + '>' + SW.icon('printer') + '<span>Cetak Hasil</span></button>' +
          '</div>' +
        '</div>'
      );
    },

    mount: function (rootEl, params) {
      var SW = window.SW;
      if (SW.getSimState() !== 'normal') {
        return;
      }
      var printBtn = rootEl.querySelector('#btn-print-verifikasi');
      if (printBtn) {
        printBtn.addEventListener('click', function () {
          window.print();
        });
      }

      if (SW.isGasRuntime()) {
        var kode = (params && params.kode) ? String(params.kode).trim() : '';
        var resultBox = rootEl.querySelector('#verifikasi-result-box');
        SW.remote.verifySurat(kode, function (res) {
          if (resultBox) {
            resultBox.innerHTML = buildVerifikasiBodyHtml(kode, res);
          }
          if (printBtn) {
            printBtn.disabled = false;
          }
        }, function (err) {
          if (resultBox) {
            resultBox.innerHTML = SW.renderError({
              title: 'Gagal memeriksa kode verifikasi',
              message: (err && err.error) ? err.error : 'Tidak dapat terhubung ke server verifikasi.'
            });
          }
          if (printBtn) {
            printBtn.disabled = true;
          }
        });
      }
    }
  };
})();
</script>

        });
      }

      if (form) {

          var pemohonId = rootEl.querySelector('#surat-pemohon').value;
          var jenis = rootEl.querySelector('#surat-jenis').value;
          var keperluan = kepEl ? kepEl.value.trim() : '';

          var hasError = false;
          if (!pemohonId) {
            setFormError(rootEl, 'surat-pemohon', 'surat-pemohon-error', 'Pilih pemohon terlebih dahulu.');
            hasError = true;
          } else {
            setFormError(rootEl, 'surat-pemohon', 'surat-pemohon-error', '');
          }
          if (!jenis) {
            setFormError(rootEl, 'surat-jenis', 'surat-jenis-error', 'Pilih jenis surat.');

            setFormError(rootEl, 'surat-jenis', 'surat-jenis-error', '');

          if (!SW.validators.isLength(keperluan, 10, 500)) {
            setFormError(rootEl, 'surat-keperluan', 'surat-keperluan-error', 'Keperluan wajib diisi antara 10 sampai 500 karakter.');
            hasError = true;
          } else {
            setFormError(rootEl, 'surat-keperluan', 'surat-keperluan-error', '');
          }

          if (hasError) {
            return;
          }

          var submitBtn = rootEl.querySelector('#btn-submit-surat');
          var origBtnHtml = submitBtn ? submitBtn.innerHTML : '';
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Mengirim...';

          SW.api.submitSuratAsync({
            pemohonId: Number(pemohonId),
            jenis: jenis,
            keperluan: keperluan,
            modeAsistensi: false
          }, function (res) {
            SW.toast('Pengajuan surat berhasil dikirim.', 'success');

              alertBox.hidden = false;
            }

          previewBox.innerHTML = infoHtml;

              if (thumbEl && ev.target && ev.target.result) {

          var periode = rootEl.querySelector('#iuran-periode').value.trim();
          var nominal = Number(rootEl.querySelector('#iuran-nominal').value);
          var file = fileInput && fileInput.files ? fileInput.files[0] : null;
          var hasError = false;

          if (!SW.validators.isPeriode(periode)) {
            setFormError(rootEl, 'iuran-periode', 'iuran-periode-error', 'Periode wajib format YYYY-MM dan tidak melebihi bulan berjalan.');
            hasError = true;
          } else {
            setFormError(rootEl, 'iuran-periode', 'iuran-periode-error', '');
          }

          if (!SW.validators.isIntInRange(nominal, 1000, 5000000)) {
            setFormError(rootEl, 'iuran-nominal', 'iuran-nominal-error', 'Nominal wajib angka bulat antara Rp 1.000 sampai Rp 5.000.000.');
            hasError = true;

            setFormError(rootEl, 'iuran-nominal', 'iuran-nominal-error', '');

          var fileErr = SW.validators.validateBuktiFile(file);
          if (fileErr) {
            setFormError(rootEl, 'iuran-bukti', 'iuran-bukti-error', fileErr);
            hasError = true;
          } else {
            setFormError(rootEl, 'iuran-bukti', 'iuran-bukti-error', '');
          }

          if (hasError) {
            return;
          }

          var submitBtn = form.querySelector('button[type="submit"]');
          var origBtnHtml = submitBtn ? submitBtn.innerHTML : '';
          function setSubmitting(loading) {
            if (submitBtn) {
              submitBtn.disabled = loading;
              if (loading) {
                submitBtn.textContent = 'Mengunggah...';
              } else {
                submitBtn.innerHTML = origBtnHtml;
              }
            }
          }

          function sendPayload(fileBase64, mimeType) {
            SW.api.submitIuranAsync({
              periode: periode,
              nominal: nominal,
              metodeBayar: 'TRANSFER_BANK',
              fileName: file.name,
              mimeType: mimeType,
              fileBase64: fileBase64,
              buktiKey: file.name
            }, function () {
              SW.toast('Konfirmasi pembayaran iuran berhasil dikirim.', 'success');
              SW.navigate('/iuran');
            }, function (err) {
              setSubmitting(false);
              if (alertBox) {
                alertBox.innerHTML = SW.icon('alert-circle') + '<span>' + SW.esc((err && err.error) ? err.error : 'Gagal mengirim konfirmasi iuran.') + '</span>';
                alertBox.hidden = false;
              }
            });
          }

          var guessedMime = file.type || (/\.pdf$/i.test(file.name) ? 'application/pdf' : (/\.png$/i.test(file.name) ? 'image/png' : 'image/jpeg'));
          setSubmitting(true);

          if (SW.isGasRuntime() && typeof window.FileReader !== 'undefined') {
            var fileReader = new FileReader();
            fileReader.onload = function (readEv) {
              var dataUrl = (readEv && readEv.target && readEv.target.result) ? String(readEv.target.result) : '';
              var commaIdx = dataUrl.indexOf(',');
              var base64Part = commaIdx !== -1 ? dataUrl.slice(commaIdx + 1) : dataUrl;
              sendPayload(base64Part, guessedMime);
            };
            fileReader.onerror = function () {
              setSubmitting(false);
              if (alertBox) {
                alertBox.innerHTML = SW.icon('alert-circle') + '<span>Gagal membaca berkas bukti transfer. Silakan pilih ulang berkas.</span>';
                alertBox.hidden = false;
              }
            };
            fileReader.readAsDataURL(file);
          } else {
            sendPayload('', guessedMime);
          }
        });
      }
    }
  };

      var judulEl = rootEl.querySelector('#laporan-judul');
      var isiEl = rootEl.querySelector('#laporan-isi');
      var judulCount = rootEl.querySelector('#laporan-judul-count');
      var isiCount = rootEl.querySelector('#laporan-isi-count');

      if (judulEl && judulCount) {
        judulEl.addEventListener('input', function () {
          judulCount.textContent = judulEl.value.length + ' / 150';
        });
      }
      if (isiEl && isiCount) {
        isiEl.addEventListener('input', function () {
          isiCount.textContent = isiEl.value.length + ' / 2000';
        });

        form.addEventListener('submit', function (ev) {

          var alertBox = rootEl.querySelector('#laporan-alert');
          var successBox = rootEl.querySelector('#laporan-success-box');
          if (alertBox) { alertBox.hidden = true; }
          if (successBox) { successBox.innerHTML = ''; }

          var jenis = rootEl.querySelector('#laporan-jenis').value;
          var judul = judulEl ? judulEl.value.trim() : '';
          var isi = isiEl ? isiEl.value.trim() : '';
          var hasError = false;

          if (jenis !== 'KEAMANAN' && jenis !== 'ASPIRASI') {
            setFormError(rootEl, 'laporan-jenis', 'laporan-jenis-error', 'Pilih jenis laporan.');
            hasError = true;
          } else {
            setFormError(rootEl, 'laporan-jenis', 'laporan-jenis-error', '');
          }
          if (!SW.validators.isLength(judul, 5, 150)) {
            setFormError(rootEl, 'laporan-judul', 'laporan-judul-error', 'Judul wajib diisi antara 5 sampai 150 karakter.');
            hasError = true;
          } else {
            setFormError(rootEl, 'laporan-judul', 'laporan-judul-error', '');

          if (!SW.validators.isLength(isi, 10, 2000)) {
            setFormError(rootEl, 'laporan-isi', 'laporan-isi-error', 'Isi laporan wajib diisi antara 10 sampai 2.000 karakter.');
            hasError = true;
          } else {
            setFormError(rootEl, 'laporan-isi', 'laporan-isi-error', '');
          }

          if (hasError) {
            return;
          }

          var submitBtn = form.querySelector('button[type="submit"]');
          var origBtnHtml = submitBtn ? submitBtn.innerHTML : '';
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Mengirim...';
          }

          SW.api.createLaporanAsync({ jenis: jenis, judul: judul, isi: isi }, function (res) {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = origBtnHtml;

            form.reset();
            if (judulCount) { judulCount.textContent = '0 / 150'; }
            if (isiCount) { isiCount.textContent = '0 / 2000'; }
            SW.toast('Laporan berhasil dikirim ke Pengurus RT.', 'success');

                    '<div><strong>Laporan Terkirim</strong></div>' +
                    '<div>Laporan "' + SW.esc(savedJudul) + '" telah masuk ke kotak laporan Pengurus RT.</div>' +
                  '</div>' +
                '</div>';
            }
          }, function (err) {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = origBtnHtml;
            }
            if (alertBox) {
              alertBox.innerHTML = SW.icon('alert-circle') + '<span>' + SW.esc((err && err.error) ? err.error : 'Gagal mengirim laporan.') + '</span>';
              alertBox.hidden = false;
            }
          });

          var oldPin = rootEl.querySelector('#pin-lama').value.trim();
          var newPin = rootEl.querySelector('#pin-baru').value.trim();
          var confirmPin = rootEl.querySelector('#pin-konfirmasi').value.trim();
          var hasError = false;

          if (!SW.validators.isPin(oldPin)) {
            setFormError(rootEl, 'pin-lama', 'pin-lama-error', 'PIN lama wajib berisi 6 digit angka.');
            hasError = true;
          } else {
            setFormError(rootEl, 'pin-lama', 'pin-lama-error', '');
          }

          if (!SW.validators.isPin(newPin)) {
            setFormError(rootEl, 'pin-baru', 'pin-baru-error', 'PIN baru wajib berisi 6 digit angka.');
            hasError = true;
          } else if (newPin === oldPin) {
            setFormError(rootEl, 'pin-baru', 'pin-baru-error', 'PIN baru tidak boleh sama dengan PIN lama.');
            hasError = true;
          } else {
            setFormError(rootEl, 'pin-baru', 'pin-baru-error', '');
          }

          if (!SW.validators.isPin(confirmPin)) {
            setFormError(rootEl, 'pin-konfirmasi', 'pin-konfirmasi-error', 'Konfirmasi PIN wajib berisi 6 digit angka.');
            hasError = true;
          } else if (confirmPin !== newPin) {
            setFormError(rootEl, 'pin-konfirmasi', 'pin-konfirmasi-error', 'Konfirmasi PIN baru tidak cocok.');
            hasError = true;
          } else {
            setFormError(rootEl, 'pin-konfirmasi', 'pin-konfirmasi-error', '');
          }

          if (hasError) {
            return;
          }

          var submitBtn = form.querySelector('button[type="submit"]');
          var origBtnHtml = submitBtn ? submitBtn.innerHTML : '';
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Menyimpan...';
          }

          SW.auth.changePinAsync(oldPin, newPin, confirmPin, function () {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = origBtnHtml;
            }
            form.reset();
            SW.toast('PIN akun berhasil diperbarui.', 'success');
            if (successBox) {
              successBox.innerHTML =
                '<div class="alert alert-success" role="status">' +
                  SW.icon('check') +
                  '<span>PIN Anda telah diperbarui. Gunakan PIN baru pada sesi masuk berikutnya.</span>' +
                '</div>';
            }
          }, function (err) {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = origBtnHtml;
            }
            if (alertBox) {
              alertBox.innerHTML = SW.icon('alert-circle') + '<span>' + SW.esc((err && err.error) ? err.error : 'Gagal memperbarui PIN.') + '</span>';
              alertBox.hidden = false;
            }
          });
        });
      }
    }
  };
})();
</script>

  <script>
(function () {
  'use strict';

  window.SIWARGA_VIEWS = window.SIWARGA_VIEWS || {};

  function getSw() {
    return window.SW;
  }

  function setButtonBusy(btn, busy, busyLabel) {
    if (!btn) {
      return;
    }
    if (busy) {
      if (!btn.getAttribute('data-orig-html')) {
        btn.setAttribute('data-orig-html', btn.innerHTML);
      }
      btn.disabled = true;
      if (busyLabel) {
        btn.textContent = busyLabel;
      }
    } else {
      btn.disabled = false;
      var orig = btn.getAttribute('data-orig-html');
      if (orig !== null) {
        btn.innerHTML = orig;
      }
    }
  }

  function handleSimState(emptyOpts) {
    var SW = getSw();
    var state = SW.getSimState();
    if (state === 'loading') {
      return SW.renderLoading('Memuat data wilayah RT...');
    }
    if (state === 'error') {
      return SW.renderError({
        title: 'Gagal memuat data',
        message: 'Terjadi gangguan saat mengambil data RT. Silakan coba muat ulang.'
      });
    }
    if (state === 'empty') {
      return SW.renderEmpty(emptyOpts || {});
    }
    return null;
  }

  function renderPageHeader(opts) {
    var SW = getSw();
    var backHtml = '';
    if (opts.backHref) {
      backHtml =
        '<div style="margin-bottom:12px;">' +
          '<a href="#' + SW.esc(opts.backHref) + '" class="btn btn-ghost btn-sm">' +
            SW.icon('arrow-left') + ' ' + SW.esc(opts.backLabel || 'Kembali') +
          '</a>' +
        '</div>';
    }
    return (
      backHtml +
      '<div class="page-header">' +
        '<div>' +
          '<h1 class="page-title">' + SW.esc(opts.title) + '</h1>' +
          (opts.subtitle ? '<p class="page-subtitle">' + SW.esc(opts.subtitle) + '</p>' : '') +
        '</div>' +
        (opts.actionsHtml ? '<div class="row-gap">' + opts.actionsHtml + '</div>' : '') +
      '</div>'
    );
  }

  function bindPagination(rootEl, onPageChange) {
    var btns = rootEl.querySelectorAll('[data-page]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        var nextPage = parseInt(this.getAttribute('data-page'), 10);
        if (!isNaN(nextPage) && nextPage >= 1) {
          onPageChange(nextPage);
        }
      });
    }
  }

  function bindCharCounter(inputEl, counterEl, minLen, maxLen) {
    if (!inputEl || !counterEl) {
      return;
    }
    function update() {
      var len = String(inputEl.value || '').trim().length;
      if (minLen) {
        counterEl.textContent = len + ' / ' + maxLen + ' karakter (minimal ' + minLen + ')';
      } else {
        counterEl.textContent = len + ' / ' + maxLen + ' karakter';
      }
    }
    inputEl.addEventListener('input', update);
    update();
  }

  function openTempPinModal(opts) {
    var SW = getSw();
    var body =
      '<div class="stack-md">' +
        '<div class="alert alert-warning" role="status">' +
          SW.icon('key') +
          '<div>' +
            '<strong>PIN Sementara (Tampil Satu Kali)</strong><br>' +
            'Catat dan sampaikan PIN ini secara langsung kepada warga. Demi keamanan, PIN ini tidak akan ditampilkan lagi setelah jendela ditutup.' +
          '</div>' +
        '</div>' +
        '<dl class="detail-list">' +
          '<div class="detail-row"><dt class="detail-label">Nama Warga</dt><dd class="detail-value">' + SW.esc(opts.nama) + '</dd></div>' +
          '<div class="detail-row"><dt class="detail-label">NIK</dt><dd class="detail-value text-mono">' + SW.esc(opts.nik) + '</dd></div>' +
          (opts.noKk ? '<div class="detail-row"><dt class="detail-label">No. KK</dt><dd class="detail-value text-mono">' + SW.esc(opts.noKk) + '</dd></div>' : '') +
        '</dl>' +
        '<div class="card" style="background-color:#EEF8F6;border-color:#7CC7B8;text-align:center;padding:20px;">' +
          '<div class="text-sm text-muted">PIN Sementara 6 Digit</div>' +
          '<div class="text-mono" style="font-size:2rem;font-weight:700;letter-spacing:0.2em;color:#063B33;margin-top:4px;">' + SW.esc(opts.tempPin) + '</div>' +
        '</div>' +
      '</div>';

    var footer =
      '<button type="button" class="btn btn-primary" id="btn-pin-modal-ok">Saya Sudah Mencatat PIN</button>';

    SW.openModal({
      title: opts.title || 'PIN Awal Warga',
      bodyHtml: body,
      footerHtml: footer,
      onMount: function () {
        var okBtn = document.getElementById('btn-pin-modal-ok');
        if (okBtn) {
          okBtn.addEventListener('click', function () {
            SW.closeModal();
            if (typeof opts.onDone === 'function') {
              opts.onDone();
            }
          });
        }
      },
      onClose: opts.onDone
    });
  }

  function openRejectModal(opts) {
    var SW = getSw();
    var body =
      '<form id="form-reject-modal" class="stack-md" novalidate>' +
        '<p class="text-sm text-muted">' + SW.esc(opts.description || 'Masukkan alasan penolakan yang jelas untuk pemohon.') + '</p>' +
        '<div class="form-group">' +
          '<label class="form-label" for="reject-alasan-input">Alasan Penolakan</label>' +
          '<textarea id="reject-alasan-input" class="form-textarea" rows="4" maxlength="300" placeholder="Tuliskan alasan penolakan (10 sampai 300 karakter)"></textarea>' +
          '<div class="form-hint" id="reject-alasan-counter">0 / 300 karakter (minimal 10)</div>' +
          '<div class="form-error" id="reject-alasan-error" role="alert" hidden></div>' +
        '</div>' +
      '</form>';

    var footer =
      '<button type="button" class="btn btn-secondary" id="btn-reject-cancel">Batal</button>' +
      '<button type="submit" form="form-reject-modal" class="btn btn-danger" id="btn-reject-submit">' + SW.esc(opts.submitLabel || 'Tolak') + '</button>';

    SW.openModal({
      title: opts.title || 'Tolak Pengajuan',
      bodyHtml: body,
      footerHtml: footer,
      onMount: function () {
        var form = document.getElementById('form-reject-modal');
        var input = document.getElementById('reject-alasan-input');
        var counter = document.getElementById('reject-alasan-counter');
        var errEl = document.getElementById('reject-alasan-error');
        var cancelBtn = document.getElementById('btn-reject-cancel');

        bindCharCounter(input, counter, 10, 300);

        if (cancelBtn) {
          cancelBtn.addEventListener('click', SW.closeModal);
        }

        if (form) {
          form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var val = String(input.value || '').trim();
            if (!SW.validators.isLength(val, 10, 300)) {
              errEl.textContent = 'Alasan penolakan wajib diisi antara 10 sampai 300 karakter.';
              errEl.hidden = false;
              input.focus();
              return;
            }
            errEl.hidden = true;
            var submitBtn = document.getElementById('btn-reject-submit');
            setButtonBusy(submitBtn, true, 'Memproses...');
            if (cancelBtn) {
              cancelBtn.disabled = true;
            }
            opts.onConfirm(val, function (errMsg) {
              setButtonBusy(submitBtn, false);
              if (cancelBtn) {
                cancelBtn.disabled = false;
              }
              if (errMsg) {
                errEl.textContent = errMsg;
                errEl.hidden = false;
                return;
              }
              SW.closeModal();
            });
          });
        }
      }
    });
  }

  function openAddAnggotaModal(kk, onSuccess) {
    var SW = getSw();
    var hubunganOpts = '';
    for (var i = 0; i < SW.HUBUNGAN_KELUARGA.length; i++) {
      var item = SW.HUBUNGAN_KELUARGA[i];
      if (item.code === 'KEPALA_KELUARGA') {
        continue;
      }
      hubunganOpts += '<option value="' + SW.esc(item.code) + '">' + SW.esc(item.label) + '</option>';
    }

    var body =
      '<form id="form-add-anggota-rt" class="stack-md" novalidate>' +
        '<div class="alert alert-info">' +
          SW.icon('users') +
          '<div>Menambahkan anggota ke KK <span class="text-mono">' + SW.esc(kk.noKk) + '</span> (' + SW.esc(kk.blok) + ').</div>' +
        '</div>' +
        '<div id="add-anggota-error" class="alert alert-error" role="alert" hidden></div>' +
        '<div class="form-group">' +
          '<label class="form-label" for="ag-nik">NIK (16 Digit)</label>' +
          '<input id="ag-nik" class="form-input text-mono" type="text" inputmode="numeric" maxlength="16" placeholder="Contoh: 3271010506800099">' +
        '</div>' +
        '<div class="form-group">' +
          '<label class="form-label" for="ag-nama">Nama Lengkap</label>' +
          '<input id="ag-nama" class="form-input" type="text" maxlength="150" placeholder="Nama lengkap sesuai KTP/KK">' +
        '</div>' +
        '<div class="form-grid">' +
          '<div class="form-group">' +
            '<label class="form-label" for="ag-tempat">Tempat Lahir</label>' +
            '<input id="ag-tempat" class="form-input" type="text" maxlength="100" placeholder="Contoh: Bogor">' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label" for="ag-tanggal">Tanggal Lahir</label>' +
            '<input id="ag-tanggal" class="form-input" type="date" max="' + SW.esc(SW.getTodayIsoDate()) + '">' +
          '</div>' +
        '</div>' +
        '<div class="form-grid">' +
          '<div class="form-group">' +
            '<label class="form-label" for="ag-jk">Jenis Kelamin</label>' +
            '<select id="ag-jk" class="form-select">' +
              '<option value="L">Laki-laki (L)</option>' +
              '<option value="P">Perempuan (P)</option>' +
            '</select>' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label" for="ag-hub">Hubungan Keluarga</label>' +
            '<select id="ag-hub" class="form-select">' + hubunganOpts + '</select>' +
          '</div>' +
        '</div>' +
      '</form>';

    var footer =
      '<button type="button" class="btn btn-secondary" id="btn-ag-cancel">Batal</button>' +
      '<button type="submit" form="form-add-anggota-rt" class="btn btn-primary" id="btn-ag-save">Simpan Anggota</button>';

    SW.openModal({
      title: 'Tambah Anggota Keluarga',
      bodyHtml: body,
      footerHtml: footer,
      onMount: function () {
        var cancelBtn = document.getElementById('btn-ag-cancel');
        var form = document.getElementById('form-add-anggota-rt');
        var errBox = document.getElementById('add-anggota-error');

        if (cancelBtn) {
          cancelBtn.addEventListener('click', SW.closeModal);
        }
        if (form) {
          form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var saveBtn = document.getElementById('btn-ag-save');
            setButtonBusy(saveBtn, true, 'Menyimpan...');
            if (cancelBtn) {
              cancelBtn.disabled = true;
            }
            var payload = {
              nik: document.getElementById('ag-nik').value,
              nama: document.getElementById('ag-nama').value,
              tempatLahir: document.getElementById('ag-tempat').value,
              tanggalLahir: document.getElementById('ag-tanggal').value,
              jenisKelamin: document.getElementById('ag-jk').value,
              hubunganKeluarga: document.getElementById('ag-hub').value
            };
            SW.api.addAnggotaAsync(kk.id, payload, function (res) {
              setButtonBusy(saveBtn, false);
              if (cancelBtn) {
                cancelBtn.disabled = false;
              }
              errBox.hidden = true;
              SW.closeModal();
              openTempPinModal({
                title: 'Anggota Keluarga Ditambahkan',
                nama: res.penduduk.nama,
                nik: res.penduduk.nik,
                noKk: kk.noKk,
                tempPin: res.tempPin,
                onDone: function () {
                  if (typeof onSuccess === 'function') {
                    onSuccess();
                  }
                }
              });
            }, function (err) {
              setButtonBusy(saveBtn, false);
              if (cancelBtn) {
                cancelBtn.disabled = false;
              }
              errBox.textContent = (err && err.error) ? err.error : 'Gagal menambahkan anggota.';
              errBox.hidden = false;
            });
          });
        }
      }
    });
  }

  function renderDummyBuktiPreview(buktiKey, nominal, createdAt) {
    var SW = getSw();
    var cleanName = String(buktiKey || 'bukti-transfer.jpg');
    var isPdf = /\.pdf$/i.test(cleanName);
    if (isPdf) {
      return (
        '<div class="card" style="background-color:#F6F8F7;border:1px solid #DDE5E2;">' +
          '<div class="card-header">' +
            '<div class="row-gap">' + SW.icon('file-text') + '<strong>Pratinjau Dokumen PDF</strong></div>' +
            '<span class="badge badge-neutral">PDF</span>' +
          '</div>' +
          '<div class="card-body stack-sm">' +
            '<p class="text-sm"><strong>Nama Berkas:</strong> <span class="text-mono">' + SW.esc(cleanName) + '</span></p>' +
            '<div style="background:#FFFFFF;border:1px dashed #849690;border-radius:8px;padding:16px;">' +

              '<div style="font-weight:700;margin-top:6px;">Nominal Tercatat: ' + SW.esc(SW.formatRupiah(nominal)) + '</div>' +
              '<div class="text-sm text-muted" style="margin-top:4px;">Tanggal Unggah: ' + SW.esc(SW.formatDateTime(createdAt)) + '</div>' +
            '</div>' +

        '</div>'
      );
    }

    return (
      '<div class="card" style="background-color:#F6F8F7;border:1px solid #DDE5E2;">' +
        '<div class="card-header">' +
          '<div class="row-gap">' + SW.icon('eye') + '<strong>Pratinjau Bukti Gambar</strong></div>' +
          '<span class="badge badge-brand">Gambar</span>' +
        '</div>' +
        '<div class="card-body stack-sm">' +
          '<p class="text-sm"><strong>Nama Berkas:</strong> <span class="text-mono">' + SW.esc(cleanName) + '</span></p>' +
          '<div style="background:#FFFFFF;border:1px solid #DDE5E2;border-radius:8px;padding:16px;max-width:420px;">' +
            '<div style="border-bottom:1px solid #DDE5E2;padding-bottom:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">' +
              '<strong style="color:#0E6B5C;">BUKTI TRANSFER BANK</strong>' +
              '<span class="badge badge-success">BERHASIL</span>' +
            '</div>' +
            '<div class="detail-list">' +
              '<div class="detail-row"><span class="detail-label">Nominal Transfer</span><span class="detail-value" style="font-weight:700;">' + SW.esc(SW.formatRupiah(nominal)) + '</span></div>' +
              '<div class="detail-row"><span class="detail-label">Waktu Transaksi</span><span class="detail-value">' + SW.esc(SW.formatDateTime(createdAt)) + '</span></div>' +
              '<div class="detail-row"><span class="detail-label">Berkas</span><span class="detail-value text-mono">' + SW.esc(cleanName) + '</span></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // 1. /rt/penduduk
  var pendudukFilterState = {
    query: '',
    statusHunian: '',
    rtId: '',
    page: 1
  };

  window.SIWARGA_VIEWS['/rt/penduduk'] = {
    title: 'Data Penduduk RT',
    render: function () {
      var SW = getSw();
      var user = SW.auth.getUser();
      var rtLabel = user && user.rt ? 'RT ' + user.rt.nomorRt + ' / RW ' + SW.db.rw.nomorRw : 'Wilayah RT';

      var html = renderPageHeader({
        title: 'Data Kependudukan',
        subtitle: 'Kelola Kartu Keluarga dan data penduduk di wilayah ' + rtLabel + '.',
        actionsHtml: '<a href="#/rt/kk/baru" class="btn btn-primary">' + SW.icon('plus') + ' Tambah KK Baru</a>'
      });

      var simHtml = handleSimState({
        icon: 'users',
        title: 'Belum ada data kependudukan',
        message: 'Tambahkan Kartu Keluarga pertama untuk mulai mencatat warga di wilayah RT Anda.',
        actionLabel: 'Tambah KK Baru',
        actionHref: '/rt/kk/baru'
      });
      if (simHtml) {
        return html + simHtml;
      }

      var effectiveRtId = user.role === 'PENGURUS_RW' && pendudukFilterState.rtId
        ? Number(pendudukFilterState.rtId)
        : (user.rtId || '');

      var rtOptionsHtml = '';
      if (user.role === 'PENGURUS_RW') {
        rtOptionsHtml += '<option value="">Semua RT</option>';
        for (var r = 0; r < SW.db.rtList.length; r++) {
          var rtItem = SW.db.rtList[r];
          var selRt = String(effectiveRtId) === String(rtItem.id) ? ' selected' : '';
          rtOptionsHtml += '<option value="' + SW.esc(rtItem.id) + '"' + selRt + '>RT ' + SW.esc(rtItem.nomorRt) + '</option>';
        }
      } else if (user.rt) {
        rtOptionsHtml += '<option value="' + SW.esc(user.rt.id) + '" selected>RT ' + SW.esc(user.rt.nomorRt) + ' (Wilayah Sendiri)</option>';
      }

      html +=
        '<div class="card" style="margin-bottom:20px;">' +
          '<div class="card-body">' +
            '<form id="form-filter-penduduk" class="form-grid" novalidate>' +
              '<div class="form-group">' +
                '<label class="form-label" for="filter-q">Cari NIK, No. KK, Nama, atau Blok/Alamat</label>' +
                '<input id="filter-q" class="form-input" type="search" value="' + SW.esc(pendudukFilterState.query) + '" placeholder="Ketik NIK, No. KK, nama warga, atau blok">' +
              '</div>' +
              '<div class="form-grid">' +
                '<div class="form-group">' +
                  '<label class="form-label" for="filter-hunian">Status Hunian</label>' +
                  '<select id="filter-hunian" class="form-select">' +
                    '<option value="">Semua Status</option>' +
                    '<option value="TETAP"' + (pendudukFilterState.statusHunian === 'TETAP' ? ' selected' : '') + '>Tetap</option>' +
                    '<option value="KONTRAK_KOS"' + (pendudukFilterState.statusHunian === 'KONTRAK_KOS' ? ' selected' : '') + '>Kontrak/Kos</option>' +
                  '</select>' +
                '</div>' +
                '<div class="form-group">' +
                  '<label class="form-label" for="filter-rt">Wilayah RT</label>' +
                  '<select id="filter-rt" class="form-select"' + (user.role === 'PENGURUS_RT' ? ' disabled' : '') + '>' +
                    rtOptionsHtml +
                  '</select>' +
                '</div>' +
              '</div>' +
              '<div class="form-actions" style="grid-column:1 / -1;">' +
                '<button type="submit" class="btn btn-primary">' + SW.icon('search') + ' Terapkan Pencarian</button>' +
                '<button type="button" id="btn-reset-filter-penduduk" class="btn btn-secondary">Reset Filter</button>' +
              '</div>' +
            '</form>' +
          '</div>' +
        '</div>';

      var groups = SW.api.searchPendudukGrouped({
        query: pendudukFilterState.query,
        rtId: effectiveRtId,
        statusHunian: pendudukFilterState.statusHunian
      });

      if (groups.length === 0) {
        return html + SW.renderEmpty({
          icon: 'users',
          title: 'Data penduduk tidak ditemukan',
          message: 'Tidak ada Kartu Keluarga atau warga yang cocok dengan kata kunci atau filter yang dipilih.'
        });
      }

      var paged = SW.paginate(groups, pendudukFilterState.page, 20);
      pendudukFilterState.page = paged.page;

      var listHtml = '<div class="stack-md">';
      for (var g = 0; g < paged.items.length; g++) {
        var grp = paged.items[g];
        var kk = grp.kk;
        var rtNomor = grp.rt ? grp.rt.nomorRt : '-';

        var rowsHtml = '';
        for (var m = 0; m < grp.anggota.length; m++) {
          var p = grp.anggota[m];
          rowsHtml +=
            '<tr>' +
              '<td data-label="Nama"><strong>' + SW.esc(p.nama) + '</strong>' + (p.isKepalaKeluarga ? ' <span class="badge badge-brand">Kepala KK</span>' : '') + '</td>' +
              '<td data-label="NIK" class="text-mono">' + SW.esc(p.nik) + '</td>' +
              '<td data-label="JK">' + SW.esc(p.jenisKelamin) + '</td>' +
              '<td data-label="Hubungan">' + SW.esc(SW.getHubunganLabel(p.hubunganKeluarga)) + '</td>' +

    mount: function (rootEl, params) {
      var SW = getSw();
      var verifyBtn = document.getElementById('btn-verify-iuran');
      var rejectBtn = document.getElementById('btn-reject-iuran');
      var buktiBox = document.getElementById('rt-iuran-bukti-box');

      function loadDriveBukti() {
        if (!buktiBox || !SW.isGasRuntime()) {
          return;
        }
        buktiBox.innerHTML = SW.renderLoading('Memuat pratinjau bukti transfer dari Google Drive...');
        SW.remote.getBuktiIuran(params.id, function (res) {
          var fileName = res.fileName || 'bukti-transfer';
          var mimeType = res.mimeType || 'image/jpeg';
          var base64 = res.base64 || '';
          var isPdf = mimeType === 'application/pdf' || /\.pdf$/i.test(fileName);
          var dataUri = base64 ? ('data:' + mimeType + ';base64,' + base64) : '';

          var previewInner = '';
          if (!dataUri) {
            previewInner = '<p class="text-sm text-muted">Berkas bukti tidak memiliki konten pratinjau.</p>';
          } else if (isPdf) {
            previewInner =
              '<iframe title="Pratinjau PDF ' + SW.esc(fileName) + '" src="' + dataUri + '" style="width:100%;height:380px;border:1px solid #DDE5E2;border-radius:8px;background:#FFFFFF;"></iframe>';
          } else {
            previewInner =
              '<img src="' + dataUri + '" alt="Bukti transfer ' + SW.esc(fileName) + '" style="max-width:100%;max-height:420px;border-radius:8px;border:1px solid #DDE5E2;">';
          }

          buktiBox.innerHTML =
            '<div class="card" style="background-color:#F6F8F7;border:1px solid #DDE5E2;">' +
              '<div class="card-header">' +
                '<div class="row-gap">' + SW.icon(isPdf ? 'file-text' : 'eye') + '<strong>Pratinjau Bukti Transfer (Google Drive)</strong></div>' +
                '<span class="badge badge-brand">' + SW.esc(isPdf ? 'PDF' : 'Gambar') + '</span>' +
              '</div>' +
              '<div class="card-body stack-sm">' +
                '<p class="text-sm"><strong>Nama Berkas:</strong> <span class="text-mono">' + SW.esc(fileName) + '</span></p>' +
                previewInner +
                (base64 ? '<div><button type="button" id="btn-download-bukti-rt" class="btn btn-secondary btn-sm">Unduh Berkas Bukti</button></div>' : '') +
              '</div>' +
            '</div>';

          var dlBtn = document.getElementById('btn-download-bukti-rt');
          if (dlBtn && typeof SW.downloadBase64File === 'function') {
            dlBtn.addEventListener('click', function () {
              SW.downloadBase64File(base64, mimeType, fileName);
            });
          }
        }, function (err) {
          buktiBox.innerHTML =
            '<div class="alert alert-error" role="alert">' +
              SW.icon('alert-circle') +
              '<div class="stack-sm">' +
                '<div><strong>Gagal memuat bukti transfer:</strong> ' + SW.esc((err && err.error) ? err.error : 'Terjadi kesalahan saat membaca file Drive.') + '</div>' +
                '<div><button type="button" id="btn-retry-bukti-rt" class="btn btn-secondary btn-sm">Muat Ulang Bukti</button></div>' +
              '</div>' +
            '</div>';
          var retryBtn = document.getElementById('btn-retry-bukti-rt');
          if (retryBtn) {
            retryBtn.addEventListener('click', loadDriveBukti);
          }
        });
      }

      if (SW.isGasRuntime()) {
        loadDriveBukti();
      }

      if (verifyBtn) {
        verifyBtn.addEventListener('click', function () {
          setButtonBusy(verifyBtn, true, 'Memverifikasi...');
          SW.api.verifyIuranAsync(params.id, function () {
            setButtonBusy(verifyBtn, false);
            SW.toast('Iuran terverifikasi dan dicatat sebagai pemasukan Kas RT.', 'success');
            SW.rerender();
          }, function (err) {
            setButtonBusy(verifyBtn, false);
            SW.toast((err && err.error) ? err.error : 'Gagal memverifikasi iuran.', 'error');
          });
        });
      }

      if (rejectBtn) {
        rejectBtn.addEventListener('click', function () {
          openRejectModal({
            title: 'Tolak Bukti Iuran',
            description: 'Tuliskan alasan penolakan agar warga dapat mengunggah ulang bukti transfer yang benar.',
            submitLabel: 'Tolak Iuran',
            onConfirm: function (alasan, done) {
              SW.api.rejectIuranAsync(params.id, alasan, function () {
                done('');
                SW.toast('Pengajuan iuran ditolak.', 'info');
                SW.rerender();
              }, function (err) {
                done((err && err.error) ? err.error : 'Gagal menolak iuran.');
              });
            }
          });
        });
      }
    }
  };

  var laporanRtState = { jenis: '', page: 1 };

  window.SIWARGA_VIEWS['/rt/laporan'] = {
    title: 'Kotak Laporan Warga',
    render: function () {
      var SW = getSw();
      var user = SW.auth.getUser();
      var html = renderPageHeader({
        title: 'Kotak Laporan Warga',
        subtitle: 'Laporan keamanan wilayah dan aspirasi dari warga RT Anda (hanya baca).'

      var simHtml = handleSimState({
        icon: 'alert-circle',
        title: 'Kotak laporan kosong',
        message: 'Belum ada laporan keamanan atau aspirasi yang dikirim warga di RT Anda.'
      });
      if (simHtml) {
        return html + simHtml;
      }

      var all = SW.api.getLaporanForRt(user.rtId);
      var filtered = [];
      for (var i = 0; i < all.length; i++) {
        if (!laporanRtState.jenis || all[i].jenis === laporanRtState.jenis) {
          filtered.push(all[i]);
        }
      }

      html +=
        '<div class="card" style="margin-bottom:20px;">' +
          '<div class="card-body row-between">' +
            '<div class="row-gap">' +
              '<label class="form-label" for="filter-laporan-jenis" style="margin:0;">Filter Jenis Laporan:</label>' +
              '<select id="filter-laporan-jenis" class="form-select" style="width:auto;min-width:190px;">' +
                '<option value="">Semua Jenis</option>' +
                '<option value="KEAMANAN"' + (laporanRtState.jenis === 'KEAMANAN' ? ' selected' : '') + '>Keamanan</option>' +
                '<option value="ASPIRASI"' + (laporanRtState.jenis === 'ASPIRASI' ? ' selected' : '') + '>Aspirasi</option>' +

            '</div>' +
            '<span class="text-sm text-muted">Menampilkan ' + filtered.length + ' laporan</span>' +

      if (filtered.length === 0) {
        return html + SW.renderEmpty({
          icon: 'alert-circle',
          title: 'Belum ada laporan warga',
          message: 'Tidak ada laporan dengan filter yang dipilih.'

      var paged = SW.paginate(filtered, laporanRtState.page, 20);

          '<tr class="clickable-row" data-laporan-id="' + SW.esc(lp.id) + '" tabindex="0">' +
