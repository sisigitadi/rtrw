            '<td data-label="Jenis">' + SW.statusBadge('laporan', lp.jenis) + '</td>' +
            '<td data-label="Judul"><strong>' + SW.esc(lp.judul) + '</strong></td>' +
            '<td data-label="Pelapor">' + SW.esc(pelapor ? pelapor.nama : '-') + (kk ? '<div class="text-sm text-muted">' + SW.esc(kk.blok) + '</div>' : '') + '</td>' +
            '<td data-label="Aksi"><button type="button" class="btn btn-secondary btn-sm" data-open-laporan="' + SW.esc(lp.id) + '">' + SW.icon('eye') + ' Baca</button></td>' +
          '</tr>';
      }

      html +=
        '<div class="card">' +
          '<div class="table-wrap">' +
            '<table class="table responsive-table">' +
              '<thead>' +
                '<tr>' +
                  '<th>Tanggal</th>' +
                  '<th>Jenis</th>' +
                  '<th>Judul Laporan</th>' +
                  '<th>Pelapor</th>' +
                  '<th>Aksi</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>' + rows + '</tbody>' +
            '</table>' +
          '</div>' +
          SW.renderPagination(paged, 'data-page') +
        '</div>';

      return html;
    },
    mount: function (rootEl) {
      var SW = getSw();
      var user = SW.auth.getUser();
      var jenisSel = document.getElementById('filter-laporan-jenis');

      if (jenisSel) {
        jenisSel.addEventListener('change', function () {
          laporanRtState.jenis = this.value;
          laporanRtState.page = 1;
          SW.rerender();
        });
      }

      function showLaporanDetail(laporanId) {
        var list = SW.api.getLaporanForRt(user.rtId);
        var found = null;
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === Number(laporanId)) {
            found = list[i];
            break;
          }
        }
        if (!found) {
          return;
        }
        var pelapor = SW.api.getPenduduk(found.pelaporId);
        var kk = pelapor ? SW.api.getKk(pelapor.kkId) : null;

        var body =
          '<div class="stack-md">' +
            '<div class="row-between">' +
              SW.statusBadge('laporan', found.jenis) +
              '<span class="text-sm text-muted">' + SW.esc(SW.formatDateTime(found.createdAt)) + '</span>' +
            '</div>' +
            '<dl class="detail-list">' +
              '<div class="detail-row"><dt class="detail-label">Pelapor</dt><dd class="detail-value">' + SW.esc(pelapor ? pelapor.nama : '-') + '</dd></div>' +
              '<div class="detail-row"><dt class="detail-label">Blok / Alamat</dt><dd class="detail-value">' + SW.esc(kk ? kk.blok + ' - ' + kk.alamat : '-') + '</dd></div>' +
            '</dl>' +
            '<div class="stack-sm">' +
              '<div class="detail-label">Isi Laporan</div>' +
              '<div style="background-color:#F6F8F7;border:1px solid #DDE5E2;border-radius:8px;padding:14px;white-space:pre-wrap;">' + SW.esc(found.isi) + '</div>' +
            '</div>' +
          '</div>';

        SW.openModal({
          title: found.judul,
          bodyHtml: body,
          footerHtml: '<button type="button" class="btn btn-primary" id="btn-close-laporan-modal">Tutup</button>',
          onMount: function () {
            var closeBtn = document.getElementById('btn-close-laporan-modal');
            if (closeBtn) {
              closeBtn.addEventListener('click', SW.closeModal);
            }
          }
        });
      }

      var rowEls = rootEl.querySelectorAll('[data-laporan-id]');
      for (var i = 0; i < rowEls.length; i++) {
        rowEls[i].addEventListener('click', function () {
          showLaporanDetail(this.getAttribute('data-laporan-id'));
        });
        rowEls[i].addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            showLaporanDetail(this.getAttribute('data-laporan-id'));
          }
        });
      }

      bindPagination(rootEl, function (nextPage) {
        laporanRtState.page = nextPage;
        SW.rerender();
      });
    }
  };
})();
</script>

  <script>
(function () {
  'use strict';

  window.SIWARGA_VIEWS = window.SIWARGA_VIEWS || {};

  function getSw() {
    return window.SW;
  }

  function setButtonBusy(btn, busy, busyLabel) {
    if (!btn) {
      return;
    }
    if (busy) {
      if (!btn.getAttribute('data-orig-html')) {
        btn.setAttribute('data-orig-html', btn.innerHTML);
      }
      btn.disabled = true;
      if (busyLabel) {
        btn.textContent = busyLabel;
      }
    } else {
      btn.disabled = false;
      var orig = btn.getAttribute('data-orig-html');
      if (orig !== null) {
        btn.innerHTML = orig;
      }
    }
  }

  function handleSimState(emptyOpts) {
    var SW = getSw();
    var state = SW.getSimState();
    if (state === 'loading') {
      return SW.renderLoading('Memuat data wilayah RW...');
    }
    if (state === 'error') {
      return SW.renderError({
        title: 'Gagal memuat data',
        message: 'Terjadi gangguan saat mengambil data RW. Silakan coba muat ulang.'
      });
    }
    if (state === 'empty') {
      return SW.renderEmpty(emptyOpts || {});
    }
    return null;
  }

  function renderPageHeader(opts) {
    var SW = getSw();
    var backHtml = '';
    if (opts.backHref) {
      backHtml =
        '<div style="margin-bottom:12px;">' +
          '<a href="#' + SW.esc(opts.backHref) + '" class="btn btn-ghost btn-sm">' +
            SW.icon('arrow-left') + ' ' + SW.esc(opts.backLabel || 'Kembali') +
          '</a>' +
        '</div>';
    }
    return (
      backHtml +
      '<div class="page-header">' +
        '<div>' +
          '<h1 class="page-title">' + SW.esc(opts.title) + '</h1>' +
          (opts.subtitle ? '<p class="page-subtitle">' + SW.esc(opts.subtitle) + '</p>' : '') +
        '</div>' +
        (opts.actionsHtml ? '<div class="row-gap">' + opts.actionsHtml + '</div>' : '') +
      '</div>'
    );
  }

  function bindPagination(rootEl, onPageChange) {
    var btns = rootEl.querySelectorAll('[data-page]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        var nextPage = parseInt(this.getAttribute('data-page'), 10);
        if (!isNaN(nextPage) && nextPage >= 1) {
          onPageChange(nextPage);
        }
      });
    }
  }

  function bindCharCounter(inputEl, counterEl, minLen, maxLen) {
    if (!inputEl || !counterEl) {
      return;
    }
    function update() {
      var len = String(inputEl.value || '').trim().length;
      if (minLen) {
        counterEl.textContent = len + ' / ' + maxLen + ' karakter (minimal ' + minLen + ')';
      } else {
        counterEl.textContent = len + ' / ' + maxLen + ' karakter';
      }
    }
    inputEl.addEventListener('input', update);
    update();
  }

  function openRwRejectModal(opts) {
    var SW = getSw();
    var body =
      '<form id="form-rw-reject-modal" class="stack-md" novalidate>' +
        '<p class="text-sm text-muted">' + SW.esc(opts.description || 'Masukkan alasan penolakan yang jelas untuk pemohon dan pengurus RT.') + '</p>' +
        '<div class="form-group">' +
          '<label class="form-label" for="rw-reject-alasan">Alasan Penolakan</label>' +
          '<textarea id="rw-reject-alasan" class="form-textarea" rows="4" maxlength="300" placeholder="Tuliskan alasan penolakan (10 sampai 300 karakter)"></textarea>' +
          '<div class="form-hint" id="rw-reject-counter">0 / 300 karakter (minimal 10)</div>' +
          '<div class="form-error" id="rw-reject-error" role="alert" hidden></div>' +
        '</div>' +
      '</form>';

    var footer =
      '<button type="button" class="btn btn-secondary" id="btn-rw-reject-cancel">Batal</button>' +
      '<button type="submit" form="form-rw-reject-modal" class="btn btn-danger" id="btn-rw-reject-submit">Tolak Permohonan</button>';

    SW.openModal({
      title: opts.title || 'Tolak Permohonan Surat',
      bodyHtml: body,
      footerHtml: footer,
      onMount: function () {
        var form = document.getElementById('form-rw-reject-modal');
        var input = document.getElementById('rw-reject-alasan');
        var counter = document.getElementById('rw-reject-counter');
        var errEl = document.getElementById('rw-reject-error');
        var cancelBtn = document.getElementById('btn-rw-reject-cancel');

        bindCharCounter(input, counter, 10, 300);

        if (cancelBtn) {
          cancelBtn.addEventListener('click', SW.closeModal);
        }

        if (form) {
          form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var val = String(input.value || '').trim();
            if (!SW.validators.isLength(val, 10, 300)) {
              errEl.textContent = 'Alasan penolakan wajib diisi antara 10 sampai 300 karakter.';
              errEl.hidden = false;
              input.focus();
              return;
            }
            errEl.hidden = true;
            var submitBtn = document.getElementById('btn-rw-reject-submit');
            setButtonBusy(submitBtn, true, 'Memproses...');
            if (cancelBtn) {
              cancelBtn.disabled = true;
            }
            opts.onConfirm(val, function (errMsg) {
              setButtonBusy(submitBtn, false);
              if (cancelBtn) {
                cancelBtn.disabled = false;
              }
              if (errMsg) {
                errEl.textContent = errMsg;
                errEl.hidden = false;
                return;
              }
              SW.closeModal();
            });
          });
        }
      }
    });
  }

  // 1. /rw/surat

        return html + SW.renderEmpty({

        });
      }

      var paged = SW.paginate(list, suratRwPageState.page, 20);

        rows +=

            '<td data-label="Persetujuan RT">' +

      html +=

                  '<th>RT</th>' +

              '</thead>' +
              '<tbody>' + rows + '</tbody>' +
            '</table>' +
          '</div>' +
          SW.renderPagination(paged, 'data-page') +
        '</div>';

      return html;
    },
    mount: function (rootEl) {
      var SW = getSw();
      bindPagination(rootEl, function (nextPage) {
        suratRwPageState.page = nextPage;
        SW.rerender();
      });
    }
  };

  // 2. /rw/surat/:id

      html +=

      nik: p.nik,
      kkId: p.kkId,
      nama: p.nama,
      tempatLahir: p.tempatLahir,
      tanggalLahir: p.tanggalLahir,
      jenisKelamin: p.jenisKelamin,
      hubunganKeluarga: p.hubunganKeluarga,
      isKepalaKeluarga: p.isKepalaKeluarga,
      statusMutasi: p.statusMutasi,
      role: p.role,
      jabatan: p.jabatan,
      pinGagal: p.pinGagal,
      terkunciHingga: p.terkunciHingga,
      kk: kk,
      rt: rt,
      rtId: rt ? rt.id : (p.rtId || null),
      rw: db.rw || p.rw || null
    };
  }

  function getCurrentUser() {
    if (isGasRuntime()) {
      if (!getGasToken() || !cachedUser) {
        return null;
      }
      if (cachedUser.statusMutasi && cachedUser.statusMutasi !== 'AKTIF') {
        clearGasSession();
        return null;
      }
      return enrichPenduduk(cachedUser);
    }
    var sess = loadSession();
    if (!sess) {
      return null;
    }
    var p = getPenduduk(sess.userId);
    if (!p || p.statusMutasi !== 'AKTIF') {
      clearSession();
      return null;
    }
    return enrichPenduduk(p);
  }

  function getRtSaldo(rtId) {
    if (isGasRuntime() && db.serverDashboard && db.serverDashboard.kasRt && db.kasRt.length === 0) {
      return db.serverDashboard.kasRt;
    }
    var pemasukan = 0;
    var pengeluaran = 0;
    for (var i = 0; i < db.kasRt.length; i++) {
      var item = db.kasRt[i];
      if (item.rtId === Number(rtId)) {
        if (item.jenis === 'PEMASUKAN') {
          pemasukan += Number(item.nominal) || 0;
        } else if (item.jenis === 'PENGELUARAN') {
          pengeluaran += Number(item.nominal) || 0;
        }
      }
    }
    return {
      pemasukan: pemasukan,
      pengeluaran: pengeluaran,
      saldo: pemasukan - pengeluaran
    };
  }

  function getRwSaldo() {
    if (isGasRuntime() && db.serverRwSaldo) {
      return db.serverRwSaldo;
    }
    var terkonfirmasi = 0;
    var menunggu = 0;
    for (var i = 0; i < db.setoranKas.length; i++) {
      var s = db.setoranKas[i];
      if (s.status === 'TERKONFIRMASI') {
        terkonfirmasi += Number(s.nominal) || 0;
      } else if (s.status === 'MENUNGGU_KONFIRMASI') {
        menunggu += Number(s.nominal) || 0;
      }
    }
    return {
      pemasukan: terkonfirmasi,
      pengeluaran: 0,
      saldo: terkonfirmasi,
      menungguKonfirmasi: menunggu
    };
  }

  function getRekapAntarRt() {
    if (isGasRuntime() && db.serverRekapRt) {
      return db.serverRekapRt;
    }
    var sortedRt = db.rtList.slice().sort(function (a, b) {
      return String(a.nomorRt).localeCompare(String(b.nomorRt));
    });
    var rows = [];
    for (var i = 0; i < sortedRt.length; i++) {
      var rt = sortedRt[i];
      var kkMap = {};
      var kkCount = 0;
      for (var k = 0; k < db.kartuKeluarga.length; k++) {
        var kk = db.kartuKeluarga[k];
        if (kk.rtId === rt.id) {
          kkMap[kk.id] = kk;
          kkCount++;
        }
      }
      var jiwaAktif = 0;
      var jiwaTetap = 0;
      var jiwaKontrak = 0;
      for (var j = 0; j < db.penduduk.length; j++) {
        var p = db.penduduk[j];
        var pKk = kkMap[p.kkId];
        if (pKk && p.statusMutasi === 'AKTIF') {
          jiwaAktif++;
          if (pKk.statusHunian === 'TETAP') {
            jiwaTetap++;
          } else {
            jiwaKontrak++;
          }
        }
      }
      var kas = getRtSaldo(rt.id);
      rows.push({
        rtId: rt.id,
        nomorRt: rt.nomorRt,
        jumlahKk: kkCount,
        jiwaAktif: jiwaAktif,
        jiwaTetap: jiwaTetap,
        jiwaKontrak: jiwaKontrak,
        saldoKasRt: kas.saldo
      });
    }
    return rows;
  }

  // --- Remote GAS Transport & Bootstrap Cache ---
  function applyBootstrapInternal(payload, shouldRerender) {
    if (!payload) {
      return;
    }
    var data = payload.bootstrap ? payload.bootstrap : payload;
    if (data.rw) {
      db.rw = data.rw;
    }
    if (Array.isArray(data.rtList)) {
      db.rtList = data.rtList;
    }
    if (Array.isArray(data.kartuKeluarga)) {
      db.kartuKeluarga = data.kartuKeluarga;
    }
    if (Array.isArray(data.penduduk)) {
      db.penduduk = data.penduduk;
    }
    if (Array.isArray(data.pengajuanSurat)) {
      db.pengajuanSurat = data.pengajuanSurat;
    }
    if (Array.isArray(data.iuran)) {
      db.iuran = data.iuran;
    }
    if (Array.isArray(data.setoranKas)) {
      db.setoranKas = data.setoranKas;
    }
    if (Array.isArray(data.kasRt)) {
      db.kasRt = data.kasRt;
    }
    if (Array.isArray(data.pengumuman)) {
      db.pengumuman = data.pengumuman;
    }
    if (Array.isArray(data.laporanWarga)) {
      db.laporanWarga = data.laporanWarga;
    }
    db.serverDashboard = data.dashboard || data.dashboardSummary || null;
    db.serverRwSaldo = data.kasRwSummary || data.rwSaldo || data.kasRw || null;
    db.serverRekapRt = (Array.isArray(data.rekapRt) && data.rekapRt.length > 0) ? data.rekapRt : null;

    if (data.user) {
      cachedUser = data.user;
    }
    if (shouldRerender !== false) {
      renderCurrentRoute();
    }
  }

  function invokeSyncAsAsync(syncFn, onSuccess, onError) {
    try {
      var res = syncFn();
      if (res && res.ok) {
        if (typeof onSuccess === 'function') {
          onSuccess(res);
        }
      } else {
        if (typeof onError === 'function') {
          onError(res || { ok: false, error: 'Operasi gagal diproses.' });
        }
      }
      return res;
    } catch (err) {
      var errObj = { ok: false, error: (err && err.message) ? err.message : 'Terjadi kesalahan lokal.' };
      if (typeof onError === 'function') {
        onError(errObj);
      }
      return errObj;
    }
  }

  var remote = {
    applyBootstrap: function (bootstrapPayload) {
      applyBootstrapInternal(bootstrapPayload, true);
    },

    run: function (fnName, argsArray, onSuccess, onError) {
      if (!isGasRuntime()) {
        if (typeof onError === 'function') {
          onError({ ok: false, error: 'Mode pratinjau lokal tidak terhubung ke server GAS.' });
        }
        return;
      }

      var handled = false;
      function handleError(errObj) {
        if (handled) {
          return;
        }
        handled = true;
        if (typeof onError === 'function') {
          onError(errObj);
        }
      }

      try {
        var runner = google.script.run
          .withSuccessHandler(function (res) {
            if (handled) {
              return;
            }
            if (res && res.code === 'UNAUTHORIZED') {
              clearGasSession();
              handleError(res);
              toast(res.error || 'Sesi telah berakhir. Silakan masuk kembali.', 'warning');
              navigate('/masuk');
              return;
            }
            if (!res || res.ok === false) {
              handleError(res || { ok: false, error: 'Server tidak mengembalikan respons yang valid.' });
              return;
            }
            handled = true;
            if (res.bootstrap) {
              applyBootstrapInternal(res.bootstrap, false);
            } else if (res.user && res.rtList) {
              applyBootstrapInternal(res, false);
            }
            if (typeof onSuccess === 'function') {
              onSuccess(res);
            }
          })
          .withFailureHandler(function (err) {
            var msg = (err && err.message) ? err.message : 'Gagal menghubungi server. Periksa koneksi Anda.';
            handleError({ ok: false, error: msg });
          });

        var fn = runner[fnName];
        if (typeof fn !== 'function') {
          handleError({ ok: false, error: 'Fungsi server ' + fnName + ' tidak tersedia.' });
          return;
        }
        fn.apply(runner, Array.isArray(argsArray) ? argsArray : []);
      } catch (e) {
        handleError({ ok: false, error: (e && e.message) ? e.message : 'Gagal memanggil fungsi server.' });
      }
    },

    refreshData: function (onSuccess, onError) {
      if (!isGasRuntime()) {
        renderCurrentRoute();
        if (typeof onSuccess === 'function') {
          onSuccess({ ok: true });
        }
        return;
      }
      var token = getGasToken();
      if (!token) {
        clearGasSession();
        if (typeof onError === 'function') {
          onError({ ok: false, code: 'UNAUTHORIZED', error: 'Sesi tidak ditemukan.' });
        }
        navigate('/masuk');
        return;
      }
      var refreshBtn = document.getElementById('btn-refresh-data');
      if (refreshBtn) {
        refreshBtn.disabled = true;
      }
      remote.run('apiGetBootstrap', [token], function (res) {
        if (refreshBtn) {
          refreshBtn.disabled = false;
        }
        applyBootstrapInternal(res, true);
        if (typeof onSuccess === 'function') {
          onSuccess(res);
        }
      }, function (err) {
        if (refreshBtn) {
          refreshBtn.disabled = false;
        }
        if (typeof onError === 'function') {
          onError(err);
        }
      });
    },

    verifySurat: function (kode, onSuccess, onError) {
      if (!isGasRuntime()) {
        var localRes = api.verifySuratByKode(kode);
        var out = {
          ok: true,
          found: Boolean(localRes && localRes.found),
          status: (localRes && localRes.found) ? 'ASLI' : 'TIDAK DITEMUKAN',
          nomorSurat: (localRes && localRes.nomorSurat) ? localRes.nomorSurat : null
        };
        if (typeof onSuccess === 'function') {
          onSuccess(out);
        }
        return out;
      }
      remote.run('apiVerifikasiSurat', [String(kode || '').trim()], onSuccess, onError);
    },

    generateSuratPdf: function (suratId, onSuccess, onError) {
      if (!isGasRuntime()) {
        if (typeof onError === 'function') {
          onError({ ok: false, error: 'Unduh PDF server hanya tersedia pada deployment Google Apps Script.' });
        }
        return;
      }
      remote.run('apiGenerateSuratPdf', [getGasToken(), Number(suratId)], onSuccess, onError);
    },

    getBuktiIuran: function (iuranId, onSuccess, onError) {
      if (!isGasRuntime()) {
        var det = api.getIuranDetail(iuranId);
        if (!det || !det.iuran) {
          if (typeof onError === 'function') {
            onError({ ok: false, error: 'Data iuran tidak ditemukan.' });
          }
          return;
        }
        if (typeof onSuccess === 'function') {
          onSuccess({
            ok: true,
            fileName: det.iuran.buktiKey,
            mimeType: /\.pdf$/i.test(det.iuran.buktiKey || '') ? 'application/pdf' : 'image/jpeg',
            base64: ''
          });
        }
        return;
      }
      remote.run('apiGetBuktiIuran', [getGasToken(), Number(iuranId)], onSuccess, onError);
    }
  };

  // --- Auth & Data Mutations ---
  var auth = {
    getUser: getCurrentUser,

    login: function (nik, pin) {
      var cleanNik = String(nik || '').trim();
      var cleanPin = String(pin || '').trim();

      if (!validators.isNik(cleanNik) || !validators.isPin(cleanPin)) {
        return { ok: false, error: 'NIK harus 16 digit angka dan PIN harus 6 digit angka.' };
      }

      var found = null;
      for (var i = 0; i < db.penduduk.length; i++) {
        if (db.penduduk[i].nik === cleanNik) {
          found = db.penduduk[i];
          break;
        }
      }

      if (!found) {
        return { ok: false, error: 'NIK atau PIN salah.' };
      }

      if (found.terkunciHingga && new Date(found.terkunciHingga).getTime() > Date.now()) {
        return {
          ok: false,
          error: 'Akun terkunci sementara selama 15 menit karena 5 kali PIN salah. Hubungi Pengurus RT untuk reset PIN.'
        };
      }

      if (found.statusMutasi !== 'AKTIF') {
        return { ok: false, error: 'Akun penduduk berstatus non-aktif dan tidak dapat masuk.' };
      }

      if (found.pin !== cleanPin) {
        found.pinGagal = (found.pinGagal || 0) + 1;
        if (found.pinGagal >= MAX_PIN_ATTEMPTS) {
          found.terkunciHingga = new Date(Date.now() + LOCK_DURATION_MS).toISOString();
          return {
            ok: false,
            error: 'Akun terkunci selama 15 menit karena 5 kali PIN salah berturut-turut.'
          };
        }
        return { ok: false, error: 'NIK atau PIN salah.' };
      }

      found.pinGagal = 0;
      found.terkunciHingga = null;
      saveSession(found.id);
      return { ok: true, user: enrichPenduduk(found) };
    },

    loginAsync: function (nik, pin, onSuccess, onError) {
      if (!isGasRuntime()) {
        return invokeSyncAsAsync(function () {
          return auth.login(nik, pin);
        }, onSuccess, onError);
      }
      var cleanNik = String(nik || '').trim();
      var cleanPin = String(pin || '').trim();
      if (!validators.isNik(cleanNik) || !validators.isPin(cleanPin)) {
        if (typeof onError === 'function') {
          onError({ ok: false, error: 'NIK harus 16 digit angka dan PIN harus 6 digit angka.' });
        }
        return;
      }
      remote.run('apiMasuk', [cleanNik, cleanPin], function (res) {
        if (res.token) {
          saveGasToken(res.token);
        }
        if (res.bootstrap) {
          applyBootstrapInternal(res.bootstrap, false);
        } else if (res.user) {
          cachedUser = res.user;
        }
        if (typeof onSuccess === 'function') {
          onSuccess({ ok: true, user: getCurrentUser(), token: res.token, bootstrap: res.bootstrap });
        }
      }, onError);
    },

    logout: function () {
      if (isGasRuntime()) {
        var token = getGasToken();
        clearGasSession();
        closeMobileDrawer();
        if (token) {
          try {
            google.script.run
              .withSuccessHandler(function () {})
              .withFailureHandler(function () {})
              .apiKeluar(token);
          } catch (e) {
            // Best-effort server revoke
          }
        }
        navigate('/masuk');
        return;
      }
      clearSession();
      closeMobileDrawer();
      navigate('/masuk');
    },

    logoutAsync: function (onDone) {
      if (!isGasRuntime()) {
        auth.logout();
        if (typeof onDone === 'function') {
          onDone({ ok: true });
        }
        return;
      }
      var token = getGasToken();
      clearGasSession();
      closeMobileDrawer();
      if (!token) {
        navigate('/masuk');
        if (typeof onDone === 'function') {
          onDone({ ok: true });
        }
        return;
      }
      remote.run('apiKeluar', [token], function () {
        navigate('/masuk');
        if (typeof onDone === 'function') {
          onDone({ ok: true });
        }
      }, function () {
        navigate('/masuk');
        if (typeof onDone === 'function') {
          onDone({ ok: true });
        }
      });
    },

    changePin: function (oldPin, newPin, confirmPin) {
      var user = getCurrentUser();
      if (!user) {
        return { ok: false, error: 'Sesi telah berakhir. Silakan masuk kembali.' };
      }
      var p = getPenduduk(user.id);
      if (!validators.isPin(oldPin) || !validators.isPin(newPin) || !validators.isPin(confirmPin)) {
        return { ok: false, error: 'PIN wajib berupa 6 digit angka.' };
      }
      if (p.pin !== String(oldPin)) {
        return { ok: false, error: 'PIN lama tidak sesuai.' };
      }
      if (newPin !== confirmPin) {
        return { ok: false, error: 'Konfirmasi PIN baru tidak sama.' };
      }
      if (newPin === oldPin) {
        return { ok: false, error: 'PIN baru tidak boleh sama dengan PIN lama.' };
      }
      p.pin = String(newPin);
      p.updatedAt = new Date().toISOString();
      return { ok: true };
    },

    changePinAsync: function (oldPin, newPin, confirmPin, onSuccess, onError) {
      if (!isGasRuntime()) {
        return invokeSyncAsAsync(function () {
          return auth.changePin(oldPin, newPin, confirmPin);
        }, onSuccess, onError);
      }
      remote.run('apiUbahPin', [getGasToken(), String(oldPin || ''), String(newPin || ''), String(confirmPin || '')], onSuccess, onError);
    },

    resetPin: function (pendudukId) {
      var user = getCurrentUser();
      if (!user || user.role !== 'PENGURUS_RT') {
        return { ok: false, error: 'Hanya Pengurus RT yang dapat mereset PIN warga.' };
      }
      var target = getPenduduk(pendudukId);
      if (!target) {
        return { ok: false, error: 'Data penduduk tidak ditemukan.' };
      }
      var targetKk = getKk(target.kkId);
      if (!targetKk || targetKk.rtId !== user.rtId) {
        return { ok: false, error: 'Anda hanya dapat mereset PIN penduduk di wilayah RT Anda.' };
      }
      var tempPin = randomDigits(6);
      target.pin = tempPin;
      target.pinGagal = 0;
      target.terkunciHingga = null;
      target.updatedAt = new Date().toISOString();
      return { ok: true, tempPin: tempPin, penduduk: target };
    },

    resetPinAsync: function (pendudukId, onSuccess, onError) {
      if (!isGasRuntime()) {
        return invokeSyncAsAsync(function () {
          return auth.resetPin(pendudukId);
        }, onSuccess, onError);

      remote.run('apiResetPin', [getGasToken(), Number(pendudukId)], onSuccess, onError);

  var api = {
    getRt: getRt,
    getKk: getKk,
    getPenduduk: getPenduduk,
    enrichPenduduk: enrichPenduduk,
    getRtSaldo: getRtSaldo,
    getRwSaldo: getRwSaldo,
    getRekapAntarRt: getRekapAntarRt,

    getDashboardWarga: function (user) {
      var currentPeriode = getCurrentPeriode();
      var iuranBulan = null;
      for (var i = 0; i < db.iuran.length; i++) {
        var iu = db.iuran[i];
        if (iu.kkId === user.kkId && iu.periode === currentPeriode) {
          if (!iuranBulan || iu.createdAt > iuranBulan.createdAt) {
            iuranBulan = iu;
          }
        }
      }

      var kkMemberIds = {};
      for (var m = 0; m < db.penduduk.length; m++) {
        if (db.penduduk[m].kkId === user.kkId) {
          kkMemberIds[db.penduduk[m].id] = true;
        }
      }

      var suratList = [];
      for (var s = 0; s < db.pengajuanSurat.length; s++) {
        var sr = db.pengajuanSurat[s];
        if (kkMemberIds[sr.pemohonId] && (sr.status === 'DIAJUKAN' || sr.status === 'DISETUJUI_RT')) {
          suratList.push(sr);
        }
      }
      suratList.sort(function (a, b) {
        return String(b.createdAt).localeCompare(String(a.createdAt));
      });

      var pengumumanList = api.getPengumumanForUser(user).slice(0, 5);

      return {
        periodeBerjalan: currentPeriode,
        statusIuran: iuranBulan ? iuranBulan.status : 'BELUM_BAYAR',
        iuranTerakhir: iuranBulan,
        suratAktif: suratList.length > 0 ? suratList[0] : null,
        kasRt: getRtSaldo(user.rtId),
        kasRw: getRwSaldo(),
        pengumumanTerbaru: pengumumanList
      };
    },

    getDashboardRt: function (rtId) {
      var kkMap = {};
      var jumlahKk = 0;
      for (var i = 0; i < db.kartuKeluarga.length; i++) {
        var kk = db.kartuKeluarga[i];
        if (kk.rtId === Number(rtId)) {
          kkMap[kk.id] = kk;
          jumlahKk++;
        }
      }

      var jiwaTetap = 0;
      var jiwaKontrak = 0;
      var pendudukMap = {};
      for (var j = 0; j < db.penduduk.length; j++) {
        var p = db.penduduk[j];
        var pKk = kkMap[p.kkId];
        if (pKk) {
          pendudukMap[p.id] = p;
          if (p.statusMutasi === 'AKTIF') {
            if (pKk.statusHunian === 'TETAP') {
              jiwaTetap++;
            } else {
              jiwaKontrak++;
            }
          }
        }
      }

      var suratDiajukan = 0;
      for (var s = 0; s < db.pengajuanSurat.length; s++) {
        var sr = db.pengajuanSurat[s];
        if (sr.status === 'DIAJUKAN' && pendudukMap[sr.pemohonId]) {
          suratDiajukan++;
        }
      }

      var iuranMenunggu = 0;
      for (var u = 0; u < db.iuran.length; u++) {
        var iu = db.iuran[u];
        if (iu.status === 'MENUNGGU_VERIFIKASI' && kkMap[iu.kkId]) {
          iuranMenunggu++;
        }
      }

      return {
        jumlahKk: jumlahKk,
        jiwaAktifTetap: jiwaTetap,
        jiwaAktifKontrak: jiwaKontrak,
        jiwaAktifTotal: jiwaTetap + jiwaKontrak,
        suratDiajukanCount: suratDiajukan,
        iuranMenungguCount: iuranMenunggu,
        kasRt: getRtSaldo(rtId)
      };
    },

    getDashboardRw: function () {
      var rekap = getRekapAntarRt();
      var totalKk = 0;
      var totalJiwa = 0;
      for (var i = 0; i < rekap.length; i++) {
        totalKk += rekap[i].jumlahKk;
        totalJiwa += rekap[i].jiwaAktif;
      }

      var suratDisetujuiRt = 0;
      for (var s = 0; s < db.pengajuanSurat.length; s++) {
        if (db.pengajuanSurat[s].status === 'DISETUJUI_RT') {
          suratDisetujuiRt++;
        }
      }

      var setoranMenunggu = 0;
      for (var k = 0; k < db.setoranKas.length; k++) {
        if (db.setoranKas[k].status === 'MENUNGGU_KONFIRMASI') {
          setoranMenunggu++;
        }
      }

      return {
        jumlahKk: totalKk,
        jiwaAktifTotal: totalJiwa,
        suratDisetujuiRtCount: suratDisetujuiRt,
        setoranMenungguCount: setoranMenunggu,
        kasRw: getRwSaldo(),
        rekapRt: rekap
      };
    },

    getKeluargaByKkId: function (kkId) {
      var kk = getKk(kkId);
      if (!kk) {

      var anggota = [];
      for (var i = 0; i < db.penduduk.length; i++) {

          anggota.push(db.penduduk[i]);

      }
      return {
        kk: kk,
        rt: getRt(kk.rtId),
        anggota: anggota
      };

    searchPendudukGrouped: function (opts) {
      var q = String((opts && opts.query) || '').trim().toLowerCase();
      var rtId = opts && opts.rtId ? Number(opts.rtId) : null;
      var statusHunian = (opts && opts.statusHunian) || '';

      var groups = [];
      for (var i = 0; i < db.kartuKeluarga.length; i++) {
        var kk = db.kartuKeluarga[i];
        if (rtId && kk.rtId !== rtId) {
          continue;
        }
        if (statusHunian && kk.statusHunian !== statusHunian) {
          continue;
        }
        var anggotaAll = [];
        for (var j = 0; j < db.penduduk.length; j++) {
          if (db.penduduk[j].kkId === kk.id) {
            anggotaAll.push(db.penduduk[j]);
          }
        }
        if (!q) {
          groups.push({ kk: kk, rt: getRt(kk.rtId), anggota: anggotaAll });
          continue;
        }
        var kkMatch = (
          kk.noKk.toLowerCase() === q ||
          kk.alamat.toLowerCase().indexOf(q) !== -1 ||
          kk.blok.toLowerCase().indexOf(q) !== -1
        );
        if (kkMatch) {
          groups.push({ kk: kk, rt: getRt(kk.rtId), anggota: anggotaAll });
          continue;
        }
        var matchingMembers = [];
        for (var m = 0; m < anggotaAll.length; m++) {
          var p = anggotaAll[m];
          if (
            p.nik.indexOf(q) === 0 ||
            p.nama.toLowerCase().indexOf(q) !== -1
          ) {
            matchingMembers.push(p);
          }
        }
        if (matchingMembers.length > 0) {
          groups.push({ kk: kk, rt: getRt(kk.rtId), anggota: matchingMembers });
        }
      }
      return groups;
    },

    addKK: function (payload) {
      var user = getCurrentUser();

        return { ok: false, error: 'Hanya Pengurus RT yang dapat menambahkan KK baru.' };
      }
      var noKk = String(payload.noKk || '').trim();
      var alamat = String(payload.alamat || '').trim();
      var blok = String(payload.blok || '').trim();
      var statusHunian = payload.statusHunian;

      var nik = String(payload.nik || '').trim();
      var nama = String(payload.nama || '').trim();
      var tempatLahir = String(payload.tempatLahir || '').trim();
      var tanggalLahir = String(payload.tanggalLahir || '').trim();
      var jenisKelamin = payload.jenisKelamin;

      if (!validators.isNoKk(noKk)) {
        return { ok: false, error: 'Nomor KK wajib 16 digit angka.' };

        }
      }

      }
      if (!validators.isLength(blok, 1, 20)) {
        return { ok: false, error: 'Blok wajib diisi, maksimal 20 karakter.' };
      }
      if (statusHunian !== 'TETAP' && statusHunian !== 'KONTRAK_KOS') {
        return { ok: false, error: 'Status hunian tidak valid.' };
      }
      if (!validators.isNik(nik)) {
        return { ok: false, error: 'NIK Kepala Keluarga wajib 16 digit angka.' };
      }
      for (var j = 0; j < db.penduduk.length; j++) {
        if (db.penduduk[j].nik === nik) {
          return { ok: false, error: 'NIK sudah terdaftar di sistem.' };
        }
      }
      if (!validators.isLength(nama, 3, 150)) {
        return { ok: false, error: 'Nama wajib 3 sampai 150 karakter.' };
      }
      if (!tempatLahir) {
        return { ok: false, error: 'Tempat lahir wajib diisi.' };
      }
      if (!validators.isNotFutureDate(tanggalLahir)) {
        return { ok: false, error: 'Tanggal lahir tidak valid atau berada di masa depan.' };
      }
      if (jenisKelamin !== 'L' && jenisKelamin !== 'P') {
        return { ok: false, error: 'Jenis kelamin wajib L atau P.' };
      }

      var nowIso = new Date().toISOString();
      var newKk = {
        id: nextId(db.kartuKeluarga),
        noKk: noKk,
        rtId: user.rtId,
        alamat: alamat,
        blok: blok,
        statusHunian: statusHunian,
        createdAt: nowIso
      };
      db.kartuKeluarga.push(newKk);

      var tempPin = randomDigits(6);

        id: nextId(db.penduduk),

        kkId: newKk.id,
        nama: nama,
        tempatLahir: tempatLahir,
        tanggalLahir: tanggalLahir,
        jenisKelamin: jenisKelamin,
        hubunganKeluarga: 'KEPALA_KELUARGA',
        isKepalaKeluarga: true,
        statusMutasi: 'AKTIF',
        role: 'WARGA',
        jabatan: null,
        pin: tempPin,
        pinGagal: 0,
        terkunciHingga: null,
        createdAt: nowIso,
        updatedAt: nowIso
      };
      db.penduduk.push(kepala);

      return { ok: true, kk: newKk, kepalaKeluarga: kepala, tempPin: tempPin };
    },

    updatePenduduk: function (id, payload) {
      var user = getCurrentUser();
      if (!user) {
        return { ok: false, error: 'Silakan masuk terlebih dahulu.' };
      }
      var target = getPenduduk(id);
      if (!target) {
        return { ok: false, error: 'Data penduduk tidak ditemukan.' };
      }
      var kk = getKk(target.kkId);
      var isRt = user.role === 'PENGURUS_RT' && kk && kk.rtId === user.rtId;
      var isKepalaSameKk = user.isKepalaKeluarga && user.kkId === target.kkId;
      if (!isRt && !isKepalaSameKk) {
        return { ok: false, error: 'Anda tidak memiliki izin mengubah data penduduk ini.' };
      }

      var nama = String(payload.nama || target.nama).trim();
      var tempatLahir = String(payload.tempatLahir || target.tempatLahir).trim();
      var tanggalLahir = String(payload.tanggalLahir || target.tanggalLahir).trim();
      var jenisKelamin = payload.jenisKelamin || target.jenisKelamin;
      var hubunganKeluarga = payload.hubunganKeluarga || target.hubunganKeluarga;
      var statusMutasi = payload.statusMutasi || target.statusMutasi;

      if (!validators.isLength(nama, 3, 150)) {
        return { ok: false, error: 'Nama wajib 3 sampai 150 karakter.' };
      }
      if (!tempatLahir) {
        return { ok: false, error: 'Tempat lahir wajib diisi.' };
      }
      if (!validators.isNotFutureDate(tanggalLahir)) {
        return { ok: false, error: 'Tanggal lahir tidak valid atau berada di masa depan.' };
      }
      if (jenisKelamin !== 'L' && jenisKelamin !== 'P') {
        return { ok: false, error: 'Jenis kelamin wajib L atau P.' };
      }
      if (!target.isKepalaKeluarga && hubunganKeluarga === 'KEPALA_KELUARGA') {
        return { ok: false, error: 'Setiap KK hanya boleh memiliki satu Kepala Keluarga.' };
      }
      if (target.isKepalaKeluarga && hubunganKeluarga !== 'KEPALA_KELUARGA') {
        return { ok: false, error: 'Hubungan Kepala Keluarga tidak dapat diubah langsung.' };
      }

      if (statusMutasi !== target.statusMutasi) {
        if (!isRt) {
          return { ok: false, error: 'Hanya Pengurus RT yang dapat mengubah status mutasi.' };
        }
        if (target.isKepalaKeluarga && statusMutasi !== 'AKTIF') {
          return { ok: false, error: 'Kepala Keluarga aktif tidak dapat dimutasi sebelum ada pengganti.' };
        }
      }

      target.nama = nama;
      target.tempatLahir = tempatLahir;
      target.tanggalLahir = tanggalLahir;
      target.jenisKelamin = jenisKelamin;
      target.hubunganKeluarga = hubunganKeluarga;
      target.statusMutasi = statusMutasi;
      target.updatedAt = new Date().toISOString();

      return { ok: true, penduduk: target };
    },

    getSuratForKk: function (kkId) {

        if (pemohon && pemohon.kkId === Number(kkId)) {
          list.push(s);
        }
      }
      list.sort(function (a, b) {
        return String(b.createdAt).localeCompare(String(a.createdAt));
      });
      return list;

          var rtNama = s.disetujuiRtNama || s.disetujuiRtOlehNama || null;

          var disetujuiRt = s.disetujuiRtOlehId
            ? (getPenduduk(s.disetujuiRtOlehId) || (rtNama ? { id: s.disetujuiRtOlehId, nama: rtNama, jabatan: s.disetujuiRtJabatan || 'Ketua RT' } : null))
            : null;
          var disahkanRw = s.disahkanRwOlehId
            ? (getPenduduk(s.disahkanRwOlehId) || (rwNama ? { id: s.disahkanRwOlehId, nama: rwNama, jabatan: s.disahkanRwJabatan || 'Ketua RW' } : null))
            : null;
          return {

            diajukanOleh: diajukan,
            disetujuiRtOleh: disetujuiRt,
            disahkanRwOleh: disahkanRw
          };
        }
      }

    },

    submitSurat: function (payload) {
      var user = getCurrentUser();
      if (!user) {
        return { ok: false, error: 'Silakan masuk terlebih dahulu.' };
      }
      var pemohon = getPenduduk(payload.pemohonId);
      if (!pemohon || pemohon.statusMutasi !== 'AKTIF') {
        return { ok: false, error: 'Pemohon harus penduduk berstatus AKTIF.' };
      }
      var pemohonKk = getKk(pemohon.kkId);
      var modeAsistensi = Boolean(payload.modeAsistensi);

      if (modeAsistensi) {
        if (user.role !== 'PENGURUS_RT' || !pemohonKk || pemohonKk.rtId !== user.rtId) {
          return { ok: false, error: 'Mode asistensi hanya untuk Pengurus RT terhadap warga di RT sendiri.' };
        }
      } else {
        if (pemohon.kkId !== user.kkId) {
          return { ok: false, error: 'Pemohon harus berasal dari Kartu Keluarga yang sama.' };
        }
      }

      var validJenis = false;
      for (var i = 0; i < JENIS_SURAT.length; i++) {
        if (JENIS_SURAT[i].code === payload.jenis) {
          validJenis = true;
          break;
        }
      }
      if (!validJenis) {
        return { ok: false, error: 'Jenis surat tidak valid.' };
      }

      var keperluan = String(payload.keperluan || '').trim();
      if (!validators.isLength(keperluan, 10, 500)) {
        return { ok: false, error: 'Keperluan wajib diisi antara 10 sampai 500 karakter.' };
      }

      var nowIso = new Date().toISOString();
      var item = {
        id: nextId(db.pengajuanSurat),
        nomorSurat: null,
        jenis: payload.jenis,
        pemohonId: pemohon.id,
        diajukanOlehId: user.id,
        modeAsistensi: modeAsistensi,
        keperluan: keperluan,
        status: 'DIAJUKAN',
        alasanTolak: null,
        disetujuiRtOlehId: null,
        disetujuiRtAt: null,
        disahkanRwOlehId: null,
        disahkanRwAt: null,
        kodeVerifikasi: null,
        createdAt: nowIso,
        updatedAt: nowIso
      };
      db.pengajuanSurat.push(item);
      return { ok: true, surat: item };
    },

    rtApproveSurat: function (id) {

    rwSahkanSurat: function (id) {
      var user = getCurrentUser();
      if (!user || user.role !== 'PENGURUS_RW') {
        return { ok: false, error: 'Akses khusus Pengurus RW.' };
      }
      var detail = api.getSuratDetail(id);
      if (!detail) {
        return { ok: false, error: 'Surat tidak ditemukan.' };
      }
      if (detail.surat.status !== 'DISETUJUI_RT') {
        return { ok: false, error: 'Hanya surat berstatus DISETUJUI_RT yang dapat disahkan.' };
      }

      var now = new Date();
      var yearStr = String(now.getFullYear());
      var romanMonth = ROMAN_MONTHS[now.getMonth()];
      var maxSeq = 0;

      for (var i = 0; i < db.pengajuanSurat.length; i++) {
        var existing = db.pengajuanSurat[i];
        if (existing.nomorSurat) {
          var parts = existing.nomorSurat.split('/');
          if (parts.length === 5 && parts[4] === yearStr) {
            var num = parseInt(parts[0], 10);
            if (!isNaN(num) && num > maxSeq) {
              maxSeq = num;
            }
          }
        }
      }

      var nextSeq = padZero(maxSeq + 1, 3);
      var nomorRt = detail.rt ? padZero(detail.rt.nomorRt, 3) : '000';
      var nomorRw = padZero(db.rw.nomorRw, 3);
      var nomorSurat = nextSeq + '/RT.' + nomorRt + '/RW.' + nomorRw + '/' + romanMonth + '/' + yearStr;

      var kode = randomKodeVerifikasi();
      var existsKode = true;
      while (existsKode) {
        existsKode = false;
        for (var k = 0; k < db.pengajuanSurat.length; k++) {
          if (db.pengajuanSurat[k].kodeVerifikasi === kode) {
            existsKode = true;
            kode = randomKodeVerifikasi();
            break;
          }
        }
      }

      var nowIso = now.toISOString();
      detail.surat.status = 'DISAHKAN_RW';
      detail.surat.nomorSurat = nomorSurat;
      detail.surat.kodeVerifikasi = kode;
      detail.surat.disahkanRwOlehId = user.id;
      detail.surat.disahkanRwAt = nowIso;
      detail.surat.updatedAt = nowIso;

      return { ok: true, surat: detail.surat };
    },

      var detail = api.getSuratDetail(id);

      var cleanAlasan = String(alasan || '').trim();
      if (!validators.isLength(cleanAlasan, 10, 300)) {

      }

    getIuranForKk: function (kkId) {

      for (var i = 0; i < db.iuran.length; i++) {
        if (db.iuran[i].kkId === Number(kkId)) {
          list.push(db.iuran[i]);
        }
      }
      list.sort(function (a, b) {
        if (a.periode !== b.periode) {
          return String(b.periode).localeCompare(String(a.periode));
        }
        return String(b.createdAt).localeCompare(String(a.createdAt));
      });
      return list;
    },

    getIuranQueueRt: function (rtId) {
      var list = [];
      for (var i = 0; i < db.iuran.length; i++) {
        var iu = db.iuran[i];
        var kk = getKk(iu.kkId);
        if (kk && kk.rtId === Number(rtId) && iu.status === 'MENUNGGU_VERIFIKASI') {
          list.push(iu);
        }
      }
      list.sort(function (a, b) {
        return String(b.createdAt).localeCompare(String(a.createdAt));
      });
      return list;

    getIuranDetail: function (id) {
      for (var i = 0; i < db.iuran.length; i++) {
        if (db.iuran[i].id === Number(id)) {
          var iu = db.iuran[i];
          var kk = getKk(iu.kkId);
          var kepala = null;
          for (var j = 0; j < db.penduduk.length; j++) {
            if (db.penduduk[j].kkId === iu.kkId && db.penduduk[j].isKepalaKeluarga) {
              kepala = db.penduduk[j];
              break;
            }
          }
          return {
            iuran: iu,
            kk: kk,
            kepalaKeluarga: kepala,
            diajukanOleh: getPenduduk(iu.diajukanOlehId),
            diverifikasiOleh: iu.diverifikasiOlehId ? getPenduduk(iu.diverifikasiOlehId) : null
          };
        }
      }
      return null;
    },

    submitIuran: function (payload) {
      var user = getCurrentUser();
      if (!user) {
        return { ok: false, error: 'Silakan masuk terlebih dahulu.' };
      }
      var periode = String(payload.periode || '').trim();
      var nominal = Number(payload.nominal);
      var buktiKey = String(payload.buktiKey || '').trim();

      if (!validators.isPeriode(periode)) {
        return { ok: false, error: 'Periode wajib format YYYY-MM dan tidak boleh melebihi bulan berjalan.' };
      }
      if (!validators.isIntInRange(nominal, 1000, 5000000)) {
        return { ok: false, error: 'Nominal wajib angka bulat antara Rp 1.000 sampai Rp 5.000.000.' };
      }
      if (!buktiKey) {
        return { ok: false, error: 'Bukti transfer wajib diunggah.' };
      }

      for (var i = 0; i < db.iuran.length; i++) {
        var existing = db.iuran[i];
        if (
          existing.kkId === user.kkId &&
          existing.periode === periode &&
          (existing.status === 'MENUNGGU_VERIFIKASI' || existing.status === 'TERVERIFIKASI')
        ) {
          return { ok: false, error: 'Sudah ada pengajuan iuran aktif atau terverifikasi untuk periode ini.' };
        }
      }

      var item = {
        id: nextId(db.iuran),
        kkId: user.kkId,
        periode: periode,
        nominal: nominal,
        metodeBayar: 'TRANSFER_BANK',
        buktiKey: buktiKey,
        status: 'MENUNGGU_VERIFIKASI',
        diajukanOlehId: user.id,
        diverifikasiOlehId: null,
        verifiedAt: null,
        alasanTolak: null,
        createdAt: new Date().toISOString()
      };
      db.iuran.push(item);
      return { ok: true, iuran: item };
    },

    verifyIuran: function (id) {
      var user = getCurrentUser();
      if (!user || user.role !== 'PENGURUS_RT') {
        return { ok: false, error: 'Akses khusus Pengurus RT.' };
      }
      var detail = api.getIuranDetail(id);
      if (!detail || !detail.kk || detail.kk.rtId !== user.rtId) {
        return { ok: false, error: 'Data iuran tidak ditemukan di wilayah RT Anda.' };
      }
      if (detail.iuran.status !== 'MENUNGGU_VERIFIKASI') {
        return { ok: false, error: 'Hanya iuran berstatus MENUNGGU_VERIFIKASI yang dapat diverifikasi.' };
      }

      var nowIso = new Date().toISOString();
      detail.iuran.status = 'TERVERIFIKASI';
      detail.iuran.diverifikasiOlehId = user.id;
      detail.iuran.verifiedAt = nowIso;

      var namaKk = detail.kepalaKeluarga ? detail.kepalaKeluarga.nama : detail.kk.noKk;
      var kasEntry = {
        id: nextId(db.kasRt),
        rtId: user.rtId,
        tanggal: getTodayIsoDate(),
        jenis: 'PEMASUKAN',
        kategori: 'Iuran Warga',
        nominal: detail.iuran.nominal,
        keterangan: 'Iuran periode ' + detail.iuran.periode + ' KK ' + detail.kk.noKk + ' (' + namaKk + ')',
        iuranId: detail.iuran.id,
        setoranKasId: null,
        dicatatOlehId: user.id,
        createdAt: nowIso
      };
      db.kasRt.push(kasEntry);

      return { ok: true, iuran: detail.iuran, kas: kasEntry };
    },

    rejectIuran: function (id, alasan) {
      var user = getCurrentUser();
      if (!user || user.role !== 'PENGURUS_RT') {
        return { ok: false, error: 'Akses khusus Pengurus RT.' };
      }
      var detail = api.getIuranDetail(id);
      if (!detail || !detail.kk || detail.kk.rtId !== user.rtId) {
        return { ok: false, error: 'Data iuran tidak ditemukan di wilayah RT Anda.' };
      }
      if (detail.iuran.status !== 'MENUNGGU_VERIFIKASI') {
        return { ok: false, error: 'Hanya iuran berstatus MENUNGGU_VERIFIKASI yang dapat ditolak.' };
      }
      var cleanAlasan = String(alasan || '').trim();
      if (!validators.isLength(cleanAlasan, 10, 300)) {
        return { ok: false, error: 'Alasan penolakan wajib 10 sampai 300 karakter.' };
      }
      var nowIso = new Date().toISOString();
      detail.iuran.status = 'DITOLAK';
      detail.iuran.alasanTolak = cleanAlasan;
      detail.iuran.diverifikasiOlehId = user.id;
      detail.iuran.verifiedAt = nowIso;
      return { ok: true, iuran: detail.iuran };
    },

    getKasRtList: function (rtId) {
      var list = [];
      for (var i = 0; i < db.kasRt.length; i++) {
        if (db.kasRt[i].rtId === Number(rtId)) {
          list.push(db.kasRt[i]);
        }
      }
      list.sort(function (a, b) {

    submitKasRt: function (payload) {
      var user = getCurrentUser();
      if (!user || user.role !== 'PENGURUS_RT') {
        return { ok: false, error: 'Akses khusus Pengurus RT.' };
      }
      var tanggal = String(payload.tanggal || getTodayIsoDate()).trim();
      var jenis = payload.jenis;
      var kategori = String(payload.kategori || '').trim();
      var nominal = Number(payload.nominal);
      var keterangan = String(payload.keterangan || '').trim();

      if (!validators.isNotFutureDate(tanggal)) {
        return { ok: false, error: 'Tanggal tidak valid atau berada di masa depan.' };
      }
      if (jenis !== 'PEMASUKAN' && jenis !== 'PENGELUARAN') {
        return { ok: false, error: 'Jenis transaksi harus PEMASUKAN atau PENGELUARAN.' };
      }
      if (!validators.isLength(kategori, 3, 60)) {
        return { ok: false, error: 'Kategori wajib 3 sampai 60 karakter.' };
      }
      if (keterangan.length > 300) {
        return { ok: false, error: 'Keterangan maksimal 300 karakter.' };
      }
      if (!validators.isIntInRange(nominal, 1000, null)) {
        return { ok: false, error: 'Nominal wajib angka bulat minimal Rp 1.000.' };
      }

      var saldoRt = getRtSaldo(user.rtId).saldo;
      if (jenis === 'PENGELUARAN' && nominal > saldoRt) {
        return { ok: false, error: 'Nominal pengeluaran melebihi saldo kas RT saat ini (' + formatRupiah(saldoRt) + ').' };
      }

      var item = {
        id: nextId(db.kasRt),
        rtId: user.rtId,
        tanggal: tanggal,
        jenis: jenis,
        kategori: kategori,
        nominal: nominal,
        keterangan: keterangan || null,
        iuranId: null,
        setoranKasId: null,
        dicatatOlehId: user.id,
        createdAt: new Date().toISOString()
      };
      db.kasRt.push(item);
      return { ok: true, kas: item };
    },

          return String(b.tanggal).localeCompare(String(a.tanggal));
        }
        return String(b.createdAt).localeCompare(String(a.createdAt));
      });
      return list;

        return { ok: false, error: 'Akses khusus Pengurus RW.' };
      }
      var found = null;
      for (var i = 0; i < db.setoranKas.length; i++) {

      }
      var nowIso = new Date().toISOString();
      found.status = 'TERKONFIRMASI';

      found.dikonfirmasiAt = nowIso;

  function toast(message, type) {
    var root = getToastRoot();
    var kind = type || 'info';
    var node = document.createElement('div');
    node.className = 'toast toast-' + esc(kind);
    node.setAttribute('role', 'status');
    node.setAttribute('aria-live', 'polite');

    var iconName = 'info';

    node.innerHTML =
      '<span class="toast-icon">' + icon(iconName) + '</span>' +
      '<span class="toast-message">' + esc(message) + '</span>' +
      '<button type="button" class="btn btn-ghost btn-sm toast-close" aria-label="Tutup notifikasi">' + icon('x') + '</button>';

    var closeBtn = node.querySelector('.toast-close');
    function removeToast() {
      if (node.parentNode) {
        node.parentNode.removeChild(node);

  function paginate(items, page, pageSize) {
    var size = pageSize || 20;
    var total = items.length;
    var totalPages = Math.max(1, Math.ceil(total / size));
    var current = Math.min(Math.max(1, Number(page) || 1), totalPages);
    var start = (current - 1) * size;
    return {
      items: items.slice(start, start + size),
      page: current,
      pageSize: size,
      total: total,
      totalPages: totalPages
    };
  }

  function renderPagination(meta, attrName) {
    if (!meta || meta.totalPages <= 1) {
      return '';
    }
    var attr = attrName || 'data-page';
    var prevDisabled = meta.page <= 1 ? ' disabled' : '';
    var nextDisabled = meta.page >= meta.totalPages ? ' disabled' : '';
    return (
      '<nav class="pagination" aria-label="Navigasi halaman">' +
        '<button type="button" class="btn btn-secondary btn-sm" ' + attr + '="' + (meta.page - 1) + '"' + prevDisabled + '>' +
          icon('chevron-left') + ' Sebelumnya' +
        '</button>' +
        '<span class="text-sm text-muted">Halaman ' + meta.page + ' dari ' + meta.totalPages + ' (' + meta.total + ' data)</span>' +
        '<button type="button" class="btn btn-secondary btn-sm" ' + attr + '="' + (meta.page + 1) + '"' + nextDisabled + '>' +
          'Berikutnya ' + icon('chevron-right') +
        '</button>' +
      '</nav>'
    );
  }

  function renderQrSvg(code, sizePx) {
    var size = sizePx || 120;
    var grid = 21;
    var cell = size / grid;
    var rects = [];
    var text = String(code || 'SIWARGA');

    function isFinder(r, c) {
      function inSquare(r0, c0) {
        if (r < r0 || r > r0 + 6 || c < c0 || c > c0 + 6) { return -1; }
        var dr = r - r0;
        var dc = c - c0;
        if (dr === 0 || dr === 6 || dc === 0 || dc === 6) { return 1; }
        if (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4) { return 1; }
        return 0;
      }
      var f1 = inSquare(0, 0);
      if (f1 !== -1) { return f1; }
      var f2 = inSquare(0, grid - 7);
      if (f2 !== -1) { return f2; }
      var f3 = inSquare(grid - 7, 0);
      if (f3 !== -1) { return f3; }
      if ((r <= 7 && c === 7) || (r === 7 && c <= 7) || (r <= 7 && c === grid - 8) || (r === 7 && c >= grid - 8) || (r >= grid - 8 && c === 7) || (r === grid - 8 && c <= 7)) {
        return 0;
      }
      return -1;
    }

    var seed = 0;
    for (var i = 0; i < text.length; i++) {
      seed = (seed * 31 + text.charCodeAt(i)) % 104729;
    }

    for (var r = 0; r < grid; r++) {
      for (var c = 0; c < grid; c++) {
        var f = isFinder(r, c);
        var filled = false;
        if (f !== -1) {
          filled = f === 1;
        } else {
          var hash = (seed + r * 37 + c * 73 + r * c * 13) % 11;
          filled = hash < 5;
        }
        if (filled) {
          rects.push('<rect x="' + (c * cell).toFixed(2) + '" y="' + (r * cell).toFixed(2) + '" width="' + (cell + 0.1).toFixed(2) + '" height="' + (cell + 0.1).toFixed(2) + '" fill="#1B2623" />');
        }
      }
    }

    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="Kode QR Verifikasi ' + esc(text) + '" style="background:#FFFFFF;border:1px solid #DDE5E2;border-radius:4px;">' + rects.join('') + '</svg>';
  }

  // --- Router & Registry Consumption ---
  function isPublicPattern(pattern) {
    return pattern === '/masuk' || pattern === '/verifikasi/:kode';
  }

  function sortPatterns(patterns) {
    return patterns.slice().sort(function (a, b) {
      var segA = a.split('/').filter(Boolean);
      var segB = b.split('/').filter(Boolean);
      var statA = 0;
      var statB = 0;
      for (var i = 0; i < segA.length; i++) {
        if (segA[i].charAt(0) !== ':') { statA++; }
      }
      for (var j = 0; j < segB.length; j++) {
        if (segB[j].charAt(0) !== ':') { statB++; }
      }
      if (statA !== statB) { return statB - statA; }
      if (segA.length !== segB.length) { return segB.length - segA.length; }
      return a.localeCompare(b);
    });
  }

  function matchRoute(path) {
    var cleanPath = '/' + String(path || '').replace(/^#/, '').replace(/^\/+/, '').split('?')[0];
    if (cleanPath.length > 1 && cleanPath.charAt(cleanPath.length - 1) === '/') {
      cleanPath = cleanPath.slice(0, -1);
    }

    var patterns = sortPatterns(Object.keys(window.SIWARGA_VIEWS || {}));
    var pathSegs = cleanPath.split('/').filter(Boolean);

    for (var i = 0; i < patterns.length; i++) {
      var pat = patterns[i];
      var patSegs = pat.split('/').filter(Boolean);
      if (patSegs.length !== pathSegs.length) {
        continue;
      }
      var params = {};
      var matched = true;
      for (var k = 0; k < patSegs.length; k++) {
        if (patSegs[k].charAt(0) === ':') {
          params[patSegs[k].slice(1)] = decodeURIComponent(pathSegs[k]);
        } else if (patSegs[k] !== pathSegs[k]) {
          matched = false;
          break;
        }
      }
      if (matched) {
        return {
          pattern: pat,
          path: cleanPath,
          params: params,
          view: window.SIWARGA_VIEWS[pat]
        };
      }
    }
    return null;
  }

  function checkRouteGuard(pattern, user) {
    if (isPublicPattern(pattern)) {
      return { allowed: true };
    }
    if (!user) {
      return { allowed: false, redirect: '/masuk', reason: 'Silakan masuk untuk melanjutkan.' };
    }
    if (pattern.indexOf('/rt/') === 0 && user.role !== 'PENGURUS_RT') {
      return { allowed: false, redirect: '/dashboard', reason: 'Akses ditolak. Halaman ini khusus Pengurus RT.' };
    }
    if (pattern.indexOf('/rw/') === 0 && user.role !== 'PENGURUS_RW') {
      return { allowed: false, redirect: '/dashboard', reason: 'Akses ditolak. Halaman ini khusus Pengurus RW.' };
    }
    return { allowed: true };
  }

  function setLayoutVisibility(isPublic) {
    var pubEl = document.getElementById('layout-public');
    var appEl = document.getElementById('layout-app');
    if (pubEl) {
      pubEl.hidden = !isPublic;
      pubEl.style.display = isPublic ? '' : 'none';
    }
    if (appEl) {
      appEl.hidden = isPublic;
      appEl.style.display = isPublic ? 'none' : '';
    }
  }

  function renderCurrentRoute() {
    var hashPath = window.location.hash ? window.location.hash.slice(1) : '';
    var user = getCurrentUser();

    if (!hashPath || hashPath === '/') {
      var init = window.GAS_INITIAL_PARAMS || {};
      if (init.page === 'verifikasi' && init.kode) {
        hashPath = '/verifikasi/' + encodeURIComponent(init.kode);
      } else if (init.page === 'pengumuman' && init.id) {
        hashPath = '/pengumuman/' + encodeURIComponent(init.id);
      } else if (init.page) {
        hashPath = init.page.charAt(0) === '/' ? init.page : '/' + init.page;
      } else {
        hashPath = user ? '/dashboard' : '/masuk';
      }
      if (window.location.hash !== '#' + hashPath) {
        window.location.hash = '#' + hashPath;
        return;
      }
    }

    var match = matchRoute(hashPath);
    if (!match) {
      var fallback = user ? '/dashboard' : '/masuk';
      if (hashPath !== fallback) {
        toast('Halaman tidak ditemukan.', 'warning');
        navigate(fallback);
        return;
      }
      return;
    }

    var guard = checkRouteGuard(match.pattern, user);
    if (!guard.allowed) {
      if (guard.reason) {
        toast(guard.reason, 'warning');
      }
      navigate(guard.redirect);
      return;
    }

    closeModal();
    closeMobileDrawer();
    currentRoute = match;

    var isPub = isPublicPattern(match.pattern);
    setLayoutVisibility(isPub);

    var titleText = (match.view && match.view.title) ? match.view.title + ' | SiWarga RT/RW' : 'SiWarga RT/RW';
    document.title = titleText;

    var targetEl = isPub ? document.getElementById('public-content') : document.getElementById('app-content');
    if (!targetEl) {
      return;
    }

    if (!isPub && user) {
      updateHeaderInfo(user);
      buildSidebar(user, match.path);
    }

    if (match.view && typeof match.view.render === 'function') {
      targetEl.innerHTML = match.view.render(match.params);
    }
    if (match.view && typeof match.view.mount === 'function') {
      match.view.mount(targetEl, match.params);
    }

    if (typeof window.scrollTo === 'function') {
      window.scrollTo(0, 0);
    }
  }

  function navigate(path) {
    var clean = path.charAt(0) === '/' ? path : '/' + path;
    if (window.location.hash === '#' + clean) {
      renderCurrentRoute();
    } else {
      window.location.hash = '#' + clean;
    }
  }

  function syncSimButtons() {
    var btns = document.querySelectorAll('[data-sim-state]');
    for (var i = 0; i < btns.length; i++) {
      var btn = btns[i];
      var state = btn.getAttribute('data-sim-state');
      var active = state === simState;
      if (active) {
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
      } else {
        btn.classList.remove('active');
        btn.setAttribute('aria-pressed', 'false');
      }
    }
  }

  function setSimState(state) {
    if (state === 'normal' || state === 'loading' || state === 'empty' || state === 'error') {
      simState = state;
      syncSimButtons();
      renderCurrentRoute();
    }
  }

  function downloadBase64File(base64, mimeType, filename) {
    var cleanB64 = String(base64 || '').replace(/^data:[^;]+;base64,/, '');
    var binary = window.atob(cleanB64);
    var len = binary.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    var blob = new Blob([bytes], { type: mimeType || 'application/octet-stream' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename || 'dokumen.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1500);
  }

      simBar.style.display = 'none';
    }

    var simBtns = document.querySelectorAll('[data-sim-state]');
    for (var i = 0; i < simBtns.length; i++) {
      simBtns[i].addEventListener('click', function () {
        setSimState(this.getAttribute('data-sim-state'));
      });
    }
    syncSimButtons();

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        if (activeModalCloseHandler) {
          activeModalCloseHandler();
        } else {
          closeMobileDrawer();
        }
      }
    });
  }

  window.SW = {
    // Environment check
    isGasRuntime: isGasRuntime,

    // Constants
    JENIS_SURAT: JENIS_SURAT,
    HUBUNGAN_KELUARGA: HUBUNGAN_KELUARGA,
    STATUS_HUNIAN: STATUS_HUNIAN,
    STATUS_MUTASI: STATUS_MUTASI,
    ROLE_LABELS: ROLE_LABELS,

    getJenisSuratLabel: function (code) { return findLabel(JENIS_SURAT, code); },
    getHubunganLabel: function (code) { return findLabel(HUBUNGAN_KELUARGA, code); },
    getHunianLabel: function (code) { return findLabel(STATUS_HUNIAN, code); },
    getMutasiLabel: function (code) { return findLabel(STATUS_MUTASI, code); },
    getRoleLabel: function (role) { return ROLE_LABELS[role] || role; },

    // Data store & API
    db: db,
    auth: auth,
    api: api,
    remote: remote,
    resetDemoData: function () {
      if (isGasRuntime()) {
        clearGasSession();
      } else {
        db = createStore();
        window.SW.db = db;
        clearSession();
      }
      simState = 'normal';
      syncSimButtons();
      navigate('/masuk');
    },

    // Router
    navigate: navigate,
    rerender: renderCurrentRoute,
    getCurrentRoute: function () { return currentRoute; },

    // Icons & Formatters
    icon: icon,
    esc: esc,
    formatRupiah: formatRupiah,
    formatDate: formatDate,
    formatDateTime: formatDateTime,
    formatPeriode: formatPeriode,
    getCurrentPeriode: getCurrentPeriode,
    getTodayIsoDate: getTodayIsoDate,
    statusBadge: statusBadge,
    buildWaUrl: buildWaUrl,
    buildVerificationUrl: buildVerificationUrl,
    buildAnnouncementUrl: buildAnnouncementUrl,
    renderQrSvg: renderQrSvg,
    downloadBase64File: downloadBase64File,

    // Validators
    validators: validators,

    // UI Helpers
    openModal: openModal,
    closeModal: closeModal,
    toast: toast,
    renderLoading: renderLoading,
    renderEmpty: renderEmpty,
    renderError: renderError,
    paginate: paginate,
    renderPagination: renderPagination,

    // Phase 1 SimState
    getSimState: function () { return simState; },
    setSimState: setSimState
  };

  function isInitialVerificationRoute() {
    var h = window.location.hash ? window.location.hash.slice(1) : '';
    if (h.indexOf('/verifikasi/') === 0) {
      return true;
    }
    var init = window.GAS_INITIAL_PARAMS || {};
    return !h && init.page === 'verifikasi' && Boolean(init.kode);
  }

  function boot() {
    bindShellControls();
    window.addEventListener('hashchange', renderCurrentRoute);

    if (isGasRuntime() && !isInitialVerificationRoute()) {
      var token = getGasToken();
      if (token) {
        setLayoutVisibility(false);
        var appContent = document.getElementById('app-content');
        if (appContent) {
          appContent.innerHTML = renderLoading('Memuat sesi dan data wilayah...');
        }
        remote.run('apiGetBootstrap', [token], function (res) {
          applyBootstrapInternal(res, false);
          renderCurrentRoute();
        }, function () {
          clearGasSession();
          renderCurrentRoute();
        });
        return;
      }
    }

    renderCurrentRoute();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

</body>
</html>
