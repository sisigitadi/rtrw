<script>
(function () {
  'use strict';

  window.SIWARGA_VIEWS = window.SIWARGA_VIEWS || {};

  function getSw() {
    return window.SW;
  }

  function setButtonBusy(btn, busy, busyLabel) {
    if (!btn) {
      return;
    }
    if (busy) {
      if (!btn.getAttribute('data-orig-html')) {
        btn.setAttribute('data-orig-html', btn.innerHTML);
      }
      btn.disabled = true;
      if (busyLabel) {
        btn.textContent = busyLabel;
      }
    } else {
      btn.disabled = false;
      var orig = btn.getAttribute('data-orig-html');
      if (orig !== null) {
        btn.innerHTML = orig;
      }
    }
  }

  function handleSimState(emptyOpts) {
    var SW = getSw();
    var state = SW.getSimState();
    if (state === 'loading') {
      return SW.renderLoading('Memuat data wilayah RW...');
    }
    if (state === 'error') {
      return SW.renderError({
        title: 'Gagal memuat data',
        message: 'Terjadi gangguan saat mengambil data RW. Silakan coba muat ulang.'
      });
    }
    if (state === 'empty') {
      return SW.renderEmpty(emptyOpts || {});
    }
    return null;
  }

  function renderPageHeader(opts) {
    var SW = getSw();
    var backHtml = '';
    if (opts.backHref) {
      backHtml =
        '<div style="margin-bottom:12px;">' +
          '<a href="#' + SW.esc(opts.backHref) + '" class="btn btn-ghost btn-sm">' +
            SW.icon('arrow-left') + ' ' + SW.esc(opts.backLabel || 'Kembali') +
          '</a>' +
        '</div>';
    }
    return (
      backHtml +
      '<div class="page-header">' +
        '<div>' +
          '<h1 class="page-title">' + SW.esc(opts.title) + '</h1>' +
          (opts.subtitle ? '<p class="page-subtitle">' + SW.esc(opts.subtitle) + '</p>' : '') +
        '</div>' +
        (opts.actionsHtml ? '<div class="row-gap">' + opts.actionsHtml + '</div>' : '') +
      '</div>'
    );
  }

  function bindPagination(rootEl, onPageChange) {
    var btns = rootEl.querySelectorAll('[data-page]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        var nextPage = parseInt(this.getAttribute('data-page'), 10);
        if (!isNaN(nextPage) && nextPage >= 1) {
          onPageChange(nextPage);
        }
      });
    }
  }

  function bindCharCounter(inputEl, counterEl, minLen, maxLen) {
    if (!inputEl || !counterEl) {
      return;
    }
    function update() {
      var len = String(inputEl.value || '').trim().length;
      if (minLen) {
        counterEl.textContent = len + ' / ' + maxLen + ' karakter (minimal ' + minLen + ')';
      } else {
        counterEl.textContent = len + ' / ' + maxLen + ' karakter';
      }
    }
    inputEl.addEventListener('input', update);
    update();
  }

  function openRwRejectModal(opts) {
    var SW = getSw();
    var body =
      '<form id="form-rw-reject-modal" class="stack-md" novalidate>' +
        '<p class="text-sm text-muted">' + SW.esc(opts.description || 'Masukkan alasan penolakan yang jelas untuk pemohon dan pengurus RT.') + '</p>' +
        '<div class="form-group">' +
          '<label class="form-label" for="rw-reject-alasan">Alasan Penolakan</label>' +
          '<textarea id="rw-reject-alasan" class="form-textarea" rows="4" maxlength="300" placeholder="Tuliskan alasan penolakan (10 sampai 300 karakter)"></textarea>' +
          '<div class="form-hint" id="rw-reject-counter">0 / 300 karakter (minimal 10)</div>' +
          '<div class="form-error" id="rw-reject-error" role="alert" hidden></div>' +
        '</div>' +
      '</form>';

    var footer =
      '<button type="button" class="btn btn-secondary" id="btn-rw-reject-cancel">Batal</button>' +
      '<button type="submit" form="form-rw-reject-modal" class="btn btn-danger" id="btn-rw-reject-submit">Tolak Permohonan</button>';

    SW.openModal({
      title: opts.title || 'Tolak Permohonan Surat',
      bodyHtml: body,
      footerHtml: footer,
      onMount: function () {
        var form = document.getElementById('form-rw-reject-modal');
        var input = document.getElementById('rw-reject-alasan');
        var counter = document.getElementById('rw-reject-counter');
        var errEl = document.getElementById('rw-reject-error');
        var cancelBtn = document.getElementById('btn-rw-reject-cancel');

        bindCharCounter(input, counter, 10, 300);

        if (cancelBtn) {
          cancelBtn.addEventListener('click', SW.closeModal);
        }

        if (form) {
          form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var val = String(input.value || '').trim();
            if (!SW.validators.isLength(val, 10, 300)) {
              errEl.textContent = 'Alasan penolakan wajib diisi antara 10 sampai 300 karakter.';
              errEl.hidden = false;
              input.focus();
              return;
            }
            errEl.hidden = true;
            var submitBtn = document.getElementById('btn-rw-reject-submit');
            setButtonBusy(submitBtn, true, 'Memproses...');
            if (cancelBtn) {
              cancelBtn.disabled = true;
            }
            opts.onConfirm(val, function (errMsg) {
              setButtonBusy(submitBtn, false);
              if (cancelBtn) {
                cancelBtn.disabled = false;
              }
              if (errMsg) {
                errEl.textContent = errMsg;
                errEl.hidden = false;
                return;
              }
              SW.closeModal();
            });
          });
        }
      }
    });
  }

  // 1. /rw/surat
  var suratRwPageState = { page: 1 };

  window.SIWARGA_VIEWS['/rw/surat'] = {
    title: 'Antrean Pengesahan Surat RW',
    render: function () {
      var SW = getSw();
      var rwLabel = 'RW ' + SW.db.rw.nomorRw + ', ' + SW.db.rw.namaKelurahan;
      var html = renderPageHeader({
        title: 'Antrean Pengesahan Surat',
        subtitle: 'Permohonan surat dari seluruh RT di ' + rwLabel + ' yang sudah disetujui Ketua RT.'
      });

      var simHtml = handleSimState({
        icon: 'shield-check',
        title: 'Antrean pengesahan RW kosong',
        message: 'Belum ada surat berstatus Disetujui RT yang menunggu pengesahan Ketua RW.'
      });
      if (simHtml) {
        return html + simHtml;
      }

      var list = SW.api.getSuratQueueRw();
      if (list.length === 0) {
        return html + SW.renderEmpty({
          icon: 'shield-check',
          title: 'Tidak ada antrean pengesahan',
          message: 'Seluruh surat yang disetujui Ketua RT sudah disahkan atau diproses.'
        });
      }

      var paged = SW.paginate(list, suratRwPageState.page, 20);
      suratRwPageState.page = paged.page;

      var rows = '';
      for (var i = 0; i < paged.items.length; i++) {
        var s = paged.items[i];
        var d = SW.api.getSuratDetail(s.id);
        var pemohonNama = d && d.pemohon ? d.pemohon.nama : '-';
        var rtNomor = d && d.rt ? 'RT ' + d.rt.nomorRt : '-';
        var rtApprover = d && d.disetujuiRtOleh ? d.disetujuiRtOleh.nama : '-';

        rows +=
          '<tr>' +
            '<td data-label="Tanggal Ajuan">' + SW.esc(SW.formatDate(s.createdAt)) + '</td>' +
            '<td data-label="RT"><span class="badge badge-neutral">' + SW.esc(rtNomor) + '</span></td>' +
            '<td data-label="Pemohon"><strong>' + SW.esc(pemohonNama) + '</strong></td>' +
            '<td data-label="Jenis Surat">' + SW.esc(SW.getJenisSuratLabel(s.jenis)) + '</td>' +
            '<td data-label="Persetujuan RT">' +
              '<div>' + SW.esc(rtApprover) + '</div>' +
              '<div class="text-sm text-muted">' + SW.esc(SW.formatDateTime(s.disetujuiRtAt)) + '</div>' +
            '</td>' +
            '<td data-label="Status">' + SW.statusBadge('surat', s.status) + '</td>' +
            '<td data-label="Aksi">' +
              '<a href="#/rw/surat/' + SW.esc(s.id) + '" class="btn btn-primary btn-sm">Periksa &amp; Sahkan</a>' +
            '</td>' +
          '</tr>';
      }

      html +=
        '<div class="card">' +
          '<div class="table-wrap">' +
            '<table class="table responsive-table">' +
              '<thead>' +
                '<tr>' +
                  '<th>Tanggal Ajuan</th>' +
                  '<th>RT</th>' +
                  '<th>Pemohon</th>' +
                  '<th>Jenis Surat</th>' +
                  '<th>Persetujuan RT</th>' +
                  '<th>Status</th>' +
                  '<th>Aksi</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>' + rows + '</tbody>' +
            '</table>' +
          '</div>' +
          SW.renderPagination(paged, 'data-page') +
        '</div>';

      return html;
    },
    mount: function (rootEl) {
      var SW = getSw();
      bindPagination(rootEl, function (nextPage) {
        suratRwPageState.page = nextPage;
        SW.rerender();
      });
    }
  };

  // 2. /rw/surat/:id
  window.SIWARGA_VIEWS['/rw/surat/:id'] = {
    title: 'Detail Pengesahan Surat RW',
    render: function (params) {
      var SW = getSw();
      var html = renderPageHeader({
        backHref: '/rw/surat',
        backLabel: 'Kembali ke Antrean Pengesahan',
        title: 'Detail Pengesahan Surat',
        subtitle: 'Tinjau data pemohon dan riwayat persetujuan Ketua RT sebelum menerbitkan nomor surat resmi.'
      });

      var simHtml = handleSimState({
        icon: 'shield-check',
        title: 'Data surat tidak tersedia',
        message: 'Permohonan surat yang dipilih tidak ditemukan.',
        actionLabel: 'Kembali ke Antrean Pengesahan',
        actionHref: '/rw/surat'
      });
      if (simHtml) {
        return html + simHtml;
      }

      var d = SW.api.getSuratDetail(params.id);
      if (!d) {
        return html + SW.renderEmpty({
          icon: 'shield-check',
          title: 'Permohonan tidak ditemukan',
          message: 'Data pengajuan surat tidak ditemukan.',
          actionLabel: 'Kembali ke Antrean Pengesahan',
          actionHref: '/rw/surat'
        });
      }

      var s = d.surat;
      var pemohon = d.pemohon;
      var kk = d.kk;
      var rt = d.rt;

      var statusBanner = '';
      if (s.status === 'DISAHKAN_RW') {
        statusBanner =
          '<div class="alert alert-success" role="status">' +
            SW.icon('shield-check') +
            '<div>' +
              '<strong>Surat Resmi Telah Disahkan RW</strong><br>' +
              'Nomor Surat: <span class="text-mono">' + SW.esc(s.nomorSurat) + '</span> | Kode Verifikasi: <span class="text-mono">' + SW.esc(s.kodeVerifikasi) + '</span>' +
            '</div>' +
          '</div>';
      } else if (s.status === 'DITOLAK' && s.alasanTolak) {
        statusBanner =
          '<div class="alert alert-error" role="status">' +
            SW.icon('alert-circle') +
            '<div><strong>Permohonan Ditolak:</strong><br>' + SW.esc(s.alasanTolak) + '</div>' +
          '</div>';
      }

      var actionButtons = '';
      if (s.status === 'DISETUJUI_RT') {
        actionButtons =
          '<div class="alert alert-info">' +
            SW.icon('info') +
            '<div>Menekan <strong>Sahkan Surat</strong> akan menerbitkan nomor surat berurutan dan kode verifikasi 16 karakter secara otomatis.</div>' +
          '</div>' +
          '<div class="form-actions">' +
            '<button type="button" id="btn-rw-sahkan-surat" class="btn btn-primary">' + SW.icon('shield-check') + ' Sahkan Surat</button>' +
            '<button type="button" id="btn-rw-reject-surat" class="btn btn-danger">' + SW.icon('x') + ' Tolak Surat</button>' +
          '</div>';
      }

      var qrSection = '';
      if (s.status === 'DISAHKAN_RW' && s.kodeVerifikasi) {
        qrSection =
          '<section class="card">' +
            '<div class="card-header"><h2>Nomor Surat &amp; Validasi QR</h2></div>' +
            '<div class="card-body row-between">' +
              '<div class="stack-sm">' +
                '<div><span class="detail-label">Nomor Surat Resmi:</span><div class="text-mono" style="font-size:1.125rem;font-weight:700;">' + SW.esc(s.nomorSurat) + '</div></div>' +
                '<div><span class="detail-label">Kode Verifikasi (16 Karakter):</span><div class="text-mono" style="font-weight:700;">' + SW.esc(s.kodeVerifikasi) + '</div></div>' +
                '<div style="margin-top:8px;">' +
                  '<a href="#/verifikasi/' + SW.esc(s.kodeVerifikasi) + '" class="btn btn-secondary btn-sm">' + SW.icon('eye') + ' Lihat Halaman Verifikasi Publik</a>' +
                '</div>' +
              '</div>' +
              '<div>' + SW.renderQrSvg(s.kodeVerifikasi, 108) + '</div>' +
            '</div>' +
          '</section>';
      }

      html +=
        '<div class="stack-lg">' +
          statusBanner +
          '<section class="card">' +
            '<div class="card-header">' +
              '<div>' +
                '<h2 style="margin-bottom:2px;">' + SW.esc(SW.getJenisSuratLabel(s.jenis)) + '</h2>' +
                '<div class="text-sm text-muted">Wilayah Asal: RT ' + SW.esc(rt ? rt.nomorRt : '-') + ' / RW ' + SW.esc(d.rw.nomorRw) + '</div>' +
              '</div>' +
              '<div class="row-gap">' +
                SW.statusBadge('surat', s.status) +
                (s.modeAsistensi ? '<span class="badge badge-neutral">Mode Asistensi</span>' : '') +
              '</div>' +
            '</div>' +
            '<div class="card-body stack-md">' +
              '<dl class="detail-list">' +
                '<div class="detail-row"><dt class="detail-label">Nama Pemohon</dt><dd class="detail-value">' + SW.esc(pemohon ? pemohon.nama : '-') + '</dd></div>' +
                '<div class="detail-row"><dt class="detail-label">NIK Pemohon</dt><dd class="detail-value text-mono">' + SW.esc(pemohon ? pemohon.nik : '-') + '</dd></div>' +
                '<div class="detail-row"><dt class="detail-label">Tempat, Tanggal Lahir</dt><dd class="detail-value">' + SW.esc(pemohon ? pemohon.tempatLahir + ', ' + SW.formatDate(pemohon.tanggalLahir) : '-') + '</dd></div>' +
                '<div class="detail-row"><dt class="detail-label">Alamat &amp; No. KK</dt><dd class="detail-value">' + SW.esc(kk ? kk.alamat + ' (KK ' + kk.noKk + ')' : '-') + '</dd></div>' +
                '<div class="detail-row"><dt class="detail-label">Persetujuan Ketua RT</dt><dd class="detail-value">' + SW.esc(d.disetujuiRtOleh ? d.disetujuiRtOleh.nama : '-') + ' (' + SW.esc(SW.formatDateTime(s.disetujuiRtAt)) + ')</dd></div>' +
              '</dl>' +
              '<div class="stack-sm">' +
                '<div class="detail-label">Keperluan</div>' +
                '<div style="background-color:#F6F8F7;border:1px solid #DDE5E2;border-radius:8px;padding:12px;white-space:pre-wrap;">' + SW.esc(s.keperluan) + '</div>' +
              '</div>' +
              actionButtons +
            '</div>' +
          '</section>' +
          qrSection +
          '<section class="card">' +
            '<div class="card-header"><h2>Riwayat Persetujuan Berjenjang</h2></div>' +
            '<div class="card-body">' +
              '<ol class="timeline">' +
                '<li class="timeline-item"><strong>Diajukan</strong><div class="text-sm text-muted">' + SW.esc(SW.formatDateTime(s.createdAt)) + ' oleh ' + SW.esc(d.diajukanOleh ? d.diajukanOleh.nama : '-') + '</div></li>' +
                (s.disetujuiRtAt
                  ? '<li class="timeline-item"><strong>Disetujui Ketua RT</strong><div class="text-sm text-muted">' + SW.esc(SW.formatDateTime(s.disetujuiRtAt)) + ' oleh ' + SW.esc(d.disetujuiRtOleh ? d.disetujuiRtOleh.nama : '-') + '</div></li>'
                  : '') +
                (s.disahkanRwAt
                  ? '<li class="timeline-item"><strong>' + (s.status === 'DITOLAK' ? 'Ditolak Ketua RW' : 'Disahkan Ketua RW') + '</strong><div class="text-sm text-muted">' + SW.esc(SW.formatDateTime(s.disahkanRwAt)) + ' oleh ' + SW.esc(d.disahkanRwOleh ? d.disahkanRwOleh.nama : '-') + '</div></li>'
                  : '') +
              '</ol>' +
            '</div>' +
          '</section>' +
        '</div>';

      return html;
    },
    mount: function (rootEl, params) {
      var SW = getSw();
      var sahkanBtn = document.getElementById('btn-rw-sahkan-surat');
      var rejectBtn = document.getElementById('btn-rw-reject-surat');

      if (sahkanBtn) {
        sahkanBtn.addEventListener('click', function () {
          setButtonBusy(sahkanBtn, true, 'Mengesahkan...');
          SW.api.rwSahkanSuratAsync(params.id, function (res) {
            setButtonBusy(sahkanBtn, false);
            var noSurat = (res && res.surat && res.surat.nomorSurat) ? res.surat.nomorSurat : '';
            SW.toast(noSurat ? ('Surat disahkan dengan nomor ' + noSurat) : 'Surat berhasil disahkan.', 'success');
            SW.rerender();
          }, function (err) {
            setButtonBusy(sahkanBtn, false);
            SW.toast((err && err.error) ? err.error : 'Gagal mengesahkan surat.', 'error');
          });
        });
      }

      if (rejectBtn) {
        rejectBtn.addEventListener('click', function () {
          openRwRejectModal({
            title: 'Tolak Permohonan Surat (RW)',
            description: 'Masukkan alasan penolakan (10 sampai 300 karakter) agar tercatat di riwayat surat.',
            onConfirm: function (alasan, done) {
              SW.api.rwRejectSuratAsync(params.id, alasan, function () {
                done('');
                SW.toast('Permohonan surat ditolak oleh RW.', 'info');
                SW.rerender();
              }, function (err) {
                done((err && err.error) ? err.error : 'Gagal menolak permohonan surat.');
              });
            }
          });
        });
      }
    }
  };

  // 3. /rw/setoran
  var setoranRwPageState = { page: 1 };

  window.SIWARGA_VIEWS['/rw/setoran'] = {
    title: 'Konfirmasi Setoran Kas RW',
    render: function () {
      var SW = getSw();
      var html = renderPageHeader({
        title: 'Konfirmasi Setoran Kas RW',
        subtitle: 'Periksa setoran kas wajib dari RT yang menunggu konfirmasi dan pantau riwayat setoran terkonfirmasi.'
      });

      var simHtml = handleSimState({
        icon: 'wallet',
        title: 'Belum ada data setoran kas',
        message: 'Belum ada setoran kas dari RT yang masuk ke Buku Kas RW.'
      });
      if (simHtml) {
        return html + simHtml;
      }

      var rwSaldo = SW.api.getRwSaldo();
      var all = SW.api.getSetoranList();
      var pending = [];
      var confirmed = [];
      for (var i = 0; i < all.length; i++) {
        if (all[i].status === 'MENUNGGU_KONFIRMASI') {
          pending.push(all[i]);
        } else if (all[i].status === 'TERKONFIRMASI') {
          confirmed.push(all[i]);
        }
      }

      html +=
        '<div class="dashboard-hero-grid" style="margin-bottom:24px;">' +
          '<div class="card card-highlight">' +
            '<div class="card-body stack-sm">' +
              '<div class="text-sm text-muted">Saldo Kas RW ' + SW.esc(SW.db.rw.nomorRw) + ' (Terkonfirmasi)</div>' +
              '<div style="font-size:2rem;font-weight:700;line-height:1.2;">' + SW.esc(SW.formatRupiah(rwSaldo.saldo)) + '</div>' +
              '<div class="text-sm text-muted">Akumulasi seluruh setoran RT berstatus Terkonfirmasi</div>' +
            '</div>' +
          '</div>' +
          '<div class="stats-grid">' +
            '<div class="card">' +
              '<div class="card-body stack-sm">' +
                '<div class="text-sm text-muted">Menunggu Konfirmasi</div>' +
                '<div style="font-size:1.375rem;font-weight:700;color:#B45309;">' + SW.esc(SW.formatRupiah(rwSaldo.menungguKonfirmasi)) + '</div>' +
                '<div class="text-sm text-muted">' + pending.length + ' transaksi antrean</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      // Queue section
      html += '<section class="card" style="margin-bottom:24px;">' +
        '<div class="card-header"><h2>Antrean Menunggu Konfirmasi</h2><span class="badge badge-warning">' + pending.length + ' Antrean</span></div>';

      if (pending.length === 0) {
        html += '<div class="card-body"><p class="text-sm text-muted" style="margin:0;">Tidak ada setoran kas yang menunggu konfirmasi Bendahara RW.</p></div>';
      } else {
        var pendingRows = '';
        for (var p = 0; p < pending.length; p++) {
          var item = pending[p];
          var rt = SW.api.getRt(item.rtId);
          var sender = SW.api.getPenduduk(item.dikirimOlehId);
          pendingRows +=
            '<tr>' +
              '<td data-label="Tanggal Setor">' + SW.esc(SW.formatDate(item.tanggal)) + '</td>' +
              '<td data-label="Asal RT"><span class="badge badge-neutral">RT ' + SW.esc(rt ? rt.nomorRt : '-') + '</span></td>' +
              '<td data-label="Dikirim Oleh">' + SW.esc(sender ? sender.nama : '-') + '</td>' +
              '<td data-label="Nominal"><strong>' + SW.esc(SW.formatRupiah(item.nominal)) + '</strong></td>' +
              '<td data-label="Status">' + SW.statusBadge('setoran', item.status) + '</td>' +
              '<td data-label="Aksi">' +
                '<button type="button" class="btn btn-primary btn-sm" data-confirm-setoran="' + SW.esc(item.id) + '">' + SW.icon('check') + ' Konfirmasi</button>' +
              '</td>' +
            '</tr>';
        }
        html +=
          '<div class="table-wrap">' +
            '<table class="table responsive-table">' +
              '<thead>' +
                '<tr>' +
                  '<th>Tanggal Setor</th>' +
                  '<th>Asal RT</th>' +
                  '<th>Dikirim Oleh</th>' +
                  '<th>Nominal</th>' +
                  '<th>Status</th>' +
                  '<th>Aksi</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>' + pendingRows + '</tbody>' +
            '</table>' +
          '</div>';
      }
      html += '</section>';

      // Confirmed history section
      html += '<section class="card">' +
        '<div class="card-header"><h2>Riwayat Setoran Terkonfirmasi</h2><span class="text-sm text-muted">' + confirmed.length + ' transaksi</span></div>';

      if (confirmed.length === 0) {
        html += '<div class="card-body"><p class="text-sm text-muted" style="margin:0;">Belum ada riwayat setoran kas yang terkonfirmasi.</p></div>';
      } else {
        var paged = SW.paginate(confirmed, setoranRwPageState.page, 20);
        setoranRwPageState.page = paged.page;

        var confRows = '';
        for (var c = 0; c < paged.items.length; c++) {
          var cf = paged.items[c];
          var cRt = SW.api.getRt(cf.rtId);
          var cSender = SW.api.getPenduduk(cf.dikirimOlehId);
          var cConfirmer = cf.dikonfirmasiOlehId ? SW.api.getPenduduk(cf.dikonfirmasiOlehId) : null;
          confRows +=
            '<tr>' +
              '<td data-label="Tanggal Setor">' + SW.esc(SW.formatDate(cf.tanggal)) + '</td>' +
              '<td data-label="Asal RT"><span class="badge badge-neutral">RT ' + SW.esc(cRt ? cRt.nomorRt : '-') + '</span></td>' +
              '<td data-label="Dikirim Oleh">' + SW.esc(cSender ? cSender.nama : '-') + '</td>' +
              '<td data-label="Nominal"><strong>' + SW.esc(SW.formatRupiah(cf.nominal)) + '</strong></td>' +
              '<td data-label="Dikonfirmasi Oleh">' +
                '<div>' + SW.esc(cConfirmer ? cConfirmer.nama : '-') + '</div>' +
                '<div class="text-sm text-muted">' + SW.esc(SW.formatDateTime(cf.dikonfirmasiAt)) + '</div>' +
              '</td>' +
              '<td data-label="Status">' + SW.statusBadge('setoran', cf.status) + '</td>' +
            '</tr>';
        }
        html +=
          '<div class="table-wrap">' +
            '<table class="table responsive-table">' +
              '<thead>' +
                '<tr>' +
                  '<th>Tanggal Setor</th>' +
                  '<th>Asal RT</th>' +
                  '<th>Dikirim Oleh</th>' +
                  '<th>Nominal</th>' +
                  '<th>Dikonfirmasi Oleh</th>' +
                  '<th>Status</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>' + confRows + '</tbody>' +
            '</table>' +
          '</div>' +
          SW.renderPagination(paged, 'data-page');
      }
      html += '</section>';

      return html;
    },
    mount: function (rootEl) {
      var SW = getSw();
      var confirmBtns = rootEl.querySelectorAll('[data-confirm-setoran]');
      for (var i = 0; i < confirmBtns.length; i++) {
        confirmBtns[i].addEventListener('click', function () {
          var setoranId = Number(this.getAttribute('data-confirm-setoran'));
          var list = SW.api.getSetoranList();
          var target = null;
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === setoranId) {
              target = list[j];
              break;
            }
          }
          if (!target) {
            return;
          }
          var rt = SW.api.getRt(target.rtId);
          var body =
            '<div class="stack-md">' +
              '<p class="text-sm">Pastikan dana setoran dari RT berikut sudah diterima di rekening atau kas RW. Setelah dikonfirmasi, status setoran tidak dapat diubah.</p>' +
              '<dl class="detail-list">' +
                '<div class="detail-row"><dt class="detail-label">Asal Wilayah</dt><dd class="detail-value">RT ' + SW.esc(rt ? rt.nomorRt : '-') + '</dd></div>' +
                '<div class="detail-row"><dt class="detail-label">Tanggal Setor</dt><dd class="detail-value">' + SW.esc(SW.formatDate(target.tanggal)) + '</dd></div>' +
                '<div class="detail-row"><dt class="detail-label">Nominal Setoran</dt><dd class="detail-value"><strong>' + SW.esc(SW.formatRupiah(target.nominal)) + '</strong></dd></div>' +
              '</dl>' +
            '</div>';

          SW.openModal({
            title: 'Konfirmasi Penerimaan Setoran',
            bodyHtml: body,
            footerHtml:
              '<button type="button" class="btn btn-secondary" id="btn-cancel-confirm-setoran">Batal</button>' +
              '<button type="button" class="btn btn-primary" id="btn-ok-confirm-setoran">' + SW.icon('check') + ' Ya, Konfirmasi Setoran</button>',
            onMount: function () {
              var cancelBtn = document.getElementById('btn-cancel-confirm-setoran');
              var okBtn = document.getElementById('btn-ok-confirm-setoran');
              if (cancelBtn) {
                cancelBtn.addEventListener('click', SW.closeModal);
              }
              if (okBtn) {
                okBtn.addEventListener('click', function () {
                  setButtonBusy(okBtn, true, 'Mengonfirmasi...');
                  if (cancelBtn) {
                    cancelBtn.disabled = true;
                  }
                  SW.api.confirmSetoranAsync(setoranId, function () {
                    setButtonBusy(okBtn, false);
                    if (cancelBtn) {
                      cancelBtn.disabled = false;
                    }
                    SW.closeModal();
                    SW.toast('Setoran kas RT terkonfirmasi dan saldo RW bertambah.', 'success');
                    SW.rerender();
                  }, function (err) {
                    setButtonBusy(okBtn, false);
                    if (cancelBtn) {
                      cancelBtn.disabled = false;
                    }
                    SW.closeModal();
                    SW.toast((err && err.error) ? err.error : 'Gagal mengonfirmasi setoran.', 'error');
                  });
                });
              }
            }
          });
        });
      }

      bindPagination(rootEl, function (nextPage) {
        setoranRwPageState.page = nextPage;
        SW.rerender();
      });
    }
  };

  // 4. /rw/rekap
  window.SIWARGA_VIEWS['/rw/rekap'] = {
    title: 'Rekap Antar-RT',
    render: function () {
      var SW = getSw();
      var html = renderPageHeader({
        title: 'Rekap Populasi & Saldo Kas Antar-RT',
        subtitle: 'Komparasi jumlah KK, penduduk berstatus AKTIF (Tetap dan Kontrak/Kos), serta saldo kas per RT di RW ' + SW.esc(SW.db.rw.nomorRw) + '.'
      });

      var simHtml = handleSimState({
        icon: 'users',
        title: 'Belum ada data rekap RT',
        message: 'Data wilayah RT belum tersedia untuk ditampilkan dalam tabel komparasi.'
      });
      if (simHtml) {
        return html + simHtml;
      }

      var rows = SW.api.getRekapAntarRt();
      if (rows.length === 0) {
        return html + SW.renderEmpty({
          icon: 'users',
          title: 'Data RT belum tersedia',
          message: 'Belum ada data RT yang terdaftar pada RW ini.'
        });
      }

      var totalKk = 0;
      var totalAktif = 0;
      var totalTetap = 0;
      var totalKontrak = 0;
      var totalSaldo = 0;

      var bodyRows = '';
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        totalKk += r.jumlahKk;
        totalAktif += r.jiwaAktif;
        totalTetap += r.jiwaTetap;
        totalKontrak += r.jiwaKontrak;
        totalSaldo += r.saldoKasRt;

        bodyRows +=
          '<tr>' +
            '<td data-label="Nomor RT"><strong>RT ' + SW.esc(r.nomorRt) + '</strong></td>' +
            '<td data-label="Jumlah KK">' + SW.esc(r.jumlahKk) + ' KK</td>' +
            '<td data-label="Jiwa AKTIF"><strong>' + SW.esc(r.jiwaAktif) + ' jiwa</strong></td>' +
            '<td data-label="Jiwa Tetap">' + SW.esc(r.jiwaTetap) + ' jiwa</td>' +
            '<td data-label="Jiwa Kontrak/Kos">' + SW.esc(r.jiwaKontrak) + ' jiwa</td>' +
            '<td data-label="Saldo Kas RT"><strong>' + SW.esc(SW.formatRupiah(r.saldoKasRt)) + '</strong></td>' +
          '</tr>';
      }

      html +=
        '<div class="card">' +
          '<div class="card-header"><h2>Tabel Komparasi Antar-RT</h2><span class="text-sm text-muted">Diurutkan dari nomor RT terkecil</span></div>' +
          '<div class="table-wrap">' +
            '<table class="table responsive-table">' +
              '<thead>' +
                '<tr>' +
                  '<th>Nomor RT</th>' +
                  '<th>Jumlah KK</th>' +
                  '<th>Jiwa AKTIF</th>' +
                  '<th>Jiwa Tetap</th>' +
                  '<th>Jiwa Kontrak/Kos</th>' +
                  '<th>Saldo Kas RT</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>' + bodyRows + '</tbody>' +
              '<tfoot>' +
                '<tr style="background-color:#EEF8F6;font-weight:700;">' +
                  '<td data-label="Nomor RT">Total RW ' + SW.esc(SW.db.rw.nomorRw) + '</td>' +
                  '<td data-label="Jumlah KK">' + SW.esc(totalKk) + ' KK</td>' +
                  '<td data-label="Jiwa AKTIF">' + SW.esc(totalAktif) + ' jiwa</td>' +
                  '<td data-label="Jiwa Tetap">' + SW.esc(totalTetap) + ' jiwa</td>' +
                  '<td data-label="Jiwa Kontrak/Kos">' + SW.esc(totalKontrak) + ' jiwa</td>' +
                  '<td data-label="Saldo Kas RT">' + SW.esc(SW.formatRupiah(totalSaldo)) + '</td>' +
                '</tr>' +
              '</tfoot>' +
            '</table>' +
          '</div>' +
        '</div>';

      return html;
    }
  };

  // 5. /rw/pengumuman
  var pengumumanRwPageState = { page: 1 };

  window.SIWARGA_VIEWS['/rw/pengumuman'] = {
    title: 'Pengumuman Lintas RW',
    render: function () {
      var SW = getSw();
      var html = renderPageHeader({
        title: 'Pengumuman Lintas RW',
        subtitle: 'Terbitkan pengumuman resmi yang tampil bagi seluruh warga di RW ' + SW.esc(SW.db.rw.nomorRw) + '.'
      });

      var simHtml = handleSimState({
        icon: 'megaphone',
        title: 'Belum ada pengumuman lintas RW',
        message: 'Gunakan formulir pengumuman untuk menerbitkan informasi bagi seluruh RT di RW ini.'
      });
      if (simHtml) {
        return html + simHtml;
      }

      var list = SW.api.getPengumumanByScope('LINTAS_RW');

      html +=
        '<div class="stack-lg">' +
          '<section class="card">' +
            '<div class="card-header"><h2>Buat Pengumuman Lintas RW</h2><span class="badge badge-neutral">Lingkup: LINTAS_RW</span></div>' +
            '<div class="card-body">' +
              '<form id="form-rw-pengumuman" class="stack-md" novalidate>' +
                '<div id="rw-pengumuman-error" class="alert alert-error" role="alert" hidden></div>' +
                '<div class="form-group">' +
                  '<label class="form-label" for="pg-rw-judul">Judul Pengumuman</label>' +
                  '<input id="pg-rw-judul" class="form-input" type="text" maxlength="150" placeholder="Contoh: Jadwal Penyemprotan Nyamuk se-RW">' +
                  '<span class="form-hint" id="pg-rw-judul-counter">0 / 150 karakter (minimal 5)</span>' +
                '</div>' +
                '<div class="form-group">' +
                  '<label class="form-label" for="pg-rw-isi">Isi Pengumuman</label>' +
                  '<textarea id="pg-rw-isi" class="form-textarea" rows="5" maxlength="3000" placeholder="Tuliskan informasi lengkap untuk seluruh warga RW (10 sampai 3.000 karakter)"></textarea>' +
                  '<span class="form-hint" id="pg-rw-isi-counter">0 / 3000 karakter (minimal 10)</span>' +
                '</div>' +
                '<div class="form-actions">' +
                  '<button type="submit" id="btn-submit-pg-rw" class="btn btn-primary">' + SW.icon('megaphone') + ' Terbitkan Pengumuman RW</button>' +
                '</div>' +
              '</form>' +
            '</div>' +
          '</section>';

      if (list.length === 0) {
        html += SW.renderEmpty({
          icon: 'megaphone',
          title: 'Belum ada pengumuman lintas RW',
          message: 'Pengumuman yang Anda buat di atas akan tampil di daftar ini dan di dashboard warga.'
        });
      } else {
        var paged = SW.paginate(list, pengumumanRwPageState.page, 20);
        pengumumanRwPageState.page = paged.page;

        var rows = '';
        for (var i = 0; i < paged.items.length; i++) {
          var pg = paged.items[i];
          var author = SW.api.getPenduduk(pg.dibuatOlehId);
          var excerpt = pg.isi.length > 160 ? pg.isi.slice(0, 160) + '...' : pg.isi;
          rows +=
            '<tr>' +
              '<td data-label="Tanggal">' + SW.esc(SW.formatDateTime(pg.createdAt)) + '</td>' +
              '<td data-label="Judul &amp; Isi">' +
                '<strong>' + SW.esc(pg.judul) + '</strong>' +
                '<div class="text-sm text-muted" style="white-space:pre-wrap;">' + SW.esc(excerpt) + '</div>' +
              '</td>' +
              '<td data-label="Pembuat">' + SW.esc(author ? author.nama : '-') + '</td>' +
              '<td data-label="Aksi"><a href="#/pengumuman/' + SW.esc(pg.id) + '" class="btn btn-secondary btn-sm">Buka</a></td>' +
            '</tr>';
        }

        html +=
          '<section class="card">' +
            '<div class="card-header"><h2>Daftar Pengumuman Lintas RW</h2><span class="text-sm text-muted">' + list.length + ' pengumuman</span></div>' +
            '<div class="table-wrap">' +
              '<table class="table responsive-table">' +
                '<thead>' +
                  '<tr>' +
                    '<th>Tanggal</th>' +
                    '<th>Judul &amp; Ringkasan</th>' +
                    '<th>Pembuat</th>' +
                    '<th>Aksi</th>' +
                  '</tr>' +
                '</thead>' +
                '<tbody>' + rows + '</tbody>' +
              '</table>' +
            '</div>' +
            SW.renderPagination(paged, 'data-page') +
          '</section>';
      }

      html += '</div>';
      return html;
    },
    mount: function (rootEl) {
      var SW = getSw();
      var form = document.getElementById('form-rw-pengumuman');
      var errEl = document.getElementById('rw-pengumuman-error');
      var judulEl = document.getElementById('pg-rw-judul');
      var isiEl = document.getElementById('pg-rw-isi');

      bindCharCounter(judulEl, document.getElementById('pg-rw-judul-counter'), 5, 150);
      bindCharCounter(isiEl, document.getElementById('pg-rw-isi-counter'), 10, 3000);

      if (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var btn = document.getElementById('btn-submit-pg-rw');
          setButtonBusy(btn, true, 'Menerbitkan...');

          SW.api.createPengumumanAsync({
            lingkup: 'LINTAS_RW',
            judul: judulEl.value,
            isi: isiEl.value
          }, function () {
            setButtonBusy(btn, false);
            errEl.hidden = true;
            pengumumanRwPageState.page = 1;
            SW.toast('Pengumuman Lintas RW berhasil diterbitkan.', 'success');
            SW.rerender();
          }, function (err) {
            setButtonBusy(btn, false);
            errEl.textContent = (err && err.error) ? err.error : 'Gagal menerbitkan pengumuman.';
            errEl.hidden = false;
          });
        });
      }

      bindPagination(rootEl, function (nextPage) {
        pengumumanRwPageState.page = nextPage;
        SW.rerender();
      });
    }
  };
})();
</script>
