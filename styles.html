<style>
  :root {
    --brand-50: #EEF8F6;
    --brand-100: #D2EEE9;
    --brand-300: #7CC7B8;
    --brand-500: #2E9583;
    --brand-700: #0E6B5C;
    --brand-900: #063B33;

    --color-bg: #F6F8F7;
    --color-surface: #FFFFFF;
    --color-surface-subtle: #EEF2F0;
    --color-text: #1B2623;
    --color-text-secondary: #5B6B66;
    --color-border: #DDE5E2;
    --color-border-control: #73857F;

    --color-success: #15803D;
    --color-success-bg: #EEF8F0;
    --color-warning: #B45309;
    --color-warning-bg: #FFFBEB;
    --color-error: #B91C1C;
    --color-error-bg: #FEF2F2;
    --color-error-hover: #991B1B;

    --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

    --radius-control: 8px;
    --radius-card: 12px;
    --shadow-sm: 0 1px 2px 0 rgba(27, 38, 35, 0.06), 0 1px 3px 0 rgba(27, 38, 35, 0.04);

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  html {
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.6;
    color: var(--color-text);
    background-color: var(--color-bg);
    overflow-x: hidden;
  }

  img, svg {
    display: block;
    max-width: 100%;
  }

  a {
    color: var(--brand-700);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  a:hover {
    color: var(--brand-900);
  }

  h1, h2, h3, h4, p, ul, ol {
    margin-top: 0;
  }

  h1 {
    font-size: clamp(1.75rem, 1.45rem + 1.25vw, 2.25rem);
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--color-text);
    margin-bottom: var(--space-2);
  }

  h2 {
    font-size: 1.5rem;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--color-text);
    margin-bottom: var(--space-2);
  }

  h3 {
    font-size: 1.125rem;
    line-height: 1.4;
    font-weight: 600;
    color: var(--color-text);
    margin-bottom: var(--space-2);
  }

  :focus-visible {
    outline: 2px solid var(--brand-700);
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .skip-link {
    position: absolute;
    left: -9999px;
    top: 8px;
    z-index: 100;
    padding: 10px 16px;
    background-color: var(--brand-900);
    color: #FFFFFF;
    border-radius: var(--radius-control);
    font-weight: 600;
    text-decoration: none;
  }

  .skip-link:focus {
    left: 12px;
  }

  /* Public Layout */
  .public-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: var(--color-bg);
  }

  .public-header {
    background-color: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: var(--space-4);
  }

  .public-header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .brand-wordmark {
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--brand-700);
    text-decoration: none;
    letter-spacing: -0.01em;
  }

  .brand-wordmark:hover {
    color: var(--brand-900);
  }

  .public-main {
    flex: 1;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: var(--space-6) var(--space-4) var(--space-8);
  }

  /* App Layout */
  .app-shell {
    min-height: 100vh;
    display: flex;
    background-color: var(--color-bg);
  }

  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background-color: rgba(27, 38, 35, 0.45);
    z-index: 35;
  }

  .sidebar-backdrop.is-open {
    display: block;
  }

  .app-sidebar {
    width: 264px;
    flex-shrink: 0;
    background-color: var(--color-surface);
    border-right: 1px solid var(--color-border);
    padding: var(--space-5) var(--space-3);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    z-index: 40;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    padding: 0 var(--space-2) var(--space-4);
    border-bottom: 1px solid var(--color-border);
    margin-bottom: var(--space-4);
  }

  .sidebar-brand {
    font-size: 1.0625rem;
    font-weight: 700;
    color: var(--brand-700);
  }

  .sidebar-close-btn {
    display: none;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }

  .sidebar-group {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .sidebar-group-title {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--color-text-secondary);
    padding: var(--space-1) var(--space-3);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .nav-link {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-height: 44px;
    padding: 10px 12px;
    border-radius: var(--radius-control);
    color: var(--color-text);
    text-decoration: none;
    font-size: 0.9375rem;
    font-weight: 500;
    transition: background-color 0.12s ease, color 0.12s ease;
  }

  .nav-link:hover {
    background-color: var(--brand-50);
    color: var(--brand-900);
  }

  .nav-link.active {
    background-color: var(--brand-100);
    color: var(--brand-900);
    font-weight: 700;
  }

  .nav-link svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .app-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .app-header {
    background-color: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: var(--space-3) var(--space-6);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .header-brand {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
  }

  .app-header-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--color-text);
  }

  .mobile-menu-btn {
    display: none;
  }

  .header-user {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    margin-left: auto;
  }

  .header-user-info {
    display: flex;
    flex-direction: column;
    text-align: right;
    line-height: 1.3;
  }

  .header-user-name {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--color-text);
  }

  .app-content {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--space-6);
    flex: 1;
  }

  /* Phase 1 Simulator Bar */
  .sim-bar {
    background-color: var(--color-surface-subtle);
    border-bottom: 1px solid var(--color-border);
    padding: var(--space-2) var(--space-6);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
  }

  .sim-bar-actions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }

  .sim-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    min-width: 44px;
    padding: 6px 12px;
    font-family: var(--font-sans);
    font-size: 0.8125rem;
    font-weight: 600;
    border-radius: var(--radius-control);
    border: 1px solid var(--color-border-control);
    background-color: var(--color-surface);
    color: var(--color-text);
    cursor: pointer;
  }

  .sim-btn:hover {
    background-color: var(--brand-50);
  }

  .sim-btn.active {
    background-color: var(--brand-700);
    border-color: var(--brand-700);
    color: #FFFFFF;
  }

  /* Page Header & Typography Utilities */
  .page-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-4);
    margin-bottom: var(--space-6);
  }

  .page-title {
    font-size: clamp(1.75rem, 1.45rem + 1.25vw, 2.25rem);
    line-height: 1.2;
    font-weight: 700;
    margin-bottom: var(--space-1);
    color: var(--color-text);
  }

  .page-subtitle {
    font-size: 1rem;
    color: var(--color-text-secondary);
    max-width: 70ch;
    margin-bottom: 0;
  }

  .text-sm {
    font-size: 0.875rem;
    line-height: 1.5;
  }

  .text-muted {
    color: var(--color-text-secondary);
  }

  .text-mono {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .measure-70ch {
    max-width: 70ch;
  }

  /* Spacing & Flex Utilities */
  .stack-sm {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  .stack-md {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  .stack-lg {
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .row-between {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .row-gap {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
  }

  /* Cards */
  .card {
    background-color: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .card-header {
    padding: var(--space-4) var(--space-5);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .card-body {
    padding: var(--space-5);
  }

  .card-highlight {
    background-color: var(--brand-700);
    border-color: var(--brand-900);
    color: #FFFFFF;
  }

  .card-highlight h2,
  .card-highlight h3,
  .card-highlight .card-title {
    color: #FFFFFF;
  }

  .card-highlight .text-muted {
    color: var(--brand-100);
  }

  .card-highlight .card-header {
    border-bottom-color: rgba(255, 255, 255, 0.2);
  }

  /* Dashboard Grids */
  .dashboard-hero-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-4);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-4);
  }

  /* Buttons (flat, 8px radius, min 44x44px tap target) */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: 44px;
    min-width: 44px;
    padding: 10px 16px;
    font-family: var(--font-sans);
    font-size: 0.9375rem;
    font-weight: 600;
    line-height: 1.25;
    border-radius: var(--radius-control);
    border: 1px solid transparent;
    box-shadow: none;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }

  .btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .btn:active:not(:disabled) {
    transform: translateY(1px);
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .btn-primary {
    background-color: var(--brand-700);
    border-color: var(--brand-700);
    color: #FFFFFF;
  }

  .btn-primary:hover:not(:disabled) {
    background-color: var(--brand-900);
    border-color: var(--brand-900);
    color: #FFFFFF;
  }

  .btn-secondary {
    background-color: var(--color-surface);
    border-color: var(--color-border-control);
    color: var(--color-text);
  }

  .btn-secondary:hover:not(:disabled) {
    background-color: var(--brand-50);
    border-color: var(--brand-700);
    color: var(--brand-900);
  }

  .btn-danger {
    background-color: var(--color-error);
    border-color: var(--color-error);
    color: #FFFFFF;
  }

  .btn-danger:hover:not(:disabled) {
    background-color: var(--color-error-hover);
    border-color: var(--color-error-hover);
    color: #FFFFFF;
  }

  .btn-ghost {
    background-color: transparent;
    border-color: transparent;
    color: var(--brand-700);
  }

  .btn-ghost:hover:not(:disabled) {
    background-color: var(--brand-50);
    color: var(--brand-900);
  }

  .btn-sm {
    min-height: 44px;
    padding: 8px 12px;
    font-size: 0.875rem;
  }

  /* Forms (8px radius, min 44px height, >= 3:1 control border contrast) */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-4);
  }

  .form-label {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--color-text);
  }

  .form-input,
  .form-select,
  .form-textarea {
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    font-family: var(--font-sans);
    font-size: 1rem;
    line-height: 1.5;
    color: var(--color-text);
    background-color: var(--color-surface);
    border: 1px solid var(--color-border-control);
    border-radius: var(--radius-control);
  }

  .form-textarea {
    min-height: 108px;
    resize: vertical;
  }

  .form-input:hover:not(:disabled),
  .form-select:hover:not(:disabled),
  .form-textarea:hover:not(:disabled) {
    border-color: var(--brand-700);
  }

  .form-input:focus-visible,
  .form-select:focus-visible,
  .form-textarea:focus-visible {
    outline: 2px solid var(--brand-700);
    outline-offset: 1px;
    border-color: var(--brand-700);
  }

  .form-input:disabled,
  .form-select:disabled,
  .form-textarea:disabled {
    background-color: var(--color-surface-subtle);
    color: var(--color-text-secondary);
    cursor: not-allowed;
  }

  .form-hint {
    font-size: 0.875rem;
    color: var(--color-text-secondary);
  }

  .form-error {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--color-error);
  }

  .form-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
    padding-top: var(--space-2);
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    font-size: 0.8125rem;
    font-weight: 600;
    line-height: 1.3;
    border-radius: 6px;
    border: 1px solid transparent;
    white-space: nowrap;
  }

  .badge-success {
    background-color: var(--color-success-bg);
    color: var(--color-success);
    border-color: #BBF7D0;
  }

  .badge-warning {
    background-color: var(--color-warning-bg);
    color: var(--color-warning);
    border-color: #FDE68A;
  }

  .badge-danger {
    background-color: var(--color-error-bg);
    color: var(--color-error);
    border-color: #FECACA;
  }

  .badge-neutral {
    background-color: var(--color-surface-subtle);
    color: var(--color-text);
    border-color: var(--color-border);
  }

  .badge-brand {
    background-color: var(--brand-50);
    color: var(--brand-700);
    border-color: var(--brand-100);
  }

  /* Tables & Responsive Card Reflow */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
  }

  .table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9375rem;
    text-align: left;
  }

  .table th {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--color-text-secondary);
    padding: 12px 14px;
    border-bottom: 1px solid var(--color-border);
    white-space: nowrap;
  }

  .table td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--color-border);
    vertical-align: top;
    color: var(--color-text);
  }

  .table tbody tr:last-child td {
    border-bottom: 0;
  }

  .clickable-row {
    cursor: pointer;
    transition: background-color 0.12s ease;
  }

  .clickable-row:hover {
    background-color: var(--brand-50);
  }

  .pagination {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
    border-top: 1px solid var(--color-border);
  }

  /* Alerts */
  .alert {
    padding: var(--space-4);
    border-radius: var(--radius-control);
    border: 1px solid var(--color-border);
    font-size: 0.9375rem;
    display: flex;
    align-items: flex-start;
    gap: var(--space-3);
  }

  .alert svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .alert-error {
    background-color: var(--color-error-bg);
    border-color: #FECACA;
    color: var(--color-error);
  }

  .alert-success {
    background-color: var(--color-success-bg);
    border-color: #BBF7D0;
    color: var(--color-success);
  }

  .alert-warning {
    background-color: var(--color-warning-bg);
    border-color: #FDE68A;
    color: var(--color-warning);
  }

  .alert-info {
    background-color: var(--brand-50);
    border-color: var(--brand-100);
    color: var(--brand-900);
  }

  /* UI States (Empty / Loading / Error) */
  .empty-state,
  .loading-state,
  .error-state {
    background-color: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    padding: var(--space-8) var(--space-5);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-3);
  }

  .error-state {
    border-color: #FECACA;
    background-color: var(--color-error-bg);
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--brand-100);
    border-top-color: var(--brand-700);
    border-radius: 50%;
    animation: sw-spin 0.8s linear infinite;
  }

  @keyframes sw-spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* Timeline */
  .timeline {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  .timeline-item {
    position: relative;
    padding-left: var(--space-5);
    border-left: 2px solid var(--color-border);
  }

  .timeline-item::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: var(--brand-700);
  }

  /* Modals */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background-color: rgba(27, 38, 35, 0.52);
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4);
  }

  .modal-dialog {
    width: 100%;
    max-width: 540px;
    max-height: 90vh;
    overflow-y: auto;
    background-color: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-sm);
  }

  .modal-header {
    padding: var(--space-4) var(--space-5);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .modal-title {
    margin: 0;
    font-size: 1.125rem;
    font-weight: 700;
  }

  .modal-body {
    padding: var(--space-5);
  }

  .modal-footer {
    padding: var(--space-4) var(--space-5);
    border-top: 1px solid var(--color-border);
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: var(--space-3);
  }

  /* Toasts */
  .toast-container {
    position: fixed;
    right: var(--space-4);
    bottom: var(--space-4);
    z-index: 70;
    display: flex;
