<script>
(function () {
  'use strict';

  window.SIWARGA_VIEWS = window.SIWARGA_VIEWS || {};

  function guardLoggedIn() {
    var SW = window.SW;
    var user = SW.auth.getUser();
    if (!user) {
      return null;
    }
    return user;
  }

  function formatMultilineEsc(text) {
    var SW = window.SW;
    return SW.esc(text || '').replace(/\r\n|\r|\n/g, '<br>');
  }

  function renderFieldError(id, msg) {
    var SW = window.SW;
    if (!msg) {
      return '<span id="' + SW.esc(id) + '" class="form-error" hidden></span>';
    }
    return '<span id="' + SW.esc(id) + '" class="form-error">' + SW.esc(msg) + '</span>';
  }

  function setFormError(rootEl, inputId, errorId, msg) {
    var inp = rootEl.querySelector('#' + inputId);
    var err = rootEl.querySelector('#' + errorId);
    if (err) {
      err.textContent = msg || '';
      err.hidden = !msg;
    }
    if (inp) {
      if (msg) {
        inp.setAttribute('aria-invalid', 'true');
      } else {
        inp.removeAttribute('aria-invalid');
      }
    }
  }

  function renderPengumumanItems(items) {
    var SW = window.SW;
    if (!items || items.length === 0) {
      return SW.renderEmpty({
        title: 'Belum ada pengumuman',
        message: 'Pengumuman dari pengurus RT dan RW akan tampil di sini.',
        icon: 'megaphone'
      });
    }
    var html = '<div class="stack-sm">';
    for (var i = 0; i < items.length; i++) {
      var pg = items[i];
      var excerpt = String(pg.isi || '');
      if (excerpt.length > 160) {
        excerpt = excerpt.slice(0, 160) + '...';
      }
      html +=
        '<a href="#/pengumuman/' + SW.esc(pg.id) + '" class="card clickable-row" style="text-decoration:none;color:inherit;display:block;">' +
          '<div class="card-body stack-sm">' +
            '<div class="row-between">' +
              SW.statusBadge('lingkup', pg.lingkup) +
              '<span class="text-sm text-muted">' + SW.esc(SW.formatDateTime(pg.createdAt)) + '</span>' +
            '</div>' +
            '<h3 style="margin-bottom:0;">' + SW.esc(pg.judul) + '</h3>' +
            '<p class="text-sm text-muted measure-70ch" style="margin-bottom:0;">' + SW.esc(excerpt) + '</p>' +
          '</div>' +
        '</a>';
    }
    html += '</div>';
    return html;
  }

  // =========================================================================
  // 1. /dashboard (Task 1.4 - Adaptive 3 Variants)
  // =========================================================================
  window.SIWARGA_VIEWS['/dashboard'] = {
    title: 'Dashboard',

    render: function () {
      var SW = window.SW;
      var user = guardLoggedIn();
      if (!user) {
        return SW.renderLoading('Mengarahkan ke halaman masuk...');
      }

      var sim = SW.getSimState();
      if (sim === 'loading') {
        return SW.renderLoading('Memuat ringkasan dashboard...');
      }
      if (sim === 'empty') {
        return SW.renderEmpty({
          title: 'Data dashboard belum tersedia',
          message: 'Belum ada aktivitas kependudukan, surat, atau kas yang tercatat.',
          icon: 'home'
        });
      }
      if (sim === 'error') {
        return SW.renderError({
          title: 'Gagal memuat dashboard',
          message: 'Ringkasan data tidak dapat dimuat saat ini. Silakan coba lagi.'
        });
      }

      var rtLabel = user.rt ? 'RT ' + user.rt.nomorRt : 'RT';
      var rwLabel = 'RW ' + (user.rw ? user.rw.nomorRw : '007');
      var headerHtml =
        '<div class="page-header">' +
          '<div>' +
            '<h1 class="page-title">Halo, ' + SW.esc(user.nama) + '</h1>' +
            '<p class="page-subtitle">' +
              SW.esc(user.jabatan ? user.jabatan : SW.getRoleLabel(user.role)) +
              ' di ' + SW.esc(rtLabel) + ' / ' + SW.esc(rwLabel) +
              (user.rw ? ', Kelurahan ' + SW.esc(user.rw.namaKelurahan) : '') +
            '</p>' +
          '</div>' +
        '</div>';

      if (user.role === 'PENGURUS_RT') {
        var rtData = SW.api.getDashboardRt(user.rtId);
        var wargaRtData = SW.api.getDashboardWarga(user);
        return (
          '<div class="stack-lg">' +
            headerHtml +
            '<div class="dashboard-hero-grid">' +
              '<section class="card card-highlight" aria-labelledby="dash-rt-kas">' +
                '<div class="card-header">' +
                  '<h2 id="dash-rt-kas" style="font-size:1.125rem;margin-bottom:0;">Saldo Kas ' + SW.esc(rtLabel) + '</h2>' +
                  SW.icon('wallet') +
                '</div>' +
                '<div class="card-body stack-md">' +
                  '<div class="text-mono" style="font-size:2rem;font-weight:700;line-height:1.2;">' + SW.esc(SW.formatRupiah(rtData.kasRt.saldo)) + '</div>' +
                  '<div class="stats-grid">' +
                    '<div><div class="text-sm text-muted">Total Pemasukan</div><div class="text-mono" style="font-weight:600;">' + SW.esc(SW.formatRupiah(rtData.kasRt.pemasukan)) + '</div></div>' +
                    '<div><div class="text-sm text-muted">Total Pengeluaran</div><div class="text-mono" style="font-weight:600;">' + SW.esc(SW.formatRupiah(rtData.kasRt.pengeluaran)) + '</div></div>' +
                  '</div>' +
                  '<div class="row-gap">' +
                    '<a href="#/rt/kas" class="btn btn-secondary btn-sm">Buka Buku Kas RT</a>' +
                    '<a href="#/rt/kas/setoran/baru" class="btn btn-secondary btn-sm">Setor ke RW</a>' +
                  '</div>' +
                '</div>' +
              '</section>' +
              '<div class="stats-grid">' +
                '<section class="card" aria-labelledby="dash-rt-pop">' +
                  '<div class="card-body stack-sm">' +
                    '<div class="row-between">' +
                      '<h2 id="dash-rt-pop" style="font-size:1rem;margin-bottom:0;">Kependudukan ' + SW.esc(rtLabel) + '</h2>' +
                      SW.icon('users') +
                    '</div>' +
                    '<div class="row-between"><span class="text-sm text-muted">Jumlah KK</span><strong class="text-mono">' + SW.esc(rtData.jumlahKk) + ' KK</strong></div>' +
                    '<div class="row-between"><span class="text-sm text-muted">Jiwa AKTIF</span><strong class="text-mono">' + SW.esc(rtData.jiwaAktifTotal) + ' jiwa</strong></div>' +
                    '<div class="row-between text-sm"><span class="text-muted">Tetap / Kontrak-Kos</span><span class="text-mono">' + SW.esc(rtData.jiwaAktifTetap) + ' / ' + SW.esc(rtData.jiwaAktifKontrak) + '</span></div>' +
                    '<div><a href="#/rt/penduduk" class="btn btn-ghost btn-sm" style="padding-left:0;">Kelola Penduduk</a></div>' +
                  '</div>' +
                '</section>' +
                '<section class="card" aria-labelledby="dash-rt-queue">' +
                  '<div class="card-body stack-sm">' +
                    '<div class="row-between">' +
                      '<h2 id="dash-rt-queue" style="font-size:1rem;margin-bottom:0;">Antrean Tindakan RT</h2>' +
                      SW.icon('clock') +
                    '</div>' +
                    '<div class="row-between">' +
                      '<span class="text-sm text-muted">Surat DIAJUKAN</span>' +
                      '<a href="#/rt/surat" class="badge badge-warning" style="text-decoration:none;">' + SW.esc(rtData.suratDiajukanCount) + ' antrean</a>' +
                    '</div>' +
                    '<div class="row-between">' +
                      '<span class="text-sm text-muted">Iuran MENUNGGU_VERIFIKASI</span>' +
                      '<a href="#/rt/iuran" class="badge badge-warning" style="text-decoration:none;">' + SW.esc(rtData.iuranMenungguCount) + ' antrean</a>' +
                    '</div>' +
                  '</div>' +
                '</section>' +
              '</div>' +
            '</div>' +
            '<section class="stack-sm" aria-labelledby="dash-rt-warga">' +
              '<h2 id="dash-rt-warga" style="font-size:1.125rem;">Status Pribadi Anda</h2>' +
              '<div class="stats-grid">' +
                '<div class="card"><div class="card-body row-between"><div><div class="text-sm text-muted">Iuran ' + SW.esc(SW.formatPeriode(wargaRtData.periodeBerjalan)) + '</div><div>' + SW.statusBadge('iuran', wargaRtData.statusIuran) + '</div></div><a href="#/iuran" class="btn btn-secondary btn-sm">Lihat Iuran</a></div></div>' +
                '<div class="card"><div class="card-body row-between"><div><div class="text-sm text-muted">Surat KK Anda</div><div>' + (wargaRtData.suratAktif ? SW.statusBadge('surat', wargaRtData.suratAktif.status) : '<span class="text-sm">Tidak ada surat yang sedang diproses</span>') + '</div></div><a href="#/surat" class="btn btn-secondary btn-sm">Lihat Surat</a></div></div>' +
              '</div>' +
            '</section>' +
            '<section class="stack-sm" aria-labelledby="dash-pengumuman-rt">' +
              '<div class="row-between">' +
                '<h2 id="dash-pengumuman-rt" style="font-size:1.125rem;margin-bottom:0;">5 Pengumuman Terbaru</h2>' +
                '<a href="#/pengumuman" class="btn btn-ghost btn-sm">Lihat Semua</a>' +
              '</div>' +
              renderPengumumanItems(wargaRtData.pengumumanTerbaru) +
            '</section>' +
          '</div>'
        );
      }

      if (user.role === 'PENGURUS_RW') {
        var rwData = SW.api.getDashboardRw();
        var rekapRows = '';
        for (var r = 0; r < rwData.rekapRt.length; r++) {
          var row = rwData.rekapRt[r];
          rekapRows +=
            '<tr>' +
              '<td data-label="Nomor RT"><strong>RT ' + SW.esc(row.nomorRt) + '</strong></td>' +
              '<td data-label="Jumlah KK" class="text-mono">' + SW.esc(row.jumlahKk) + '</td>' +
              '<td data-label="Jiwa AKTIF" class="text-mono">' + SW.esc(row.jiwaAktif) + '</td>' +
              '<td data-label="Jiwa Tetap" class="text-mono">' + SW.esc(row.jiwaTetap) + '</td>' +
              '<td data-label="Jiwa Kontrak/Kos" class="text-mono">' + SW.esc(row.jiwaKontrak) + '</td>' +
              '<td data-label="Saldo Kas RT" class="text-mono">' + SW.esc(SW.formatRupiah(row.saldoKasRt)) + '</td>' +
            '</tr>';
        }
        return (
          '<div class="stack-lg">' +
            headerHtml +
            '<div class="dashboard-hero-grid">' +
              '<section class="card card-highlight" aria-labelledby="dash-rw-kas">' +
                '<div class="card-header">' +
                  '<h2 id="dash-rw-kas" style="font-size:1.125rem;margin-bottom:0;">Saldo Kas ' + SW.esc(rwLabel) + '</h2>' +
                  SW.icon('wallet') +
                '</div>' +
                '<div class="card-body stack-md">' +
                  '<div class="text-mono" style="font-size:2rem;font-weight:700;line-height:1.2;">' + SW.esc(SW.formatRupiah(rwData.kasRw.saldo)) + '</div>' +
                  '<div class="text-sm text-muted">Menunggu konfirmasi setoran RT: <strong class="text-mono" style="color:#FFFFFF;">' + SW.esc(SW.formatRupiah(rwData.kasRw.menungguKonfirmasi)) + '</strong></div>' +
                  '<div><a href="#/rw/setoran" class="btn btn-secondary btn-sm">Konfirmasi Setoran</a></div>' +
                '</div>' +
              '</section>' +
              '<div class="stats-grid">' +
                '<section class="card" aria-labelledby="dash-rw-pop">' +
                  '<div class="card-body stack-sm">' +
                    '<div class="row-between">' +
                      '<h2 id="dash-rw-pop" style="font-size:1rem;margin-bottom:0;">Populasi Se-' + SW.esc(rwLabel) + '</h2>' +
                      SW.icon('users') +
                    '</div>' +
                    '<div class="row-between"><span class="text-sm text-muted">Total KK</span><strong class="text-mono">' + SW.esc(rwData.jumlahKk) + ' KK</strong></div>' +
                    '<div class="row-between"><span class="text-sm text-muted">Jiwa AKTIF</span><strong class="text-mono">' + SW.esc(rwData.jiwaAktifTotal) + ' jiwa</strong></div>' +
                    '<div><a href="#/rw/rekap" class="btn btn-ghost btn-sm" style="padding-left:0;">Lihat Rekap Antar-RT</a></div>' +
                  '</div>' +
                '</section>' +
                '<section class="card" aria-labelledby="dash-rw-queue">' +
                  '<div class="card-body stack-sm">' +
                    '<div class="row-between">' +
                      '<h2 id="dash-rw-queue" style="font-size:1rem;margin-bottom:0;">Antrean Pengurus RW</h2>' +
                      SW.icon('shield-check') +
                    '</div>' +
                    '<div class="row-between">' +
                      '<span class="text-sm text-muted">Surat DISETUJUI_RT</span>' +
                      '<a href="#/rw/surat" class="badge badge-brand" style="text-decoration:none;">' + SW.esc(rwData.suratDisetujuiRtCount) + ' antrean</a>' +
                    '</div>' +
                    '<div class="row-between">' +
                      '<span class="text-sm text-muted">Setoran MENUNGGU_KONFIRMASI</span>' +
                      '<a href="#/rw/setoran" class="badge badge-warning" style="text-decoration:none;">' + SW.esc(rwData.setoranMenungguCount) + ' antrean</a>' +
                    '</div>' +
                  '</div>' +
                '</section>' +
              '</div>' +
            '</div>' +
            '<section class="card" aria-labelledby="dash-rw-rekap">' +
              '<div class="card-header">' +
                '<h2 id="dash-rw-rekap" style="font-size:1.125rem;margin-bottom:0;">Komparasi Antar-RT</h2>' +
                '<a href="#/rw/rekap" class="btn btn-secondary btn-sm">Buka Rekap Lengkap</a>' +
              '</div>' +
              '<div class="table-wrap">' +
                '<table class="table responsive-table">' +
                  '<thead>' +
                    '<tr>' +
                      '<th>Nomor RT</th>' +
                      '<th>Jumlah KK</th>' +
                      '<th>Jiwa AKTIF</th>' +
                      '<th>Jiwa Tetap</th>' +
                      '<th>Jiwa Kontrak/Kos</th>' +
                      '<th>Saldo Kas RT</th>' +
                    '</tr>' +
                  '</thead>' +
                  '<tbody>' + rekapRows + '</tbody>' +
                '</table>' +
              '</div>' +
            '</section>' +
          '</div>'
        );
      }

      // Default: Warga variant
      var wargaData = SW.api.getDashboardWarga(user);
      var suratCardBody = '';
      if (wargaData.suratAktif) {
        suratCardBody =
          '<div class="stack-sm">' +
            '<div style="font-weight:600;">' + SW.esc(SW.getJenisSuratLabel(wargaData.suratAktif.jenis)) + '</div>' +
            '<div>' + SW.statusBadge('surat', wargaData.suratAktif.status) + '</div>' +
            '<div class="text-sm text-muted">Diajukan ' + SW.esc(SW.formatDate(wargaData.suratAktif.createdAt)) + '</div>' +
            '<div><a href="#/surat/' + SW.esc(wargaData.suratAktif.id) + '" class="btn btn-secondary btn-sm">Lihat Detail Surat</a></div>' +
          '</div>';
      } else {
        suratCardBody =
          '<div class="stack-sm">' +
            '<p class="text-sm text-muted" style="margin-bottom:0;">Tidak ada surat yang sedang diproses.</p>' +
            '<div><a href="#/surat/baru" class="btn btn-primary btn-sm">Ajukan Surat</a></div>' +
          '</div>';
      }

      var iuranBtnHtml = (wargaData.statusIuran === 'BELUM_BAYAR' || wargaData.statusIuran === 'DITOLAK')
        ? '<a href="#/iuran/baru" class="btn btn-primary btn-sm">Bayar Iuran</a>'
        : '<a href="#/iuran" class="btn btn-secondary btn-sm">Lihat Riwayat Iuran</a>';

      return (
        '<div class="stack-lg">' +
          headerHtml +
          '<div class="dashboard-hero-grid">' +
            '<section class="card card-highlight" aria-labelledby="dash-warga-kas">' +
              '<div class="card-header">' +
                '<h2 id="dash-warga-kas" style="font-size:1.125rem;margin-bottom:0;">Transparansi Saldo Kas</h2>' +
                SW.icon('wallet') +
              '</div>' +
              '<div class="card-body stack-md">' +
                '<div>' +
                  '<div class="text-sm text-muted">Saldo Kas ' + SW.esc(rtLabel) + '</div>' +
                  '<div class="text-mono" style="font-size:2rem;font-weight:700;line-height:1.2;">' + SW.esc(SW.formatRupiah(wargaData.kasRt.saldo)) + '</div>' +
                '</div>' +
                '<div class="stats-grid">' +
                  '<div>' +
                    '<div class="text-sm text-muted">Saldo Kas ' + SW.esc(rwLabel) + '</div>' +
                    '<div class="text-mono" style="font-size:1.25rem;font-weight:700;">' + SW.esc(SW.formatRupiah(wargaData.kasRw.saldo)) + '</div>' +
                  '</div>' +
                  '<div>' +
                    '<div class="text-sm text-muted">Pemasukan / Pengeluaran ' + SW.esc(rtLabel) + '</div>' +
                    '<div class="text-sm text-mono">' + SW.esc(SW.formatRupiah(wargaData.kasRt.pemasukan)) + ' / ' + SW.esc(SW.formatRupiah(wargaData.kasRt.pengeluaran)) + '</div>' +
                  '</div>' +
                '</div>' +
                '<div><a href="#/kas" class="btn btn-secondary btn-sm">Lihat Rincian Kas</a></div>' +
              '</div>' +
            '</section>' +

            '<div class="stats-grid">' +
              '<section class="card" aria-labelledby="dash-warga-iuran">' +
                '<div class="card-body stack-sm">' +
                  '<div class="row-between">' +
                    '<h2 id="dash-warga-iuran" style="font-size:1rem;margin-bottom:0;">Iuran ' + SW.esc(SW.formatPeriode(wargaData.periodeBerjalan)) + '</h2>' +
                    SW.icon('receipt') +
                  '</div>' +
                  '<div>' + SW.statusBadge('iuran', wargaData.statusIuran) + '</div>' +
                  '<div>' + iuranBtnHtml + '</div>' +
                '</div>' +
              '</section>' +

              '<section class="card" aria-labelledby="dash-warga-surat">' +
                '<div class="card-body stack-sm">' +
                  '<div class="row-between">' +
                    '<h2 id="dash-warga-surat" style="font-size:1rem;margin-bottom:0;">Surat Aktif KK</h2>' +
                    SW.icon('file-text') +
                  '</div>' +
                  suratCardBody +
                '</div>' +
              '</section>' +
            '</div>' +
          '</div>' +

          '<section class="stack-sm" aria-labelledby="dash-pengumuman">' +
            '<div class="row-between">' +
              '<h2 id="dash-pengumuman" style="font-size:1.125rem;margin-bottom:0;">5 Pengumuman Terbaru</h2>' +
              '<a href="#/pengumuman" class="btn btn-ghost btn-sm">Lihat Semua</a>' +
            '</div>' +
            renderPengumumanItems(wargaData.pengumumanTerbaru) +
          '</section>' +
        '</div>'
      );
    },

    mount: function () {}
  };

  // =========================================================================
  // 2. /keluarga (Task 1.5)
  // =========================================================================
  window.SIWARGA_VIEWS['/keluarga'] = {
    title: 'Anggota KK',

    render: function () {
      var SW = window.SW;
      var user = guardLoggedIn();
      if (!user) {
        return SW.renderLoading('Mengarahkan ke halaman masuk...');
      }

      var sim = SW.getSimState();
      if (sim === 'loading') {
        return SW.renderLoading('Memuat data Kartu Keluarga...');
      }
      if (sim === 'empty') {
        return SW.renderEmpty({
          title: 'Belum ada anggota KK',
          message: 'Data Kartu Keluarga Anda belum memiliki anggota terdaftar.',
          icon: 'users'
        });
      }
      if (sim === 'error') {
        return SW.renderError({
          title: 'Gagal memuat data keluarga',
          message: 'Data Kartu Keluarga tidak dapat ditampilkan saat ini. Silakan coba lagi.'
        });
      }

      var data = SW.api.getKeluargaByKkId(user.kkId);
      if (!data) {
        return SW.renderError({
          title: 'Kartu Keluarga tidak ditemukan',
          message: 'Data Kartu Keluarga Anda belum terdaftar di sistem.'
        });
      }

      var kk = data.kk;
      var rt = data.rt;
      var isKepala = Boolean(user.isKepalaKeluarga);

      var infoBanner = '';
      if (!isKepala) {
        infoBanner =
          '<div class="alert alert-info" role="status">' +
            SW.icon('info') +
            '<span>Penambahan dan perubahan data anggota KK hanya dapat dilakukan oleh <strong>Kepala Keluarga</strong>. Anda tetap dapat melihat daftar anggota KK Anda di bawah ini.</span>' +
          '</div>';
      }

      var rowsHtml = '';
      for (var i = 0; i < data.anggota.length; i++) {
        var m = data.anggota[i];
        var actionBtn = isKepala
          ? '<button type="button" class="btn btn-secondary btn-sm sw-btn-edit-anggota" data-member-id="' + SW.esc(m.id) + '">Ubah</button>'
          : '<button type="button" class="btn btn-secondary btn-sm" disabled title="Khusus Kepala Keluarga">Ubah</button>';

        rowsHtml +=
          '<tr>' +
            '<td data-label="Nama"><strong>' + SW.esc(m.nama) + '</strong></td>' +
            '<td data-label="NIK" class="text-mono">' + SW.esc(m.nik) + '</td>' +
            '<td data-label="Tempat, Tgl Lahir">' + SW.esc(m.tempatLahir) + ', ' + SW.esc(SW.formatDate(m.tanggalLahir)) + '</td>' +
            '<td data-label="JK">' + SW.esc(m.jenisKelamin) + '</td>' +
            '<td data-label="Hubungan">' + SW.esc(SW.getHubunganLabel(m.hubunganKeluarga)) + '</td>' +
            '<td data-label="Status">' + SW.statusBadge('mutasi', m.statusMutasi) + '</td>' +
            '<td data-label="Aksi">' + actionBtn + '</td>' +
          '</tr>';
      }

      var addBtn = isKepala
        ? '<button type="button" id="btn-add-anggota" class="btn btn-primary">' + SW.icon('plus') + '<span>Tambah Anggota</span></button>'
        : '<button type="button" class="btn btn-primary" disabled title="Khusus Kepala Keluarga">' + SW.icon('plus') + '<span>Tambah Anggota</span></button>';

      return (
        '<div class="stack-lg">' +
          '<div class="page-header">' +
            '<div>' +
              '<h1 class="page-title">Anggota Kartu Keluarga</h1>' +
              '<p class="page-subtitle">Daftar anggota keluarga yang tercatat dalam satu Nomor KK.</p>' +
            '</div>' +
            addBtn +
          '</div>' +
          infoBanner +
          '<div id="keluarga-pin-banner"></div>' +
          '<section class="card" aria-labelledby="kk-group-title">' +
            '<div class="card-header">' +
              '<div class="stack-sm">' +

            '<div class="table-wrap">' +

                '<thead>' +
                  '<tr>' +

              '</table>' +

        var rowEls = container.querySelectorAll('tr[data-href]');
        for (var r = 0; r < rowEls.length; r++) {
          rowEls[r].addEventListener('click', function (ev) {
            if (ev.target && ev.target.closest('a, button')) {
              return;

        var pageBtns = container.querySelectorAll('[data-surat-page]');

          pageBtns[p].addEventListener('click', function () {
            currentPage = Number(this.getAttribute('data-surat-page')) || 1;
            renderList();
          });
        }
      }

      renderList();
    }
  };

          if (alertBox) { alertBox.hidden = true; }

          var periode = rootEl.querySelector('#iuran-periode').value.trim();
          var nominal = Number(rootEl.querySelector('#iuran-nominal').value);
          var file = fileInput && fileInput.files ? fileInput.files[0] : null;
          var hasError = false;

          if (!SW.validators.isPeriode(periode)) {
            setFormError(rootEl, 'iuran-periode', 'iuran-periode-error', 'Periode wajib format YYYY-MM dan tidak melebihi bulan berjalan.');
            hasError = true;
          } else {
            setFormError(rootEl, 'iuran-periode', 'iuran-periode-error', '');
          }

          if (!SW.validators.isIntInRange(nominal, 1000, 5000000)) {
            setFormError(rootEl, 'iuran-nominal', 'iuran-nominal-error', 'Nominal wajib angka bulat antara Rp 1.000 sampai Rp 5.000.000.');

            setFormError(rootEl, 'iuran-bukti', 'iuran-bukti-error', '');
          }

          if (hasError) {
            return;
          }

          var submitBtn = form.querySelector('button[type="submit"]');
          var origBtnHtml = submitBtn ? submitBtn.innerHTML : '';
          function setSubmitting(loading) {
            if (submitBtn) {
              submitBtn.disabled = loading;
              if (loading) {
                submitBtn.textContent = 'Mengunggah...';
              } else {
                submitBtn.innerHTML = origBtnHtml;
              }
            }
          }

          function sendPayload(fileBase64, mimeType) {
            SW.api.submitIuranAsync({
              periode: periode,
              nominal: nominal,
              metodeBayar: 'TRANSFER_BANK',
              fileName: file.name,
              mimeType: mimeType,
              fileBase64: fileBase64,
              buktiKey: file.name
            }, function () {
              SW.toast('Konfirmasi pembayaran iuran berhasil dikirim.', 'success');
              SW.navigate('/iuran');
            }, function (err) {
              setSubmitting(false);
              if (alertBox) {
                alertBox.innerHTML = SW.icon('alert-circle') + '<span>' + SW.esc((err && err.error) ? err.error : 'Gagal mengirim konfirmasi iuran.') + '</span>';
                alertBox.hidden = false;
              }
            });
          }

          var guessedMime = file.type || (/\.pdf$/i.test(file.name) ? 'application/pdf' : (/\.png$/i.test(file.name) ? 'image/png' : 'image/jpeg'));
          setSubmitting(true);

          if (SW.isGasRuntime() && typeof window.FileReader !== 'undefined') {
            var fileReader = new FileReader();
            fileReader.onload = function (readEv) {
              var dataUrl = (readEv && readEv.target && readEv.target.result) ? String(readEv.target.result) : '';
              var commaIdx = dataUrl.indexOf(',');
              var base64Part = commaIdx !== -1 ? dataUrl.slice(commaIdx + 1) : dataUrl;
              sendPayload(base64Part, guessedMime);
            };
            fileReader.onerror = function () {
              setSubmitting(false);
              if (alertBox) {
                alertBox.innerHTML = SW.icon('alert-circle') + '<span>Gagal membaca berkas bukti transfer. Silakan pilih ulang berkas.</span>';
                alertBox.hidden = false;
              }
            };
            fileReader.readAsDataURL(file);
          } else {
            sendPayload('', guessedMime);
          }
        });
      }
    }
  };

              message: 'Pengumuman tidak tersedia atau bukan untuk wilayah RT Anda.'
            }) +
            '<div><a href="#/pengumuman" class="btn btn-secondary">' + SW.icon('arrow-left') + '<span>Kembali ke Pengumuman</span></a></div>' +
          '</div>'
        );
      }

      var author = SW.api.getPenduduk(pg.dibuatOlehId);
      var authorName = (author && author.nama) ? author.nama : (pg.dibuatOlehNama || 'Pengurus');
      var authorJabatan = (author && author.jabatan) ? author.jabatan : (pg.dibuatOlehJabatan || '');
      var baseUrl = '';
      if (typeof SW.buildAnnouncementUrl === 'function') {
        baseUrl = SW.buildAnnouncementUrl(pg.id);
      } else {
        try {
          baseUrl = window.location.href.split('#')[0] + '#/pengumuman/' + pg.id;
        } catch (e) {
          baseUrl = '#/pengumuman/' + pg.id;
        }
      }
      var isiSnippet = String(pg.isi || '');
      if (isiSnippet.length > 200) {
        isiSnippet = isiSnippet.slice(0, 200) + '...';
      }
      var waText = pg.judul + '\n\n' + isiSnippet + '\n\nBaca selengkapnya: ' + baseUrl;

      return (
        '<div class="stack-lg">' +
          '<div class="page-header">' +
            '<div>' +
              '<div class="row-gap" style="margin-bottom:8px;">' +
                SW.statusBadge('lingkup', pg.lingkup) +
                '<span class="text-sm text-muted">' + SW.esc(SW.formatDateTime(pg.createdAt)) + '</span>' +
              '</div>' +
              '<h1 class="page-title">' + SW.esc(pg.judul) + '</h1>' +
              '<p class="page-subtitle">Diterbitkan oleh ' + SW.esc(authorName) + (authorJabatan ? ' (' + SW.esc(authorJabatan) + ')' : '') + '</p>' +
            '</div>' +
            '<a href="#/pengumuman" class="btn btn-secondary">' + SW.icon('arrow-left') + '<span>Kembali</span></a>' +
          '</div>' +

          '<article class="card">' +
            '<div class="card-body stack-md">' +
              '<div class="measure-70ch" style="white-space:pre-wrap;">' + SW.esc(pg.isi) + '</div>' +
              '<div class="form-actions">' +
                '<a href="' + SW.esc(SW.buildWaUrl(waText)) + '" target="_blank" rel="noopener noreferrer" class="btn btn-primary">' +
                  SW.icon('share-2') +
                  '<span>Bagikan ke WhatsApp</span>' +
                '</a>' +
              '</div>' +
            '</div>' +
          '</article>' +
        '</div>'
      );
    },

    mount: function () {}
  };

  // =========================================================================
  // 11. /laporan/baru (Task 1.17)
  // =========================================================================
  window.SIWARGA_VIEWS['/laporan/baru'] = {
    title: 'Kirim Laporan',

    render: function () {
      var SW = window.SW;
      var user = guardLoggedIn();
      if (!user) {
        return SW.renderLoading('Mengarahkan ke halaman masuk...');
      }
      var sim = SW.getSimState();
      if (sim === 'loading') {
        return SW.renderLoading('Menyiapkan formulir laporan warga...');
      }
      if (sim === 'empty') {
        return SW.renderEmpty({
          title: 'Formulir laporan tidak tersedia',
          message: 'Pengurus RT belum mengaktifkan penerimaan laporan.',
          icon: 'alert-circle'
        });
      }
      if (sim === 'error') {
        return SW.renderError({
          title: 'Gagal memuat formulir laporan',
          message: 'Terjadi gangguan saat menyiapkan formulir laporan warga.'
        });
      }

      var rtLabel = user.rt ? 'RT ' + user.rt.nomorRt : 'RT Anda';

      return (
        '<div class="stack-lg">' +
          '<div class="page-header">' +
            '<div>' +
              '<h1 class="page-title">Kirim Laporan atau Aspirasi</h1>' +
              '<p class="page-subtitle">Laporan Anda diteruskan langsung ke Pengurus ' + SW.esc(rtLabel) + ' dan tidak ditampilkan ke warga lain.</p>' +
            '</div>' +
          '</div>' +

          '<div id="laporan-success-box"></div>' +

          '<section class="card">' +
            '<div class="card-body">' +
              '<form id="form-laporan-baru" class="stack-md" novalidate>' +
                '<div id="laporan-alert" class="alert alert-error" role="alert" hidden></div>' +
                '<div class="form-group">' +
                  '<label for="laporan-jenis" class="form-label">Jenis Laporan</label>' +
                  '<select id="laporan-jenis" class="form-select" required aria-describedby="laporan-jenis-error">' +
                    '<option value="">-- Pilih Jenis Laporan --</option>' +
                    '<option value="KEAMANAN">Keamanan Wilayah (KEAMANAN)</option>' +
                    '<option value="ASPIRASI">Aspirasi Warga (ASPIRASI)</option>' +
                  '</select>' +
                  renderFieldError('laporan-jenis-error', '') +
                '</div>' +
                '<div class="form-group">' +
                  '<label for="laporan-judul" class="form-label">Judul Laporan</label>' +
                  '<input type="text" id="laporan-judul" class="form-input" maxlength="150" placeholder="Ringkas dan jelas (5 sampai 150 karakter)" required aria-describedby="laporan-judul-hint laporan-judul-error">' +
                  '<div class="row-between">' +
                    '<span id="laporan-judul-hint" class="form-hint">5 sampai 150 karakter.</span>' +
                    '<span id="laporan-judul-count" class="form-hint text-mono">0 / 150</span>' +
                  '</div>' +
                  renderFieldError('laporan-judul-error', '') +
                '</div>' +
                '<div class="form-group">' +
                  '<label for="laporan-isi" class="form-label">Isi Laporan</label>' +
                  '<textarea id="laporan-isi" class="form-textarea" maxlength="2000" placeholder="Tuliskan kronologi, lokasi, atau usulan Anda (10 sampai 2.000 karakter)" required aria-describedby="laporan-isi-hint laporan-isi-error"></textarea>' +
                  '<div class="row-between">' +
                    '<span id="laporan-isi-hint" class="form-hint">10 sampai 2.000 karakter.</span>' +
                    '<span id="laporan-isi-count" class="form-hint text-mono">0 / 2000</span>' +
                  '</div>' +
                  renderFieldError('laporan-isi-error', '') +
                '</div>' +
                '<div class="form-actions">' +
                  '<button type="submit" class="btn btn-primary">' + SW.icon('alert-circle') + '<span>Kirim Laporan</span></button>' +
                '</div>' +
              '</form>' +
            '</div>' +
          '</section>' +
        '</div>'
      );
    },

    mount: function (rootEl) {
      var SW = window.SW;
      if (SW.getSimState() !== 'normal') {
        return;
      }
      var form = rootEl.querySelector('#form-laporan-baru');
      var judulEl = rootEl.querySelector('#laporan-judul');
      var isiEl = rootEl.querySelector('#laporan-isi');
      var judulCount = rootEl.querySelector('#laporan-judul-count');
      var isiCount = rootEl.querySelector('#laporan-isi-count');

      if (judulEl && judulCount) {
        judulEl.addEventListener('input', function () {
          judulCount.textContent = judulEl.value.length + ' / 150';
        });
      }
      if (isiEl && isiCount) {
        isiEl.addEventListener('input', function () {
          isiCount.textContent = isiEl.value.length + ' / 2000';
        });
      }

      if (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var alertBox = rootEl.querySelector('#laporan-alert');
          var successBox = rootEl.querySelector('#laporan-success-box');
          if (alertBox) { alertBox.hidden = true; }
          if (successBox) { successBox.innerHTML = ''; }

          var jenis = rootEl.querySelector('#laporan-jenis').value;
          var judul = judulEl ? judulEl.value.trim() : '';
          var isi = isiEl ? isiEl.value.trim() : '';
          var hasError = false;

          if (jenis !== 'KEAMANAN' && jenis !== 'ASPIRASI') {
            setFormError(rootEl, 'laporan-jenis', 'laporan-jenis-error', 'Pilih jenis laporan.');
            hasError = true;
          } else {
            setFormError(rootEl, 'laporan-jenis', 'laporan-jenis-error', '');
          }
          if (!SW.validators.isLength(judul, 5, 150)) {
            setFormError(rootEl, 'laporan-judul', 'laporan-judul-error', 'Judul wajib diisi antara 5 sampai 150 karakter.');
            hasError = true;
          } else {
            setFormError(rootEl, 'laporan-judul', 'laporan-judul-error', '');
          }
          if (!SW.validators.isLength(isi, 10, 2000)) {
            setFormError(rootEl, 'laporan-isi', 'laporan-isi-error', 'Isi laporan wajib diisi antara 10 sampai 2.000 karakter.');
            hasError = true;
          } else {
            setFormError(rootEl, 'laporan-isi', 'laporan-isi-error', '');
          }

          if (hasError) {
            return;
          }

          var submitBtn = form.querySelector('button[type="submit"]');
          var origBtnHtml = submitBtn ? submitBtn.innerHTML : '';
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Mengirim...';
          }

          SW.api.createLaporanAsync({ jenis: jenis, judul: judul, isi: isi }, function (res) {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = origBtnHtml;
            }
            form.reset();
            if (judulCount) { judulCount.textContent = '0 / 150'; }
            if (isiCount) { isiCount.textContent = '0 / 2000'; }
            SW.toast('Laporan berhasil dikirim ke Pengurus RT.', 'success');
            if (successBox) {
              var savedJudul = (res && res.laporan && res.laporan.judul) ? res.laporan.judul : judul;
              successBox.innerHTML =
                '<div class="alert alert-success" role="status">' +
                  SW.icon('check') +
                  '<div class="stack-sm">' +
                    '<div><strong>Laporan Terkirim</strong></div>' +
                    '<div>Laporan "' + SW.esc(savedJudul) + '" telah masuk ke kotak laporan Pengurus RT.</div>' +
                  '</div>' +
                '</div>';
            }
          }, function (err) {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = origBtnHtml;
            }
            if (alertBox) {
              alertBox.innerHTML = SW.icon('alert-circle') + '<span>' + SW.esc((err && err.error) ? err.error : 'Gagal mengirim laporan.') + '</span>';
              alertBox.hidden = false;
            }
          });
        });
      }
    }
  };

  // =========================================================================
  // 12. /akun/pin (Task 1.5)
  // =========================================================================
  window.SIWARGA_VIEWS['/akun/pin'] = {
    title: 'Ubah PIN',

    render: function () {
      var SW = window.SW;
      var user = guardLoggedIn();
      if (!user) {
        return SW.renderLoading('Mengarahkan ke halaman masuk...');
      }
      var sim = SW.getSimState();
      if (sim === 'loading') {
        return SW.renderLoading('Memuat halaman pengaturan PIN...');
      }
      if (sim === 'empty') {
        return SW.renderEmpty({
          title: 'Pengaturan PIN tidak tersedia',
          message: 'Akun Anda belum aktif untuk mengubah PIN.',
          icon: 'key'
        });
      }
      if (sim === 'error') {
        return SW.renderError({
          title: 'Gagal memuat pengaturan PIN',
          message: 'Terjadi gangguan saat memuat formulir ubah PIN.'
        });
      }

      return (
        '<div class="stack-lg">' +
          '<div class="page-header">' +
            '<div>' +
              '<h1 class="page-title">Ubah PIN Akun</h1>' +
              '<p class="page-subtitle">Ganti PIN sementara atau PIN lama Anda dengan PIN baru 6 digit angka yang mudah Anda ingat.</p>' +
            '</div>' +
          '</div>' +

          '<div id="pin-success-box"></div>' +

          '<section class="card" style="max-width:560px;">' +
            '<div class="card-body">' +
              '<form id="form-ubah-pin" class="stack-md" novalidate>' +
                '<div id="pin-alert" class="alert alert-error" role="alert" hidden></div>' +
                '<div class="form-group">' +
                  '<label for="pin-lama" class="form-label">PIN Lama</label>' +
                  '<input type="password" id="pin-lama" class="form-input text-mono" inputmode="numeric" autocomplete="current-password" maxlength="6" required aria-describedby="pin-lama-error">' +
                  renderFieldError('pin-lama-error', '') +
                '</div>' +
                '<div class="form-group">' +
                  '<label for="pin-baru" class="form-label">PIN Baru (6 digit)</label>' +
                  '<input type="password" id="pin-baru" class="form-input text-mono" inputmode="numeric" autocomplete="new-password" maxlength="6" required aria-describedby="pin-baru-hint pin-baru-error">' +
                  '<span id="pin-baru-hint" class="form-hint">Harus 6 digit angka dan tidak boleh sama dengan PIN lama.</span>' +
                  renderFieldError('pin-baru-error', '') +
                '</div>' +
                '<div class="form-group">' +
                  '<label for="pin-konfirmasi" class="form-label">Konfirmasi PIN Baru</label>' +
                  '<input type="password" id="pin-konfirmasi" class="form-input text-mono" inputmode="numeric" autocomplete="new-password" maxlength="6" required aria-describedby="pin-konfirmasi-error">' +
                  renderFieldError('pin-konfirmasi-error', '') +
                '</div>' +
                '<div class="form-actions">' +
                  '<button type="submit" class="btn btn-primary">' + SW.icon('key') + '<span>Simpan PIN Baru</span></button>' +
                '</div>' +
              '</form>' +
            '</div>' +
          '</section>' +
        '</div>'
      );
    },

    mount: function (rootEl) {
      var SW = window.SW;
      if (SW.getSimState() !== 'normal') {
        return;
      }
      var form = rootEl.querySelector('#form-ubah-pin');
      if (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var alertBox = rootEl.querySelector('#pin-alert');
          var successBox = rootEl.querySelector('#pin-success-box');
          if (alertBox) { alertBox.hidden = true; }
          if (successBox) { successBox.innerHTML = ''; }

          var oldPin = rootEl.querySelector('#pin-lama').value.trim();
          var newPin = rootEl.querySelector('#pin-baru').value.trim();
          var confirmPin = rootEl.querySelector('#pin-konfirmasi').value.trim();
          var hasError = false;

          if (!SW.validators.isPin(oldPin)) {
            setFormError(rootEl, 'pin-lama', 'pin-lama-error', 'PIN lama wajib berisi 6 digit angka.');
            hasError = true;
          } else {
            setFormError(rootEl, 'pin-lama', 'pin-lama-error', '');
          }

          if (!SW.validators.isPin(newPin)) {
            setFormError(rootEl, 'pin-baru', 'pin-baru-error', 'PIN baru wajib berisi 6 digit angka.');
            hasError = true;
          } else if (newPin === oldPin) {
            setFormError(rootEl, 'pin-baru', 'pin-baru-error', 'PIN baru tidak boleh sama dengan PIN lama.');
            hasError = true;
          } else {
            setFormError(rootEl, 'pin-baru', 'pin-baru-error', '');
          }

          if (!SW.validators.isPin(confirmPin)) {
            setFormError(rootEl, 'pin-konfirmasi', 'pin-konfirmasi-error', 'Konfirmasi PIN wajib berisi 6 digit angka.');
            hasError = true;
          } else if (confirmPin !== newPin) {
            setFormError(rootEl, 'pin-konfirmasi', 'pin-konfirmasi-error', 'Konfirmasi PIN baru tidak cocok.');
            hasError = true;
          } else {
            setFormError(rootEl, 'pin-konfirmasi', 'pin-konfirmasi-error', '');
          }

          if (hasError) {
            return;
          }

          var submitBtn = form.querySelector('button[type="submit"]');
          var origBtnHtml = submitBtn ? submitBtn.innerHTML : '';
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Menyimpan...';
          }

          SW.auth.changePinAsync(oldPin, newPin, confirmPin, function () {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = origBtnHtml;
            }
            form.reset();
            SW.toast('PIN akun berhasil diperbarui.', 'success');
            if (successBox) {
              successBox.innerHTML =
                '<div class="alert alert-success" role="status">' +
                  SW.icon('check') +
                  '<span>PIN Anda telah diperbarui. Gunakan PIN baru pada sesi masuk berikutnya.</span>' +
                '</div>';
            }
          }, function (err) {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = origBtnHtml;
            }
            if (alertBox) {
              alertBox.innerHTML = SW.icon('alert-circle') + '<span>' + SW.esc((err && err.error) ? err.error : 'Gagal memperbarui PIN.') + '</span>';
              alertBox.hidden = false;
            }
          });
        });
      }
    }
  };
})();
</script>
